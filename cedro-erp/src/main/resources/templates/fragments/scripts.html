	<script>
        function previewFoto3x4(input) {
            const placeholder = document.getElementById('fotoPlaceholder');
            const fotoExistente = document.getElementById('fotoExistente');
            const preview = document.getElementById('fotoPreview');
            const previewImg = document.getElementById('fotoPreviewImg');


            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();

                if (placeholder) placeholder.style.display = 'none';
                if (fotoExistente) fotoExistente.style.display = 'none';

                reader.onload = function(e) {
                    previewImg.src = e.target.result;

                    preview.style.display = 'block';
                };

                reader.readAsDataURL(file);
            }
        }
    </script>

	<script>
        let fotoIndex = 0;

        function addFoto() {
            const container = document.getElementById("fotosContainer");
            const template = document.getElementById("fotoTemplate");

            let html = template.innerHTML.replaceAll("INDEX", fotoIndex);
            container.insertAdjacentHTML("beforeend", html);

                img.src = e.target.result;

	<!-- =========================
     MÁSCARA E VALIDAÇÃO DE DATA
========================== -->
	<script>
		function formatarData(valor) {
			let value = valor.replace(/\D/g, '');

			if (value.length > 8) value = value.substring(0, 8);

			if (value.length > 4) {
				value = value.replace(/^(\d{2})(\d{2})(\d{1,4})/, '$1/$2/$3');
			} else if (value.length > 2) {
				value = value.replace(/^(\d{2})(\d{1,2})/, '$1/$2');
			}

			return value;
		}

		function mascaraData(input) {
			input.value = formatarData(input.value);
			validarData(input);
		}

		function validarData(input) {
			const valor = input.value;
			input.classList.remove('is-valid', 'is-invalid');

			if (valor === '') return true;

			if (valor.length !== 10) {
				input.classList.add('is-invalid');
				return false;
			}

			const partes = valor.split('/');
			const dia = parseInt(partes[0], 10);
			const mes = parseInt(partes[1], 10);
			const ano = parseInt(partes[2], 10);

			// Validação básica de limites
			if (mes < 1 || mes > 12 || ano < 1900 || ano > 2099) {
				input.classList.add('is-invalid');
				return false;
			}

			// Validação de dias por mês (considerando ano bissexto)
			const diasPorMes = [31, (ano % 4 === 0 && (ano % 100 !== 0 || ano % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

			if (dia < 1 || dia > diasPorMes[mes - 1]) {
				input.classList.add('is-invalid');
				return false;
			}

			input.classList.add('is-valid');
			return true;
		}

		// Formata automaticamente na carga da página (caso seja tela de edição)
		document.addEventListener("DOMContentLoaded", function () {
			document.querySelectorAll(".mask-data").forEach(input => {
				if (input.value) {
					input.value = formatarData(input.value);
				}
			});
		});
	</script>

         MÁSCARAS (CEP / TELEFONE)

	<script>
        document.addEventListener("input", function (e) {

            // CEP
            if (e.target.classList.contains("mask-cep")) {
                let value = e.target.value.replace(/\D/g, "");

                if (value.length > 2) value = value.replace(/^(\d{2})(\d)/, "$1.$2");
                if (value.length > 6) value = value.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2-$3");

                e.target.value = value.substring(0, 10);
            }

            // TELEFONE
            if (e.target.classList.contains("mask-phone")) {
                let value = e.target.value.replace(/\D/g, "");

                if (value.length > 10) {
                    value = value.replace(/^(\d{2})(\d{5})(\d)/, "($1) $2-$3");
                } else if (value.length > 6) {
                    value = value.replace(/^(\d{2})(\d{4})(\d)/, "($1) $2-$3");
                } else if (value.length > 2) {
                    value = value.replace(/^(\d{2})(\d)/, "($1) $2");
                }

                e.target.value = value.substring(0, 15);
            }

        });
    </script>

	<script>
        function buscarCep() {
            const cepInput = document.getElementById('cep');
            let cep = cepInput.value.replace(/\D/g, '');

            if (cep.length === 8) {
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                    .then(response => response.json())
                    .then(data => {
                        if (!data.erro) {
                            document.getElementById('logradouro').value = data.logradouro;
                            document.getElementById('bairro').value = data.bairro;
                            document.getElementById('cidade').value = data.localidade;

                            const ufSelect = document.getElementById('uf');
                            for (let i = 0; i < ufSelect.options.length; i++) {
                                if (ufSelect.options[i].value === data.uf) {
                                    ufSelect.selectedIndex = i;
                                    break;
                                }
                            }
                        } else {
                            alert('CEP não encontrado!');
                        }
                    })
                    .catch(() => alert('Erro ao buscar CEP'));
            } else {
                alert('CEP incompleto!');
            }
        }
    </script>

    ========================== -->
	<script>

		function formatarCPF(valor) {
			let value = valor.replace(/\D/g, '');

			value = value.substring(0, 11);
			value = value.replace(/(\d{3})(\d)/, '$1.$2');
			value = value.replace(/(\d{3})(\d)/, '$1.$2');
			value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

			return value;
		}



		function mascaraCPF(input) {
			input.value = formatarCPF(input.value);

			validarCPF(input);
		}

function validarCPF(input) {
    const cpf = input.value.replace(/\D/g, '');

    input.classList.remove('is-valid', 'is-invalid');

    if (cpf.length !== 11) {
        input.classList.add('is-invalid');
        return false;
    }

    if (/^(\d)\1+$/.test(cpf)) {
        input.classList.add('is-invalid');
        return false;
    }

    let soma = 0;
    let resto;

    // 1º dígito
    for (let i = 0; i < 9; i++) {
        soma += parseInt(cpf.charAt(i)) * (10 - i);
    }

    resto = (soma * 10) % 11;
    if (resto === 10) resto = 0;

    if (resto !== parseInt(cpf.charAt(9))) {
        input.classList.add('is-invalid');
        return false;
    }

    // 2º dígito
    soma = 0;
    for (let i = 0; i < 10; i++) {
        soma += parseInt(cpf.charAt(i)) * (11 - i);
    }

    resto = (soma * 10) % 11;
    if (resto === 10) resto = 0;

    if (resto !== parseInt(cpf.charAt(10))) {
        input.classList.add('is-invalid');
        return false;
    }

    // GARANTE QUE SÓ SALVA COM MÁSCARA COMPLETA (14)
    if (input.value.length !== 14) {
        input.classList.add('is-invalid');
        return false;
    }

    input.classList.add('is-valid');
    return true;
}

				cpf.value = formatarCPF(cpf.value);
			}

		});

</script>

	<script>
		function mascaraTelefone(input) {
			// Remove tudo que não for número
			let valor = input.value.replace(/\D/g, '');

			// Limita a 11 dígitos
			if (valor.length > 11) valor = valor.slice(0,11);

			// Se estiver vazio, não faz nada
			if (valor.length === 0) {
				input.value = '';
				return;
			}

			// Aplica a máscara dinâmica
			if (valor.length <= 2) {
				valor = '(' + valor;
			} else if (valor.length <= 6) {
				// Se tem até 6 dígitos, formata como (XX)XXXX (para celular ou fixo)
				valor = '(' + valor.slice(0,2) + ') ' + valor.slice(2);
			} else if (valor.length === 7) {
				// Se tem 7, força o formato (XX)XXXX-XXXX
				valor = '(' + valor.slice(0,2) + ') ' + valor.slice(2, 6) + '-' + valor.slice(6);
			} else if (valor.length <= 10) {
				// Se tem de 8 a 10, é telefone fixo (XX)XXXX-XXXX
				valor = '(' + valor.slice(0,2) + ') ' + valor.slice(2, 6) + '-' + valor.slice(6);
			} else {
				// Se tem 11, é celular (XX)XXXXX-XXXX
				valor = '(' + valor.slice(0,2) + ') ' + valor.slice(2, 7) + '-' + valor.slice(7);
			}

			input.value = valor;
		}

	<!--Ativa Maiusculo -->
	<script>
		document.addEventListener("input", function (event) {

			const campo = event.target;

			if (!(campo instanceof HTMLInputElement)) {
				return;
			}

			// Tipos nos quais NÃO devemos transformar o valor
			const tiposIgnorados = [
				"password",
				"email",
				"number",
				"date",
				"time",
				"file",
				"checkbox",
				"radio",
				"hidden"
			];

			if (tiposIgnorados.includes(campo.type)) {
				return;
			}

			// Permite desativar em algum campo específico
			if (campo.hasAttribute("data-no-uppercase")) {
				return;
			}

			const inicio = campo.selectionStart;
			const fim = campo.selectionEnd;

			campo.value = campo.value.toUpperCase();

			// Mantém o cursor na posição correta
			if (inicio !== null && fim !== null) {
				campo.setSelectionRange(inicio, fim);
			}
		});
	</script>
	<script>
		document.addEventListener("DOMContentLoaded", function () {

			const senha = document.getElementById("senha");
			const confirmarSenha = document.getElementById("confirmarSenha");

			if (!senha || !confirmarSenha) {
				return;
			}

			function validarSenhas() {

				// Se ainda não digitou confirmação
				if (confirmarSenha.value === "") {
					confirmarSenha.classList.remove("is-valid", "is-invalid");
					confirmarSenha.setCustomValidity("");
					return;
				}

				if (senha.value === confirmarSenha.value) {

					confirmarSenha.classList.remove("is-invalid");
					confirmarSenha.classList.add("is-valid");

					confirmarSenha.setCustomValidity("");

				} else {

					confirmarSenha.classList.remove("is-valid");
					confirmarSenha.classList.add("is-invalid");

					confirmarSenha.setCustomValidity(
							"As senhas não conferem."
					);
				}
			}

			senha.addEventListener("input", validarSenhas);
			confirmarSenha.addEventListener("input", validarSenhas);

		});
	</script>

	<!-- =========================
     CNPJ (MÁSCARA + VALIDAÇÃO)
========================== -->
	<script>

		function formatarCNPJ(valor) {

			let value = valor.replace(/\D/g, '');

			value = value.substring(0, 14);

			value = value.replace(
					/^(\d{2})(\d)/,
					'$1.$2'
			);

			value = value.replace(
					/^(\d{2})\.(\d{3})(\d)/,
					'$1.$2.$3'
			);

			value = value.replace(
					/\.(\d{3})(\d)/,
					'.$1/$2'
			);

			value = value.replace(
					/(\d{4})(\d)/,
					'$1-$2'
			);

			return value;
		}


		function mascaraCNPJ(input) {

			input.value = formatarCNPJ(
					input.value
			);

			validarCNPJ(input);
		}


		function validarCNPJ(input) {

			const cnpj =
					input.value.replace(/\D/g, '');

			input.classList.remove(
					'is-valid',
					'is-invalid'
			);


			/*
             * CNPJ precisa possuir 14 dígitos
             */
			if (cnpj.length !== 14) {

				input.classList.add(
						'is-invalid'
				);

				return false;
			}


			/*
             * Bloqueia sequências repetidas:
             *
             * 00000000000000
             * 11111111111111
             * etc.
             */
			if (/^(\d)\1+$/.test(cnpj)) {

				input.classList.add(
						'is-invalid'
				);

				return false;
			}


			/*
             * ===================================
             * PRIMEIRO DÍGITO VERIFICADOR
             * ===================================
             */

			let tamanho =
					cnpj.length - 2;

			let numeros =
					cnpj.substring(
							0,
							tamanho
					);

			const digitos =
					cnpj.substring(
							tamanho
					);

			let soma = 0;
			let pos = tamanho - 7;


			for (let i = tamanho; i >= 1; i--) {

				soma +=
						parseInt(
								numeros.charAt(
										tamanho - i
								)
						) * pos--;

				if (pos < 2) {
					pos = 9;
				}
			}


			let resultado =
					soma % 11 < 2
							? 0
							: 11 - (soma % 11);


			if (
					resultado !==
					parseInt(
							digitos.charAt(0)
					)
			) {

				input.classList.add(
						'is-invalid'
				);

				return false;
			}


			/*
             * ===================================
             * SEGUNDO DÍGITO VERIFICADOR
             * ===================================
             */

			tamanho =
					tamanho + 1;

			numeros =
					cnpj.substring(
							0,
							tamanho
					);

			soma = 0;
			pos = tamanho - 7;


			for (let i = tamanho; i >= 1; i--) {

				soma +=
						parseInt(
								numeros.charAt(
										tamanho - i
								)
						) * pos--;

				if (pos < 2) {
					pos = 9;
				}
			}


			resultado =
					soma % 11 < 2
							? 0
							: 11 - (soma % 11);


			if (
					resultado !==
					parseInt(
							digitos.charAt(1)
					)
			) {

				input.classList.add(
						'is-invalid'
				);

				return false;
			}


			/*
             * CNPJ formatado completo:
             *
             * 00.000.000/0000-00
             *
             * Total: 18 caracteres
             */
			if (input.value.length !== 18) {

				input.classList.add(
						'is-invalid'
				);

				return false;
			}


			input.classList.add(
					'is-valid'
			);

			return true;
		}

	<script>
		document.addEventListener("input", function (e) {
			if (e.target.id === "cnae") {
				let value = e.target.value.replace(/\D/g, ""); // Remove tudo que não é número

				// Limita a 7 números
				if (value.length > 7) {
					value = value.slice(0, 7);
				}

				// Aplica a máscara 0000-0/00
				if (value.length > 5) {
					value = value.replace(/^(\d{4})(\d)(\d{1,2})/, "$1-$2/$3");
				} else if (value.length > 4) {
					value = value.replace(/^(\d{4})(\d)/, "$1-$2");
				}

				e.target.value = value;
			}
		});
	</script>
