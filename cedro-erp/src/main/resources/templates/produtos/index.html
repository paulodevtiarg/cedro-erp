<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Produtos</title></head>
<body>
<div layout:fragment="content">
    <div class="container-fluid p-2">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb" style="margin-top: -25px; font-size: 0.8rem;">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/home}"><i class="fa-duotone fa-solid fa-house fs-7"></i> Home</a></li>
                        <li class="breadcrumb-item"><span class="text-muted"><i class="fa-duotone fa-solid fa-cubes-stacked"></i> Produtos - Lista</span></li>
                    </ol>
                </nav>
            </div>

            <div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>

            <div class="col-12">
                <div class="card">
                    <div th:replace="~{fragments/componentes :: cardHeader(
                        'Produtos', 'Gerencie o catálogo de produtos e tamanhos', 'cubes-stacked', '/produtos/novo', 'Produto', ${queryParams}
                    )}"></div>

                    <div class="card-body">
                        <!-- Filtros -->
                        <form th:action="@{/produtos}" method="get" class="filter-box mb-2">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold text-secondary">Espécie</label>
                                    <div class="input-group input-group-modern">
                                        <span class="input-group-text"><i class="fa-duotone fa-solid fa-tree"></i></span>
                                        <input type="text" name="filtroEspecie" th:value="${filtro.filtroEspecie}" class="form-control" placeholder="Ex: Taipa">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold text-secondary">Tipo de Produto</label>
                                    <div class="input-group input-group-modern">
                                        <span class="input-group-text"><i class="fa-duotone fa-solid fa-tags"></i></span>
                                        <input type="text" name="filtroTipo" th:value="${filtro.filtroTipo}" class="form-control" placeholder="Ex: Tábua">
                                    </div>
                                </div>
                                <div th:replace="~{fragments/componentes :: filtroStatus(${filtro}, 'col-md-2')}"></div>
                                <div th:replace="~{fragments/componentes :: filtroLinhas(${filtro}, 'col-md-2')}"></div>
                            </div>
                            <div class="row g-3 mt-2">
                                <div th:replace="~{fragments/componentes :: botoesFiltro('/produtos', 'col-md-12')}"></div>
                            </div>
                        </form>

                        <!-- Tabela Desktop -->
                        <div class="d-none d-md-block">
                            <table class="table table-modern align-middle mb-0">
                                <thead>
                                <tr>
                                    <th class="text-center" style="width: 70px;">Cód.</th>
                                    <th>Produto</th>
                                    <th>Dimensões (L x E)</th>
                                    <th class="text-center">Unid.</th>
                                    <th class="text-center" style="width: 120px;">Status</th>
                                    <th class="text-center" style="width: 140px;">Ações</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${produtos.empty}">
                                    <td colspan="6"><div th:replace="~{fragments/componentes :: emptyState('Nenhum produto encontrado.')}"></div></td>
                                </tr>
                                <tr th:each="p : ${produtos}">
                                    <td class="text-center text-muted fw-semibold" th:text="${p.id}"></td>
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <!-- Miniatura -->
                                            <div th:if="${p.imagem != null and !p.imagem.isEmpty()}" class="flex-shrink-0">
                                                <img th:src="${p.imagem}" alt="Produto" class="rounded shadow-sm border" style="width: 45px; height: 45px; object-fit: cover;">
                                            </div>
                                            <div th:if="${p.imagem == null or p.imagem.isEmpty()}" class="flex-shrink-0 bg-light rounded border d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                                                <i class="fa-duotone fa-solid fa-box text-muted"></i>
                                            </div>

                                            <!-- Nome -->
                                            <div class="min-w-0">
                                                <div class="fw-semibold text-dark text-truncate" th:text="${p.tipoProdutoNome + ' de ' + p.especieMadeiraNome}"></div>
                                                <small class="text-muted d-block" th:text="${p.larguraCm + ' x ' + p.espessuraCm + ' cm'}"></small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="text-secondary small" th:text="${p.larguraCm + 'cm x ' + p.espessuraCm + 'cm'}"></td>
                                    <td class="text-center fw-bold text-primary" th:text="${p.unidadeMedidaSigla}"></td>
                                    <td class="text-center align-middle">
                                        <form th:action="@{'/produtos/alterar-status/' + ${p.id}}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-link p-0 border-0 text-decoration-none">
                                                <i th:if="${p.status}" class="fa-duotone fa-solid fa-circle-check text-success fs-5"></i>
                                                <i th:unless="${p.status}" class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5"></i>
                                            </button>
                                        </form>
                                    </td>
                                    <td class="text-center text-nowrap">
                                        <div th:replace="~{fragments/componentes :: acoes(${p.id}, '/produtos', ${queryParams}, 'produto')}"></div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Footer Paginação -->
                    <div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

                        <!-- Info à esquerda -->
                        <small class="text-muted">
                            Página <strong th:text="${produtos.totalPages > 0 ? produtos.number + 1 : 0}"></strong>
                            de <strong th:text="${produtos.totalPages}"></strong>
                            &bull;
                            <span th:text="${produtos.totalElements}"></span> registro(s)
                        </small>

                        <!-- Paginação à direita -->
                        <nav aria-label="Paginação">
                            <ul class="pagination pagination-modern mb-0">

                                <!-- Primeira -->
                                <li class="page-item" th:classappend="${produtos.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/produtos(
                                        page=0,
                                        filtroEspecie=${filtro.filtroEspecie},
                                        filtroTipo=${filtro.filtroTipo},
                                       filtroStatus=${filtro.filtroStatus},
                                       size=${filtro.size})}"
                                       data-bs-toggle="tooltip" title="Primeira página">
                                        <i class="fa-duotone fa-solid fa-angles-left"></i>
                                    </a>
                                </li>

                                <!-- Anterior -->
                                <li class="page-item" th:classappend="${produtos.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/produtos(
										page=${produtos.number - 1},
									 filtroEspecie=${filtro.filtroEspecie},
									 filtroTipo=${filtro.filtroTipo},
                                       filtroStatus=${filtro.filtroStatus},
                                       size=${filtro.size})}"
                                       data-bs-toggle="tooltip" title="Anterior">
                                        <i class="fa-duotone fa-solid fa-chevron-left"></i>
                                    </a>
                                </li>


                                <th:block th:if="${produtos.totalPages > 0}">
                                    <!-- Números -->
                                    <li th:each="i : ${#numbers.sequence(0, produtos.totalPages - 1)}"
                                        class="page-item"
                                        th:classappend="${i == produtos.number} ? 'active'">
                                        <a class="page-link"
                                           th:href="@{/produtos(
											page=${i},
											 filtroEspecie=${filtro.filtroEspecie},
											 filtroTipo=${filtro.filtroTipo},
                                       filtroStatus=${filtro.filtroStatus},
                                       size=${filtro.size})}"
                                           th:text="${i + 1}"></a>
                                    </li>
                                </th:block>
                                <!-- Próxima -->
                                <li class="page-item" th:classappend="${produtos.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/produtos(
										page=${produtos.number + 1},
									    filtroEspecie=${filtro.filtroEspecie},
									    filtroTipo=${filtro.filtroTipo},
                                       filtroStatus=${filtro.filtroStatus},
                                       size=${filtro.size})}"
                                       data-bs-toggle="tooltip" title="Próxima">
                                        <i class="fa-duotone fa-solid fa-chevron-right"></i>
                                    </a>
                                </li>

                                <!-- Última -->
                                <li class="page-item" th:classappend="${produtos.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/produtos(
                                       filtroEspecie=${filtro.filtroEspecie},
									    filtroTipo=${filtro.filtroTipo},
                                       filtroStatus=${filtro.filtroStatus},
                                       size=${filtro.size})}"
                                       data-bs-toggle="tooltip" title="Última página">
                                        <i class="fa-duotone fa-solid fa-angles-right"></i>
                                    </a>
                                </li>

                            </ul>
                        </nav>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
