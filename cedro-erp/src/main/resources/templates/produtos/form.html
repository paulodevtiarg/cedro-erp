<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Produto</title></head>
<body>
<div layout:fragment="content">
    <div class="container-fluid p-2">
        <div class="row">
            <!-- BREADCRUMB -->
            <div class="col-12">
                <nav aria-label="breadcrumb" style="margin-top: -25px; font-size: 0.8rem;">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/home}"><i class="fa-duotone fa-solid fa-house fs-7"></i> Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/produtos}"><i class="fa-duotone fa-solid fa-cubes-stacked"></i> Produtos - Lista</a></li>
                        <li class="breadcrumb-item"><span class="text-muted"><i class="fa-duotone fa-solid fa-circle-plus"></i> <span th:text="${produto.id == null} ? 'Novo Produto' : 'Editar Produto'"></span></span></li>
                    </ol>
                </nav>
            </div>

            <div class="col-12">
                <form th:object="${produto}" enctype="multipart/form-data"
                      th:action="${produto.id == null} ? @{/produtos/salvar} : @{'/produtos/editar/' + ${produto.id}}" method="post">

                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{imagem}">

                    <div class="card">
                        <!-- HEADER -->
                        <div class="card-header card-header-modern d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-2">
                                <div class="header-icon"><i class="fa-duotone fa-solid fa-cubes-stacked"></i></div>
                                <div>
                                    <h5 class="mb-0 fw-semibold" th:text="${produto.id == null} ? 'Novo Produto' : 'Editar Produto'"></h5>
                                    <small class="text-muted">Preencha as características e adicione as variações.</small>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <a th:href="@{/produtos}" class="btn btn-light btn-modern btn-sm"><i class="fa-duotone fa-solid fa-ban"></i> Cancelar</a>
                                <button type="submit" class="btn btn-primary btn-modern btn-sm"><i class="fa-duotone fa-solid fa-floppy-disk"></i> Salvar Produto</button>
                            </div>
                        </div>

                        <!-- BODY -->
                        <div class="card-body">

                            <!-- BLOCO SUPERIOR -->
                            <div class="row g-4 mb-4">
                                <!-- FOTO -->
                                <div class="col-md-3">
                                    <div style="width: 100%; max-width: 160px; height: 160px; margin: 0 auto; position: relative; overflow: hidden; border-radius: 12px; border: 1px solid #dee2e6; background-color: #f8f9fa;">
                                        <div th:if="${produto.imagem == null or produto.imagem.isEmpty()}" id="produtoPreviewPlaceholder" class="w-100 h-100 d-flex flex-column align-items-center justify-content-center">
                                            <i class="fa-duotone fa-solid fa-image fs-1 text-muted"></i>
                                            <span class="small text-muted mt-1">Sem imagem</span>
                                        </div>
                                        <img th:if="${produto.imagem != null and !produto.imagem.isEmpty()}" th:src="${produto.imagem}" id="produtoImagemAtual" class="w-100 h-100" style="object-fit: cover; position: absolute; top: 0; left: 0;">
                                        <img id="produtoPreviewImg" class="w-100 h-100" style="display: none; object-fit: cover; position: absolute; top: 0; left: 0;">
                                    </div>

                                    <div class="mt-2 text-center">
                                        <input type="file" name="arquivoImagem" id="arquivoImagem" class="form-control form-control-sm" accept="image/png, image/jpeg, image/jpg" onchange="previewImagemProduto(this)">
                                        <small class="text-muted d-block mt-1" style="font-size: 0.7rem;">JPG ou PNG</small>
                                    </div>
                                </div>

                                <!-- CARACTERÍSTICAS -->
                                <div class="col-md-9">
                                    <div class="detalhe-secao mt-0">
                                        <i class="fa-duotone fa-solid fa-circle-info me-1"></i> Características Principais
                                    </div>

                                    <div class="row g-3 mt-1">
                                        <div class="col-md-4">
                                            <label class="form-label fw-semibold text-secondary mb-0">Tipo de Produto *</label>
                                            <select class="form-select" th:field="*{tipoProdutoId}" th:classappend="${#fields.hasErrors('tipoProdutoId')} ? 'is-invalid' : ''">
                                                <option value="">Selecione</option>
                                                <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nome}"></option>
                                            </select>
                                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('tipoProdutoId')}" th:errors="*{tipoProdutoId}"></div>
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label fw-semibold text-secondary mb-0">Espécie da Madeira *</label>
                                            <select class="form-select" th:field="*{especieMadeiraId}" th:classappend="${#fields.hasErrors('especieMadeiraId')} ? 'is-invalid' : ''">
                                                <option value="">Selecione</option>
                                                <option th:each="e : ${especies}" th:value="${e.id}" th:text="${e.nome}"></option>
                                            </select>
                                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('especieMadeiraId')}" th:errors="*{especieMadeiraId}"></div>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label fw-semibold text-secondary mb-0">Classificação *</label>
                                            <select class="form-select" th:field="*{classificacao}" th:classappend="${#fields.hasErrors('classificacao')} ? 'is-invalid' : ''">
                                                <option value="">Selecione</option>
                                                <option th:each="c : ${classificacoes}" th:value="${c}" th:text="${c.descricao}"></option>
                                            </select>
                                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('classificacao')}" th:errors="*{classificacao}"></div>
                                        </div>

                                        <div class="col-md-2 mt-3 d-flex align-items-end">
                                            <label class="switch-modern w-100 justify-content-center mb-0" for="status">
                                                <input type="checkbox" role="switch" id="status" th:field="*{status}">
                                                <i class="fa-duotone fa-solid fa-circle-check"></i> Ativo
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <hr class="pr-hr my-4"/>

                            <!-- CONTAINER DE VARIAÇÕES BASE -->
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="detalhe-secao mb-0"><i class="fa-duotone fa-solid fa-layer-group me-1"></i> Tamanhos Bases e Comprimentos</div>
                                <button type="button" class="btn btn-outline-sistema btn-sm" id="btnAdicionarBase">
                                    <i class="fa-duotone fa-solid fa-plus"></i> Adicionar Variação Base
                                </button>
                            </div>

                            <div id="containerBases">
                                <!-- Linhas existentes (Edição) -->
                                <div th:each="base, statBase : *{variacoesBase}" class="card mb-3 border-secondary shadow-sm base-item" th:attr="data-index=${statBase.index}">
                                    <div class="card-header bg-light d-flex align-items-center gap-3">
                                        <input type="hidden" th:field="*{variacoesBase[__${statBase.index}__].id}" class="base-id" />

                                        <div class="flex-grow-1 row g-2">
                                            <div class="col-md-3">
                                                <label class="small text-muted mb-0">Largura (cm) *</label>
                                                <input type="number" step="0.01" th:field="*{variacoesBase[__${statBase.index}__].larguraCm}" class="form-control form-control-sm base-largura" />
                                            </div>
                                            <div class="col-md-3">
                                                <label class="small text-muted mb-0">Espessura (cm) *</label>
                                                <input type="number" step="0.01" th:field="*{variacoesBase[__${statBase.index}__].espessuraCm}" class="form-control form-control-sm base-espessura" />
                                            </div>
                                            <div class="col-md-3">
                                                <label class="small text-muted mb-0">Unidade *</label>
                                                <select th:field="*{variacoesBase[__${statBase.index}__].unidadeMedidaId}" class="form-select form-select-sm base-unidade">
                                                    <option value="">Selecione</option>
                                                    <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.sigla}"></option>
                                                </select>
                                            </div>
                                        </div>

                                        <button type="button" class="btn btn-outline-danger btn-sm remover-base" title="Remover Variação"><i class="fa-duotone fa-solid fa-trash"></i></button>
                                    </div>
                                    <div class="card-body p-0">
                                        <table class="table table-sm mb-0 align-middle tabela-medidas">
                                            <thead class="table-light">
                                            <tr class="small text-muted">
                                                <th style="width: 25%;">Comprimento (m)</th>
                                                <th style="width: 20%;">Preço (R$)</th>
                                                <th style="width: 20%;">Estoque</th>
                                                <th style="width: 25%;">SKU</th>
                                                <th class="text-center" style="width: 10%;"></th>
                                            </tr>
                                            </thead>
                                            <tbody class="corpo-medidas">
                                            <!-- Medidas existentes -->
                                            <tr th:each="medida, statMedida : *{variacoesBase[__${statBase.index}__].medidas}">
                                                <td>
                                                    <input type="hidden" th:field="*{variacoesBase[__${statBase.index}__].medidas[__${statMedida.index}__].id}" />
                                                    <input type="number" step="0.01" th:field="*{variacoesBase[__${statBase.index}__].medidas[__${statMedida.index}__].comprimentoM}" class="form-control form-control-sm" placeholder="Ex: 3.0" />
                                                </td>
                                                <td><input type="number" step="0.01" th:field="*{variacoesBase[__${statBase.index}__].medidas[__${statMedida.index}__].precoVenda}" class="form-control form-control-sm" /></td>
                                                <td><input type="number" step="0.001" th:field="*{variacoesBase[__${statBase.index}__].medidas[__${statMedida.index}__].quantidadeEstoque}" class="form-control form-control-sm" /></td>
                                                <td><input type="text" th:field="*{variacoesBase[__${statBase.index}__].medidas[__${statMedida.index}__].sku}" class="form-control form-control-sm" /></td>
                                                <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger remover-medida"><i class="fa-duotone fa-solid fa-trash"></i></button></td>
                                            </tr>
                                            </tbody>
                                        </table>
                                        <div class="p-2 bg-light text-end border-top">
                                            <button type="button" class="btn btn-sm btn-outline-primary add-medida"><i class="fa-duotone fa-solid fa-plus"></i> Adicionar Comprimento</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- FOOTER -->
                        <div class="card-footer card-footer-modern">
                            <small class="text-muted"><i class="fa-duotone fa-solid fa-circle-info"></i> Campos com <span class="text-danger">*</span> são obrigatórios.</small>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Select Oculto para o JS ler as Unidades -->
    <select id="templateUnidades" class="d-none">
        <option value="">Selecione</option>
        <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.sigla}"></option>
    </select>

    <!-- SCRIPT DA ÁRVORE DINÂMICA -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const containerBases = document.getElementById('containerBases');
            const btnAdicionarBase = document.getElementById('btnAdicionarBase');
            const templateUnidades = document.getElementById('templateUnidades').innerHTML;

            let indexBase = containerBases.querySelectorAll('.base-item').length;

            // Função para atualizar os names (index) das linhas quando excluir uma base
            function reindexarBases() {
                const bases = containerBases.querySelectorAll('.base-item');
                bases.forEach((base, bIndex) => {
                    base.setAttribute('data-index', bIndex);

                    // Atualiza os IDs/Names da Base
                    base.querySelectorAll('input, select').forEach(el => {
                        if (el.name) {
                            el.name = el.name.replace(/variacoesBase\[\d+\]/, `variacoesBase[${bIndex}]`);
                        }
                    });

                    // Atualiza os IDs/Names das Medidas
                    const medidas = base.querySelectorAll('.corpo-medidas tr');
                    medidas.forEach((tr, mIndex) => {
                        tr.querySelectorAll('input').forEach(el => {
                            if (el.name) {
                                el.name = el.name.replace(/medidas\[\d+\]/, `medidas[${mIndex}]`);
                            }
                        });
                    });
                });
                indexBase = bases.length;
            }

            // Cria o bloco de uma nova Base
            function criarBase() {
                const div = document.createElement('div');
                div.className = 'card mb-3 border-secondary shadow-sm base-item';
                div.setAttribute('data-index', indexBase);
                div.innerHTML = `
                    <div class="card-header bg-light d-flex align-items-center gap-3">
                        <input type="hidden" name="variacoesBase[${indexBase}].id" class="base-id" />
                        <div class="flex-grow-1 row g-2">
                            <div class="col-md-3">
                                <label class="small text-muted mb-0">Largura (cm) *</label>
                                <input type="number" step="0.01" name="variacoesBase[${indexBase}].larguraCm" class="form-control form-control-sm base-largura" required />
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted mb-0">Espessura (cm) *</label>
                                <input type="number" step="0.01" name="variacoesBase[${indexBase}].espessuraCm" class="form-control form-control-sm base-espessura" required />
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted mb-0">Unidade *</label>
                                <select name="variacoesBase[${indexBase}].unidadeMedidaId" class="form-select form-select-sm base-unidade" required>
                                    ${templateUnidades}
                                </select>
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline-danger btn-sm remover-base"><i class="fa-duotone fa-solid fa-trash"></i></button>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-sm mb-0 align-middle tabela-medidas">
                            <thead class="table-light">
                                <tr class="small text-muted">
                                    <th style="width: 25%;">Comprimento (m)</th>
                                    <th style="width: 20%;">Preço (R$)</th>
                                    <th style="width: 20%;">Estoque</th>
                                    <th style="width: 25%;">SKU</th>
                                    <th class="text-center" style="width: 10%;"></th>
                                </tr>
                            </thead>
                            <tbody class="corpo-medidas"></tbody>
                        </table>
                        <div class="p-2 bg-light text-end border-top">
                            <button type="button" class="btn btn-sm btn-outline-primary add-medida"><i class="fa-duotone fa-solid fa-plus"></i> Adicionar Comprimento</button>
                        </div>
                    </div>
                `;
                containerBases.appendChild(div);
                indexBase++;
                bindEvents(div);
                adicionarMedida(div); // Já cria uma linha vazia por padrão
            }

            // Cria o bloco de uma nova Medida dentro da Base
            function adicionarMedida(baseItem) {
                const corpo = baseItem.querySelector('.corpo-medidas');
                const baseIndex = baseItem.getAttribute('data-index');
                const mIndex = corpo.querySelectorAll('tr').length;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <input type="hidden" name="variacoesBase[${baseIndex}].medidas[${mIndex}].id" />
                        <input type="number" step="0.01" name="variacoesBase[${baseIndex}].medidas[${mIndex}].comprimentoM" class="form-control form-control-sm" placeholder="Ex: 3.0" />
                    </td>
                    <td><input type="number" step="0.01" name="variacoesBase[${baseIndex}].medidas[${mIndex}].precoVenda" class="form-control form-control-sm" placeholder="0.00" /></td>
                    <td><input type="number" step="0.001" name="variacoesBase[${baseIndex}].medidas[${mIndex}].quantidadeEstoque" class="form-control form-control-sm" placeholder="0.000" /></td>
                    <td><input type="text" name="variacoesBase[${baseIndex}].medidas[${mIndex}].sku" class="form-control form-control-sm" placeholder="Automático" /></td>
                    <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger remover-medida"><i class="fa-duotone fa-solid fa-trash"></i></button></td>
                `;
                corpo.appendChild(tr);
            }

            // Binds de eventos
            function bindEvents(container) {
                // Remover Base Inteira
                container.querySelector('.remover-base').addEventListener('click', function() {
                    if (confirm('Tem certeza que deseja remover esta variação e todos os seus tamanhos?')) {
                        container.remove();
                        reindexarBases();
                    }
                });

                // Adicionar Comprimento na Base
                container.querySelector('.add-medida').addEventListener('click', function() {
                    adicionarMedida(container);
                    reindexarBases();
                });

                // Remover Comprimento
                container.querySelectorAll('.remover-medida').forEach(btn => {
                    btn.addEventListener('click', function() {
                        this.closest('tr').remove();
                        reindexarBases();
                    });
                });
            }

            // Evento de Adicionar Base
            btnAdicionarBase.addEventListener('click', criarBase);

            // Inicializa os binds nas bases que já existem (Edição)
            document.querySelectorAll('.base-item').forEach(bindEvents);
        });

        // Preview da Imagem
        function previewImagemProduto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const placeholder = document.getElementById('produtoPreviewPlaceholder');
                    const imagemAtual = document.getElementById('produtoImagemAtual');
                    const previewImg = document.getElementById('produtoPreviewImg');

                    if (placeholder) placeholder.style.display = 'none';
                    if (imagemAtual) imagemAtual.style.display = 'none';

                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</div>
</body>
</html>
