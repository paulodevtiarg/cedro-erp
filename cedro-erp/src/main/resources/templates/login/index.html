<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Cedro ERP</title>
<!-- Bootstrap 5.3 -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="icon" href="/img/logo.png" type="image/x-icon" />
<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<!-- Adicionando jQuery para a máscara -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Plugin jQuery Mask -->
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
<style>
	/* ==================================================
   CEDRO ERP - LOGIN
   ================================================== */

	:root {
		--cedro-verde-escuro: #062D1F;
		--cedro-verde: #0B5D3B;
		--cedro-verde-claro: #198754;

		--cedro-madeira-escuro: #6F3515;
		--cedro-madeira: #A65E27;
		--cedro-madeira-claro: #C98242;

		--cedro-creme: #F5F0E8;
		--cedro-branco: #FFFFFF;
		--cedro-texto: #E8EDE9;
	}
* {
	box-sizing: border-box;
}

body, html {
	min-height: 100vh;
	margin: 0;
	padding: 1px;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
	display: flex;
	align-items: center;
	justify-content: center;
	min-height: 90vh;
	background: url('/img/bg-login-3.png') no-repeat center center fixed;
	background-size: cover;
	overflow: hidden;
}

#loadingOverlay {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba(3, 20, 14, 0.80);
	z-index: 9999;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	color: white;
	font-size: 18px;
}

.spinner {
	border: 6px solid rgba(255, 255, 255, 0.20);
	border-top: 6px solid var(--cedro-madeira-claro);
	border-radius: 50%;
	width: 50px;
	height: 50px;
	animation: spin 1s linear infinite;
	margin-bottom: 15px;
}
	.spinner-border {
		color: var(--cedro-madeira-claro) !important;
	}
@keyframes spin { 0% {
	transform: rotate(0deg);
}

100
%
{
transform
:
rotate(
360deg
);
}
}
.login-wrapper {
	width: 100%;
	display: flex;
	justify-content: center;
}

.login-card {
	width: 100%;
	max-width: 450px;
	padding: 1rem 0.9rem;
	/*padding: 0.5rem 0.9rem;*/
	border-radius: 22px;
	background:
			linear-gradient(145deg, rgb(204 237 225), rgb(255 255 255 / 90%));
	backdrop-filter: blur(12px);
	-webkit-backdrop-filter: blur(12px);
	border: 1px solid rgba(201, 130, 66, 0.35);
	max-height: 95vh; /* impede de estourar a tela */
	box-shadow:
			0 25px 60px rgba(0, 0, 0, 0.45),
			inset 0 1px 0 rgba(255, 255, 255, 0.06);
	transition: box-shadow 0.25s ease;
}

.login-card:hover {
	/*transform: translate3d(0,-4px,0);*/
	box-shadow:
			0 30px 70px rgba(0, 0, 0, 0.55),
			0 0 25px rgba(25, 135, 84, 0.12);
}

/* Header do card com logo */
.login-header {
	text-align: center;
	margin-bottom: 0.5rem;
}

.logo {
	max-width: 250px; /* metade de 280 */
	height: auto;
	margin-top: 10px;
	margin-bottom: 8px;
	filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.1));
}



/* Opções de login */
.login-options {
	margin-bottom: 0.5rem;
	padding: 2px;
}

.options-title {
	font-size: 1rem;
	font-weight: 500;
	color: rgb(19 44 26 / 80%);
	margin-bottom: 0.8rem;
	display: block;
}

.options-group {
	display: flex;
	flex-wrap: wrap;
}

.option-item {
	display: flex;
	align-items: center;
	cursor: pointer;
	padding: 5px 10px;
	border-radius: 8px;
	transition: background-color 0.3s;
}

.option-item:hover {
	background-color: rgb(0 81 62 / 0.07);
}

.option-radio {
	display: none;
}

.radio-custom {
	width: 20px;
	height: 20px;
	border: 2px solid rgb(0 81 62 / 0.32);
	border-radius: 50%;
	margin-right: 8px;
	position: relative;
	transition: all 0.3s;
}

.option-radio:checked+.radio-custom {
	border-color: rgb(2 48 30 / 0.45);
	background-color: rgb(6 108 67 / 0.8);
}

.option-radio:checked+.radio-custom::after {
	content: '';
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	width: 8px;
	height: 8px;
	background-color: white;
	border-radius: 50%;
}

.option-label {
	font-size: 0.95rem;
	color: #03280d;
	cursor: pointer;
	transition: color 0.3s;
}

.option-radio:checked ~ .option-label {
	color: rgb(2 48 30 / 0.8);
	font-weight: 500;
}

/* Estilos dos inputs */
.form-group {
	margin-bottom: 0.5rem;
	position: relative;
}

.form-label {
	display: block;
	font-weight: 500;
	color: #495057;
	margin-bottom: 0.1rem;
	font-size: 0.95rem;
}

.form-control {
	width: 100%;
	padding: 14px 16px;
	font-size: 1rem;
	border: 1.5px solid rgb(0 81 62 / 0.16);
	border-radius: 12px;
	background-color: #f8f9fa;
	transition: all 0.3s;
}

.form-control:focus {
	border-color: rgb(2 48 30 / 0.2);
	background-color: white;
	box-shadow: 0 0 0 0.2rem rgb(2 48 30 / 0.32);
	outline: none;
}

/* Ícone nos inputs */
.input-icon {
	position: absolute;
	right: 16px;
	top: 38px;
	color: rgb(0 81 62 / 0.07);
	font-size: 1.1rem;
}

/* Campo oculto para tipo de login */
#loginType {
	display: none;
}

/* Checkbox "Remember me" */
.remember-me {
	display: flex;
	align-items: center;
	margin-bottom: 1.5rem;
}

.remember-checkbox {
	width: 18px;
	height: 18px;
	margin-right: 10px;
	cursor: pointer;
}

.remember-label {
	font-size: 0.95rem;
	color: #495057;
	cursor: pointer;
}

/* Botão de login */
.login-btn {
	width: 100%;
	padding: 15px;
	background:
			linear-gradient(
					135deg,
					var(--cedro-verde-claro) 0%,
					var(--cedro-verde) 55%,
					var(--cedro-verde-escuro) 100%
			);

	color: white;
	border: none;
	border-radius: 12px;
	font-size: 1.1rem;
	font-weight: 600;
	cursor: pointer;
	transition: all 0.3s;
	margin-top: 0.5rem;
	margin-bottom: 0.5rem;
}

	.login-btn:hover {
		transform: translateY(-2px);

		background:
				linear-gradient(
						135deg,
						#21965f 0%,
						var(--cedro-verde) 60%,
						var(--cedro-verde-escuro) 100%
				);

		box-shadow:
				0 10px 28px
				rgba(0, 0, 0, 0.35);
	}

.login-btn:active {
	transform: translateY(0);
}

/* Botões sociais */
.social-login {
	display: flex;
	justify-content: center;
	gap: 15px;
	margin-bottom: 2rem;
}

.social-btn {
	width: 50px;
	height: 50px;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #f8f9fa;
	border: 1.5px solid #e0e0e0;
	cursor: pointer;
	transition: all 0.3s;
	font-size: 1.3rem;
	color: #495057;
}

.social-btn:hover {
	transform: translateY(-3px);
	box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
	background: white;
}

/* Link "Forgot Password" */
.forgot-password {
	text-align: center;
	margin-top: 0.2rem;
}

	.forgot-link {
		color: var(--cedro-madeira-claro);

		text-decoration: none;

		font-weight: 500;

		transition: all 0.25s ease;
	}


	.forgot-link:hover {
		color: #E0A364;
		text-decoration: none;
	}

/* Link de cadastro */
.signup-link {
	text-align: center;
	margin-top: 2rem;
	padding-top: 1.5rem;
	border-top: 1px solid #e9ecef;
	color: #6c757d;
	font-size: 0.95rem;
}

.signup-link a {
	color: #1E2A5A;
	text-decoration: none;
	font-weight: 600;
	margin-left: 5px;
}

.signup-link a:hover {
	text-decoration: underline;
}

/* Mensagem de erro */
.error-message {
	background-color: rgba(220, 53, 69, 0.14);
	color: #dc3545;
	padding: 12px 16px;
	border-radius: 8px;
	border-left: 4px solid #dc3545;
	margin-top: 15px;
	font-size: 0.95rem;
	text-align: center;
}

/* Responsividade */
@media ( max-width : 768px) {
	.login-wrapper {
		padding: 10px;
	}
	.login-card {
		padding: 2.5rem 2rem;
		max-width: 90%;
	}
	.logo {
		max-width: 90px;
	}
	.brand-title {
		font-size: 1.6rem;
	}
	.options-group {
		gap: 15px;
	}
}

@media ( max-width : 576px) {
	.login-card {
		padding: 0.2rem 0.8rem;
		max-width: 90%;
		border-radius: 20px;
	}
	.logo {
		max-width: 130px;
	}
	.brand-title {
		font-size: 1.4rem;
	}
	.login-title {
		font-size: 1.0rem;
	}
	.options-group {
		flex-direction: column;
		gap: 5px;
	}
	.option-item {
		padding: 8px 12px;
	}
	.form-control {
		padding: 12px 14px;
	}
	.login-btn {
		padding: 6px;
	}
}

/* Animações */
.fade-in {
	animation: fadeIn 0.6s ease-out;
}

keyframes fadeIn {from { opacity:0;
	transform: translateY(30px);
}

to {
	opacity: 1;
	transform: translateY(0);
}

}

/* Custom checkbox */
.custom-checkbox {
	display: flex;
	align-items: center;
	cursor: pointer;
}

.custom-checkbox input {
	display: none;
}

.checkbox-box {
	width: 18px;
	height: 18px;
	border: 2px solid #c9749166;
	border-radius: 4px;
	margin-right: 10px;
	display: flex;
	align-items: center;
	justify-content: center;
	transition: all 0.3s;
}

.custom-checkbox input:checked+.checkbox-box {
	background-color: rgb(2 48 30 / 0.8);
	border-color: rgb(6 108 67 / 0.8);
}

.custom-checkbox input:checked+.checkbox-box::after {
	content: '✓';
	color: white;
	font-size: 12px;
	font-weight: bold;
}

/* Placeholder styling */
::placeholder {
	color: #adb5bd;
	opacity: 1;
}

/* Transição suave para mudanças no campo */
.field-transition {
	transition: all 0.3s ease;
}

/* Badge para indicar padrão */
.default-badge {
	font-size: 0.7rem;
	background: linear-gradient(
			135deg,
			var(--cedro-verde-claro),
			var(--cedro-madeira)
	);
	color: white;
	padding: 2px 6px;
	border-radius: 4px;
	margin-left: 6px;
	font-weight: 600;
}

.system-version {
	margin-top: -10px;
	margin-bottom: 5px;
	text-align: center;
	font-size: 0.70rem;
	color: #9aa0a6;
	font-weight: 400;
	letter-spacing: 0.4px;
}

@media ( max-height : 700px) {
	.login-card {
		transform: scale(0.92);
		transform-origin: center;
	}
}

@media ( max-height : 600px) {
	.login-card {
		transform: scale(0.85);
	}
}

@media ( max-height : 500px) {
	.login-card {
		transform: scale(0.78);
	}
}
</style>
</head>
<body>
	<!-- Container do background -->
	<div class="background-container"></div>


	<div class="login-wrapper">


		<div class="login-card fade-in">
			<!-- Header com logo -->
			<div class="login-header">
				<img th:src="@{/img/logo-sistema.png}" alt="CedroERP"
					class="logo">

			</div>

			<!-- Título do login -->

			<div class="system-version">Sistema de Gestão.
				V.1.0.2026</div>

			<div th:if="${modo == 'login'}">
				<!-- Opções de tipo de login -->
				<div class="login-options">
					<span class="options-title">Entrar com:</span>
					<div class="options-group">


						<label class="option-item"> <input type="radio"
							class="option-radio" name="tipoLogin" value="login" checked>
							<span class="radio-custom"></span> <span class="option-label">Login
								<span class="default-badge">PADRÃO</span>
						</span>
						</label> <label class="option-item"> <input type="radio"
							class="option-radio" name="tipoLogin" value="email"> <span
							class="radio-custom"></span> <span class="option-label">
								E-Mail </span>
						</label> <label class="option-item"> <input type="radio"
							class="option-radio" name="tipoLogin" value="cpf"> <span
							class="radio-custom"></span> <span class="option-label">CPF</span>
						</label>
					</div>
				</div>
				<!-- Formulário -->
				<form th:action="@{/login}" method="post"
					onsubmit="mostrarLoading('Entrando no sistema...')">

					<!-- Campo oculto para enviar o tipo de login -->
					<input type="hidden" id="loginType" name="loginType" value="login">

					<!-- Campo dinâmico baseado na seleção -->
					<div class="form-group">
						<label for="username" class="form-label" id="usernameLabel">Nome
							de Login</label> <input type="text" class="form-control field-transition"
							name="username" id="username"
							placeholder="Digite seu Login de usuário" required autofocus>
						<i class="bi bi-person-circle input-icon" id="usernameIcon"></i>
					</div>

					<!-- Password -->
					<div class="form-group">
						<label for="senha" class="form-label">Senha</label> <input
							type="password" class="form-control" name="password" id="senha"
							placeholder="Digite sua senha" required> <i
							class="bi bi-lock input-icon" id="passwordIcon"></i>
					</div>



					<!-- Botão de login -->
					<button type="submit" class="login-btn">Login</button>
				</form>

				<!-- Forgot password -->
				<div class="forgot-password">
					<a href="/login?modo=forgot" class="forgot-link">Recuperar
						Senha</a>
				</div>


			</div>

			<!-- RECUPERAÇÃO DE SENHA -->
			<div th:if="${modo == 'forgot'}">
				<form action="/esqueci-senha" method="post"
					onsubmit="mostrarLoading('Enviando código para seu email...')">

					<div class="form-group">
						<label for="usernameRec" class="form-label" id="usernameLabelRec">Recuperar/Alterar
							Senha </label> <input type="text" class="form-control field-transition"
							name="login" id="usernameRec" placeholder="Digite seu e-mail de cadastro."
							required autofocus> <i
							class="bi bi-person-circle input-icon" id="usernameIconRec"></i>
					</div>
					<button type="submit" class="login-btn">Enviar código</button>

				</form>
			</div>

			<div th:if="${modo == 'reset'}">
				<p th:if="${primeiroAcesso}"
				   style="color: #C98242; font-weight: 600;">Primeiro acesso? Crie
					sua senha abaixo.</p>

				<form action="/reset-senha" method="post"
					onsubmit="mostrarLoading('Atualizando sua senha...')">

					<input type="hidden" name="login" th:value="${login}" />

					<div class="form-group">
						<label for="codigo" class="form-label">Código Recebido <small>(E-Mail)</small></label>
						<input type="text" class="form-control field-transition"
							name="codigo" id="codigo" placeholder="Código do email" required autofocus>
						<i class="fa-duotone fa-solid fa-code-compare input-icon"></i>
					</div>
					<div class="form-group">
						<label for="novaSenha" class="form-label">Nova Senha </label> <input
							type="password" class="form-control field-transition"
							name="senha" id="novaSenha" placeholder="Nova senha" required autofocus>
						<i class="fa-duotone fa-solid fa-key input-icon"></i>
					</div>
					<div class="form-group">
						<label for="confirmarSenha" class="form-label">Confirmar nova
							Senha </label> <input type="password"
							class="form-control field-transition" name="confirmarSenha"
							placeholder="Confirme a Nova senha"  id="confirmarSenha" required autofocus> <i
							class="fa-duotone fa-solid fa-key input-icon"></i>
					</div>

					<button type="submit" class="login-btn">Alterar senha</button>

				</form>

			</div>

			<!-- Mensagem de erro -->
			<div th:if="${erro}" class="error-message" th:text="${erro}"></div>


		</div>

	</div>

	<div id="loadingOverlay" style="display: none;">
		<div class="spinner-border text-light"></div>
		<p id="loadingText">Carregando...</p>
	</div>


	<script>
    setTimeout(() => {
        const msg = document.querySelector('.error-message');

        if (msg) {
            msg.style.transition = "all 0.5s ease";

            // efeito subir + desaparecer
            msg.style.transform = "translateY(-10px)";
            msg.style.opacity = "0";

            setTimeout(() => msg.remove(), 500);
        }

    }, 10000); // 10 segundos
</script>

	<script>
	function mostrarLoading(texto = "Carregando...") {
	    document.getElementById("loadingText").innerText = texto;
	    document.getElementById("loadingOverlay").style.display = "flex";
	}
	function esconderLoading() {

		const overlay = document.getElementById("loadingOverlay");

		if (overlay) {
			overlay.style.display = "none";
		}
	}
	window.addEventListener("pageshow", function () {
		esconderLoading();
	});
	function bloquearBotao(botao) {
    botao.disabled = true;
}
</script>
	<script>
		$(document).ready(function(){
			// Elementos que serão modificados
			const $username = $('#username');
			const $usernameLabel = $('#usernameLabel');

			const $usernameIcon = $('#usernameIcon');
			const $loginType = $('#loginType');



			// Configurações para cada tipo de login (ORDEM: login, email, cpf)
			const tiposLogin = {
				login: {
					label: 'Nome de Login',
					placeholder: 'Digite seu nome de usuário',
					icon: 'bi-person-circle',
					mask: false,
					validation: function(value) {
						return value.length >= 3;
					},
					errorMessage: 'O nome de login deve ter pelo menos 3 caracteres.',
					keyboardShortcut: '1'
				},
				email: {
					label: 'E-Mail',
					placeholder: 'Digite seu E-mail de Cadastro',
					icon: 'bi bi-envelope-fill',
					mask: false,
					validation: function(value) {
						const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
						return emailRegex.test(value);
					},
					errorMessage: 'Digite um e-mail válido.'
				},
				cpf: {
					label: 'CPF',
					placeholder: '000.000.000-00',
					icon: 'bi-person-vcard',
					mask: '000.000.000-00',
					validation: function(value) {
						const cpf = value.replace(/\D/g, '');
						return cpf.length === 11;
					},
					errorMessage: 'Por favor, digite um CPF válido com 11 dígitos.',
					keyboardShortcut: '3'
				}
			};
			function removerMascara() {
				if ($username.data('mask')) {
					$username.unmask();
				}
				$username.removeAttr('maxlength');
			}
			// Função para atualizar o campo baseado na seleção
			function atualizarCampo(tipo) {
				const config = tiposLogin[tipo];

				// Atualiza label
				$usernameLabel.text(config.label);

				// Atualiza placeholder
				$username.attr('placeholder', config.placeholder);

				// Atualiza ícone
				$usernameIcon.removeClass('bi-person-circle bi-envelope bi-person-vcard');
				$usernameIcon.addClass(config.icon);

				// Remove máscara anterior
				removerMascara();

				//aplica máscara se existir
				if (config.mask) {
					$username.mask(config.mask);
				}

				// Limpa o campo
				$username.val('');

				// Atualiza campo oculto
				$loginType.val(tipo);

				// Foco no campo
				$username.focus();
			}

			// Evento de mudança nos radio buttons
			$('input[name="tipoLogin"]').change(function() {
				const tipoSelecionado = $(this).val();
				atualizarCampo(tipoSelecionado);
			});

			// Inicializa com Nome de Login (padrão)
			atualizarCampo('login');

			// Validação do formulário
			$('form').submit(function(e) {
				const tipoAtual = $('input[name="tipoLogin"]:checked').val();
				const config = tiposLogin[tipoAtual];
				const valor = $username.val().trim();

				if (!config.validation(valor)) {
					alert(config.errorMessage);
					e.preventDefault();
					return false;
				}



				return true;
			});

			// Toggle password visibility
			$('#passwordIcon').on('click', function() {
				const passwordInput = $('#senha');
				const type = passwordInput.attr('type') === 'password' ? 'text' : 'password';
				passwordInput.attr('type', type);
				$(this).toggleClass('bi-lock bi-unlock');
			});

			// Atalhos de teclado para trocar tipo de login
			$(document).keydown(function(e) {
				// Alt+1 para Login (padrão), Alt+2 para Email, Alt+3 para CPF
				if (e.altKey) {
					switch(e.key) {
						case '1':
							$('input[name="tipoLogin"][value="login"]').prop('checked', true).trigger('change');
							e.preventDefault();
							break;
						case '2':
							$('input[name="tipoLogin"][value="email"]').prop('checked', true).trigger('change');
							e.preventDefault();
							break;
						case '3':
							$('input[name="tipoLogin"][value="cpf"]').prop('checked', true).trigger('change');
							e.preventDefault();
							break;
					}
				}
			});

			// Dica de atalhos de teclado (aparece brevemente no início)
			setTimeout(function() {
				console.log('Dica: Use Alt+1, Alt+2 ou Alt+3 para alternar rapidamente entre os tipos de login');
			}, 2000);

			// Anima a transição quando o usuário clica nas opções
			$('.option-item').on('click', function() {
				$(this).addClass('active');
				setTimeout(() => {
					$(this).removeClass('active');
				}, 300);
			});
		});
	</script>


</body>
