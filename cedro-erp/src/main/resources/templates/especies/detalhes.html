<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Detalhes da Espécie</title></head>
<body>
<div layout:fragment="content">
    <div class="container-fluid p-2">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb" style="margin-top: -25px; font-size: 0.8rem;">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/home}"><i class="fa-duotone fa-solid fa-house fs-7"></i> Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/especies}"><i class="fa-duotone fa-solid fa-tree"></i> Espécies - Lista</a></li>
                        <li class="breadcrumb-item"><span class="text-muted"><i class="fa-duotone fa-solid fa-memo-circle-info"></i> Detalhes</span></li>
                    </ol>
                </nav>
            </div>

            <div class="col-12">
                <div class="card">
                    <!-- HEADER MODERNO -->
                    <div class="card-header card-header-modern d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-2">
                            <div class="header-icon"><i class="fa-duotone fa-solid fa-tree"></i></div>
                            <div>
                                <h5 class="mb-0 fw-semibold">
                                    Detalhes da Espécie
                                    <span class="badge badge-soft-secondary ms-1" th:text="'#' + ${especie.id}"></span>
                                </h5>
                                <small class="text-muted" th:text="${especie.nome}"></small>
                            </div>
                        </div>
                        <div class="d-flex gap-2 flex-wrap">
                            <!-- VOLTAR -->
                            <a th:href="@{/especies}" class="btn btn-light btn-modern btn-sm d-flex align-items-center gap-2">
                                <i class="fa-duotone fa-solid fa-rotate-left"></i> Voltar
                            </a>

                            <!-- EDITAR (Só aparece se não estiver no modo exclusão) -->
                            <a th:if="${modoExclusao == null or !modoExclusao}"
                               th:href="@{'/especies/editar/' + ${especie.id}}"
                               class="btn btn-primary btn-modern btn-sm d-flex align-items-center gap-2">
                                <i class="fa-solid fa-pen"></i> Editar
                            </a>

                            <!-- EXCLUIR (Só aparece se estiver no modo exclusão) -->
                            <form th:if="${modoExclusao != null and modoExclusao}"
                                  th:action="@{'/especies/excluir/' + ${especie.id}}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-danger btn-modern btn-sm d-flex align-items-center gap-2">
                                    <i class="fa-duotone fa-solid fa-trash"></i> Confirmar Exclusão
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- BODY -->
                    <div class="card-body">
                        <!-- Seção: Dados da Espécie -->
                        <div class="detalhe-secao">
                            <i class="fa-duotone fa-solid fa-circle-info me-1"></i> Dados da Espécie
                        </div>
                        <div class="row g-3 mt-1">
                            <div class="col-md-12">
                                <div class="detalhe-item">
                                    <span class="detalhe-label">Nome da Espécie</span>
                                    <span class="detalhe-valor" th:text="${especie.nome}"></span>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="detalhe-item">
                                    <span class="detalhe-label">Status</span>
                                    <span class="detalhe-valor"
                                          th:text="${especie.status ? 'ATIVO' : 'INATIVO'}"
                                          th:classappend="${especie.status ? ' text-success' : ' text-danger'}">
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Seção: Auditoria -->
                        <div class="detalhe-secao mt-4">
                            <i class="fa-duotone fa-solid fa-clock-rotate-left me-1"></i> Auditoria
                        </div>
                        <div class="row g-3 mt-1">
                            <div class="col-md-6">
                                <div class="detalhe-item">
                                    <span class="detalhe-label">Data de Cadastro</span>
                                    <span class="detalhe-valor" th:text="${especie.dataCadastroFormatada}"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="detalhe-item">
                                    <span class="detalhe-label">Última Alteração</span>
                                    <span class="detalhe-valor" th:text="${especie.dataAlteracaoFormatada != '' ? especie.dataAlteracaoFormatada : 'Nunca alterado'}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- FOOTER -->
                    <div class="card-footer card-footer-modern">
                        <div th:if="${modoExclusao == null or !modoExclusao}" class="d-flex justify-content-end">
                            <h6 class="mb-0 text-muted small">
                                <i class="fa-duotone fa-solid fa-circle-info me-1"></i> Clique no botão EDITAR para alterar.
                            </h6>
                        </div>
                        <div th:if="${modoExclusao != null and modoExclusao}" class="alert alert-warning mb-0 w-100">
                            <i class="fa-duotone fa-solid fa-triangle-exclamation me-2"></i>
                            <strong>Atenção!</strong> A exclusão é definitiva.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
