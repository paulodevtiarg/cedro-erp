<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Clientes</title>
</head>

<body>
<div layout:fragment="content">

	<div class="container-fluid p-2">
		<div class="row">

			<!-- ============================================================ -->
			<!-- BREADCRUMB                                                   -->
			<!-- ============================================================ -->
			<div class="col-12">
				<nav aria-label="breadcrumb" style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a class="text-decoration-none" th:href="@{/home}">
								<i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a>
						</li>
						<li class="breadcrumb-item">
							<a class="text-decoration-none"
							   th:href="@{${queryParams != null and queryParams != ''} ? '/clientes?' + queryParams : '/clientes'}">
								<i class="fa-duotone fa-solid fa-rectangle-history-circle-user"></i> Clientes - Lista
							</a>
						</li>
						<li class="breadcrumb-item">
                            <span class="text-muted">
                                <i class="fa-duotone fa-solid fa-building-user"></i>
                                <span th:text="${cliente.id == null} ? 'Novo Registro' : 'Editar Registro'"></span>
                            </span>
						</li>
					</ol>
				</nav>
			</div>

			<!-- ============================================================ -->
			<!-- CARD DO FORMULÁRIO                                           -->
			<!-- ============================================================ -->
			<div class="col-12">
				<form th:object="${cliente}"
				      th:action="${cliente.id == null} ? @{/clientes/salvar} : @{'/clientes/editar/' + ${cliente.id} + '?' + ${queryParams}}"
				      method="post">
					<input type="hidden" th:field="*{id}">

					<div class="card">

						<!-- ==================================================== -->
						<!-- HEADER (igual ao detalhes)                          -->
						<!-- ==================================================== -->
						<div class="card-header card-header-modern d-flex justify-content-between align-items-center">

							<div class="d-flex align-items-center gap-2">
								<div class="header-icon">
									<i class="fa-duotone fa-solid fa-user-tie"></i>
								</div>
								<div>
									<h5 class="mb-0 fw-semibold">
										<span th:text="${cliente.id == null} ? 'Novo Cliente' : 'Editar Cliente'"></span>
										<span class="badge badge-soft-secondary ms-1"
										      th:if="${cliente.id != null}"
										      th:text="'#' + ${cliente.id}">#0</span>
									</h5>
									<small class="text-muted"
									       th:text="${cliente.id == null} ? 'Preencha os dados do novo cliente' : ${cliente.nome}"></small>
								</div>
							</div>

							<div class="d-flex gap-2">
								<a data-bs-toggle="tooltip" title="Cancelar Ação"
								   th:href="@{${queryParams != null and queryParams != ''} ? '/clientes?' + queryParams : '/clientes'}"
								   class="btn btn-light btn-modern btn-sm d-flex align-items-center gap-2">
									<i class="fa-duotone fa-solid fa-ban"></i> Cancelar
								</a>
								<button data-bs-toggle="tooltip" title="Salvar o Registro" type="submit"
								        class="btn btn-primary btn-modern btn-sm d-flex align-items-center gap-2">
									<i class="fa-duotone fa-solid fa-floppy-disk"></i> Salvar
								</button>
							</div>
						</div>

						<!-- ==================================================== -->
						<!-- BODY                                                 -->
						<!-- ==================================================== -->
						<div class="card-body">

							<!-- ===== SEÇÃO: PERFIL ===== -->
							<div class="detalhe-secao">
								<i class="fa-duotone fa-solid fa-sliders me-1"></i> Perfil
							</div>

							<div class="row g-3">
								<div class="col-md-4">
									<label for="tipoPessoa" class="form-label fw-semibold text-secondary mb-0">Tipo de Pessoa *</label>
									<select class="form-select" th:field="*{tipoPessoa}" id="tipoPessoa"
									        th:classappend="${#fields.hasErrors('tipoPessoa')} ? 'is-invalid' : ''">
										<option value="">Selecione</option>
										<option th:each="g : ${tipoPessoas}" th:value="${g}" th:text="${g.descricao}"></option>
									</select>
									<div class="invalid-feedback d-block" style="min-height: 20px;"
									     th:if="${#fields.hasErrors('tipoPessoa')}" th:errors="*{tipoPessoa}"></div>
								</div>
							</div>

							<!-- ==================================================== -->
							<!-- BLOCO PESSOA FÍSICA                                  -->
							<!-- ==================================================== -->
							<div id="blocoPessoaFisica" class="d-none">

								<!-- ===== Dados Pessoais ===== -->
								<div class="detalhe-secao mt-4">
									<i class="fa-duotone fa-solid fa-user me-1"></i> Dados Pessoais
								</div>

								<div class="row g-3">
									<div class="col-md-12">
										<label class="form-label fw-semibold text-secondary mb-0">Nome *</label>
										<input type="text" th:field="*{nome}" id="nome"
										       placeholder="Digite o Nome do novo Cliente" class="form-control"
										       th:classappend="${#fields.hasErrors('nomePfValido')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('nomePfValido')}" th:errors="*{nomePfValido}"></div>
									</div>

									<div class="col-md-6">
										<label class="form-label fw-semibold text-secondary mb-0">CPF *</label>
										<input type="text" th:field="*{cpf}" id="cpf" placeholder="000.000.000-00"
										       oninput="mascaraCPF(this)" class="form-control"
										       th:classappend="${#fields.hasErrors('cpfValido')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('cpfValido')}" th:errors="*{cpfValido}"></div>
									</div>

									<div class="col-md-6">
										<label for="genero" class="form-label fw-semibold text-secondary mb-0">Gênero *</label>
										<select class="form-select" th:field="*{genero}" id="genero"
										        th:classappend="${#fields.hasErrors('generoValido')} ? 'is-invalid' : ''">
											<option value="">Selecione</option>
											<option th:each="g : ${generos}" th:value="${g}" th:text="${g.descricao}"></option>
										</select>
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('generoValido')}" th:errors="*{generoValido}"></div>
									</div>

									<div class="col-md-6">
										<label class="form-label fw-semibold text-secondary mb-0">Data de Nascimento *</label>
										<input type="text" th:field="*{dataNascimentoInicio}" id="dataNascimentoInicio"
										       placeholder="DD/MM/AAAA" maxlength="10"
										       oninput="mascaraData(this)" class="form-control mask-data"
										       th:classappend="${#fields.hasErrors('dataNascimentoValida')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('dataNascimentoValida')}" th:errors="*{dataNascimentoValida}"></div>
									</div>

									<div class="col-md-6">
										<label for="estadoCivil" class="form-label fw-semibold text-secondary mb-0">Estado Civil</label>
										<select class="form-select" th:field="*{estadoCivil}" id="estadoCivil">
											<option value="">Selecione</option>
											<option th:each="g : ${estadosCivil}" th:value="${g}" th:text="${g.descricao}"></option>
										</select>
									</div>
								</div>

								<!-- ===== Contato ===== -->
								<div class="detalhe-secao mt-4">
									<i class="fa-duotone fa-solid fa-address-book me-1"></i> Contato
								</div>

								<div class="row g-3">
									<div class="col-md-4">
										<label for="emailPrincipal" class="form-label fw-semibold text-secondary mb-0">E-mail</label>
										<input type="email" th:field="*{emailPrincipal}" id="emailPrincipal"
										       placeholder="Somente minusculas"
										       class="form-control">
									</div>
									<div class="col-md-3">
										<label for="telefone" class="form-label fw-semibold text-secondary mb-0">Telefone <small>Fixo</small></label>
										<input type="text" th:field="*{telefone}" id="telefone"
										       placeholder="(00) 00000-0000" oninput="mascaraTelefone(this)"
										       class="form-control">
									</div>
									<div class="col-md-3">
										<label for="celular" class="form-label fw-semibold text-secondary mb-0">Celular</label>
										<input type="text" th:field="*{celular}" id="celular"
										       placeholder="(00) 00000-0000" oninput="mascaraTelefone(this)"
										       class="form-control">
									</div>
									<div class="col-md-2 d-flex align-items-end">
										<label class="switch-modern" for="whatsapp">
											<input type="checkbox" role="switch" id="whatsapp" th:field="*{whatsapp}">
											<i class="fa-brands fa-whatsapp"></i> Este celular é WhatsApp
										</label>
									</div>
								</div>

								<!-- ===== Endereço ===== -->
								<div class="detalhe-secao mt-4">
									<i class="fa-duotone fa-solid fa-location-dot me-1"></i> Endereço
								</div>

								<div class="row g-3">
									<div class="col-md-2">
										<label class="form-label fw-semibold text-secondary mb-0">CEP *</label>
										<input type="text" th:field="*{cep}" id="cep" placeholder="00.000-000"
										       class="form-control mask-cep"
										       th:classappend="${#fields.hasErrors('cep')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></div>
									</div>
									<div class="col-md-10">
										<label class="form-label fw-semibold text-secondary mb-0">Logradouro *</label>
										<input type="text" th:field="*{logradouro}" id="logradouro"
										       placeholder="Rua, Avenida, etc..." class="form-control"
										       th:classappend="${#fields.hasErrors('logradouro')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></div>
									</div>
									<div class="col-md-2">
										<label class="form-label fw-semibold text-secondary mb-0">Número</label>
										<input type="text" th:field="*{numero}" id="numero" placeholder="SN se não houver" class="form-control">
									</div>
									<div class="col-md-5">
										<label class="form-label fw-semibold text-secondary mb-0">Complemento</label>
										<input type="text" th:field="*{complemento}" id="complemento" placeholder="Qd, Lote, etc..." class="form-control">
									</div>
									<div class="col-md-5">
										<label class="form-label fw-semibold text-secondary mb-0">Bairro</label>
										<input type="text" th:field="*{bairro}" id="bairro" placeholder="Setor, Loteamento, Vila" class="form-control">
									</div>
									<div class="col-md-4">
										<label for="uf" class="form-label fw-semibold text-secondary mb-0">UF *</label>
										<select class="form-select" th:field="*{uf}" id="uf"
										        th:classappend="${#fields.hasErrors('uf')} ? 'is-invalid' : ''">
											<option value="">Selecione</option>
											<option th:each="g : ${estados}" th:value="${g.codigo}" th:text="${g.nome}"></option>
										</select>
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('uf')}" th:errors="*{uf}"></div>
									</div>
									<div class="col-md-8">
										<label for="idMunicipio" class="form-label fw-semibold text-secondary mb-0">Cidade *</label>
										<select class="form-select" th:field="*{idMunicipio}" id="idMunicipio"
										        th:classappend="${#fields.hasErrors('idMunicipio')} ? 'is-invalid' : ''">
											<option value="">Selecione o Estado primeiro</option>
											<option th:each="m : ${municipios}" th:value="${m.id}" th:text="${m.nome}"></option>
										</select>
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('idMunicipio')}" th:errors="*{idMunicipio}"></div>
									</div>

								</div>
							</div>

							<!-- ==================================================== -->
							<!-- BLOCO PESSOA JURÍDICA                                -->
							<!-- ==================================================== -->
							<div id="blocoPessoaJuridica" class="d-none">

								<!-- ===== Dados da Empresa ===== -->
								<div class="detalhe-secao mt-4">
									<i class="fa-duotone fa-solid fa-building me-1"></i> Dados da Empresa
								</div>

								<div class="row g-3">
									<div class="col-md-5">
										<label class="form-label fw-semibold text-secondary mb-0">Razão Social *</label>
										<input type="text" th:field="*{razaoSocial}" id="razaoSocial"
										       placeholder="Digite a Razão Social da empresa" class="form-control"
										       th:classappend="${#fields.hasErrors('razaoSocialValida')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('razaoSocialValida')}" th:errors="*{razaoSocialValida}"></div>
									</div>
									<div class="col-md-4">
										<label class="form-label fw-semibold text-secondary mb-0">Fantasia</label>
										<input type="text" th:field="*{nome}" id="nomePj"
										       placeholder="Digite a fantasia da empresa" class="form-control" >

									</div>
									<div class="col-md-3">
										<label class="form-label fw-semibold text-secondary mb-0">Inicio Atividades *</label>
										<input type="text" th:field="*{dataNascimentoInicio}" id="dataNascimentoInicioPj"
										       placeholder="DD/MM/AAAA" maxlength="10"
										       oninput="mascaraData(this)" class="form-control mask-data"
										       th:classappend="${#fields.hasErrors('dataNascimentoValidaPj')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('dataNascimentoValidaPj')}" th:errors="*{dataNascimentoValidaPj}"></div>
									</div>


									<div class="col-md-6">
										<label class="form-label fw-semibold text-secondary mb-0">CNPJ *</label>
										<input type="text" th:field="*{cnpj}" id="cnpj" placeholder="00.000.000/0000-00"
										       oninput="mascaraCNPJ(this)" class="form-control"
										       th:classappend="${#fields.hasErrors('cnpjValido')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('cnpjValido')}" th:errors="*{cnpjValido}"></div>
									</div>

									<div class="col-md-6">
										<label class="form-label fw-semibold text-secondary mb-0">Inscrição Estadual</label>
										<input type="text" th:field="*{inscricaoEstadual}" id="inscricaoEstadual"
										       placeholder="Isento se não houver" class="form-control">
									</div>

									<div class="col-md-5">
										<label for="regimeTributario" class="form-label fw-semibold text-secondary mb-0">Regime Tributário *</label>
										<select class="form-select" th:field="*{regimeTributario}" id="regimeTributario"
										        th:classappend="${#fields.hasErrors('regimeTributarioValido')} ? 'is-invalid' : ''">
											<option value="">Selecione</option>
											<option th:each="r : ${regimeTributario}" th:value="${r}" th:text="${r.descricao}"></option>
										</select>
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('regimeTributarioValido')}" th:errors="*{regimeTributarioValido}"></div>
									</div>
									<!-- Switch MEI (na frente do Regime) -->
									<div class="col-md-1 d-flex align-items-end" style="padding-bottom: 1.9rem !important;">
										<label class="switch-modern w-100 justify-content-center mb-0" for="mei">
											<input type="checkbox" role="switch" id="mei" th:field="*{mei}">
											<i class="fa-duotone fa-solid fa-store"></i> É MEI
										</label>
									</div>
									<div class="col-md-6">
										<label class="form-label fw-semibold text-secondary mb-0">CNAE Principal</label>
										<div class="input-group">
											<input type="text" th:field="*{cnae}" id="cnaeInput" list="listaCnaes"
											       placeholder="Digite o código do CNAE..." class="form-control" autocomplete="off">
											<datalist id="listaCnaes"></datalist>
											<span class="input-group-text" id="cnaeLoader" style="display: none;">
            <i class="fa-duotone fa-solid fa-spinner fa-spin"></i>
        </span>
										</div>
										<div class="mt-1" style="min-height: 20px;">
											<small class="text-muted" id="cnaeDescricao">Nenhum CNAE selecionado</small>
										</div>
									</div>
								</div>



								<!-- ===== Contato ===== -->
								<div class="detalhe-secao mt-4">
									<i class="fa-duotone fa-solid fa-address-book me-1"></i> Contato
								</div>

								<div class="row g-3">
									<div class="col-md-4">
										<label for="emailPrincipalPj" class="form-label fw-semibold text-secondary mb-0">E-Mail</label>
										<input type="email" th:field="*{emailPrincipal}" id="emailPrincipalPj"
										       placeholder="Somente minúsculas"
										       class="form-control">
									</div>
									<div class="col-md-3">
										<label for="telefonePj" class="form-label fw-semibold text-secondary mb-0">Telefone <small>Fixo</small></label>
										<input type="text" th:field="*{telefone}" id="telefonePj"
										       placeholder="(00) 00000-0000" oninput="mascaraTelefone(this)"
										       class="form-control">
									</div>
									<div class="col-md-3">
										<label for="celularPj" class="form-label fw-semibold text-secondary mb-0">Celular</label>
										<input type="text" th:field="*{celular}" id="celularPj"
										       placeholder="(00) 00000-0000" oninput="mascaraTelefone(this)"
										       class="form-control">
									</div>
								  <div class="col-md-2 d-flex align-items-end">
										<label class="switch-modern" for="whatsappPj">
											<input type="checkbox" role="switch" id="whatsappPj" th:field="*{whatsapp}">
											<i class="fa-brands fa-whatsapp"></i> Este celular é WhatsApp
										</label>
									</div>
								</div>

								<!-- ===== Endereço ===== -->
								<div class="detalhe-secao mt-4">
									<i class="fa-duotone fa-solid fa-location-dot me-1"></i> Endereço
								</div>

								<div class="row g-3">
									<div class="col-md-2">
										<label class="form-label fw-semibold text-secondary mb-0">CEP *</label>
										<input type="text" th:field="*{cep}" id="cepPj" placeholder="00.000-000"
										       class="form-control mask-cep"
										       th:classappend="${#fields.hasErrors('cep')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></div>
									</div>
									<div class="col-md-10">
										<label class="form-label fw-semibold text-secondary mb-0">Logradouro *</label>
										<input type="text" th:field="*{logradouro}" id="logradouroPj"
										       placeholder="Rua, Avenida, etc..." class="form-control"
										       th:classappend="${#fields.hasErrors('logradouro')} ? 'is-invalid' : ''">
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></div>
									</div>
									<div class="col-md-2">
										<label class="form-label fw-semibold text-secondary mb-0">Número</label>
										<input type="text" th:field="*{numero}" id="numeroPj" placeholder="SN se não houver" class="form-control">
									</div>
									<div class="col-md-5">
										<label class="form-label fw-semibold text-secondary mb-0">Complemento</label>
										<input type="text" th:field="*{complemento}" id="complementoPj" placeholder="Qd, Lote, etc..." class="form-control">
									</div>
									<div class="col-md-5">
										<label class="form-label fw-semibold text-secondary mb-0">Bairro</label>
										<input type="text" th:field="*{bairro}" id="bairroPj" placeholder="Setor, Loteamento, Vila" class="form-control">
									</div>
									<div class="col-md-4">
										<label for="ufPj" class="form-label fw-semibold text-secondary mb-0">UF *</label>
										<select class="form-select" th:field="*{uf}" id="ufPj"
										        th:classappend="${#fields.hasErrors('uf')} ? 'is-invalid' : ''">
											<option value="">Selecione</option>
											<option th:each="g : ${estados}" th:value="${g.codigo}" th:text="${g.nome}"></option>
										</select>
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('uf')}" th:errors="*{uf}"></div>
									</div>
									<div class="col-md-8">
										<label for="idMunicipioPj" class="form-label fw-semibold text-secondary mb-0">Cidade *</label>
										<select class="form-select" th:field="*{idMunicipio}" id="idMunicipioPj"
										        th:classappend="${#fields.hasErrors('idMunicipio')} ? 'is-invalid' : ''">
											<option value="">Selecione o Estado primeiro</option>
											<option th:each="m : ${municipios}" th:value="${m.id}" th:text="${m.nome}"></option>
										</select>
										<div class="invalid-feedback d-block" style="min-height: 20px;"
										     th:if="${#fields.hasErrors('idMunicipio')}" th:errors="*{idMunicipio}"></div>
									</div>

								</div>
							</div>

						</div>

						<!-- ==================================================== -->
						<!-- FOOTER                                               -->
						<!-- ==================================================== -->
						<div class="card-footer card-footer-modern">
							<small class="text-muted d-flex align-items-center gap-1">
								<i class="fa-duotone fa-solid fa-circle-info"></i>
								Campos com <span class="text-danger fw-semibold">*</span> são obrigatórios.
							</small>
						</div>

					</div>
				</form>
			</div>

		</div>

	<script>
		document.addEventListener('DOMContentLoaded', function () {

			console.log('[form] DOMContentLoaded executado');

			/* ============================================================
             * 1. CEP → ViaCEP → UF → Municípios (reutilizável PF/PJ)
             * ============================================================ */
			function initEndereco(ids) {
				const cepInput        = document.getElementById(ids.cep);
				const logradouroInput = document.getElementById(ids.logradouro);
				const bairroInput     = document.getElementById(ids.bairro);
				const estadoSelect    = document.getElementById(ids.uf);
				const municipioSelect = document.getElementById(ids.municipio);

				if (!cepInput) {
					console.warn('[form] CEP não encontrado para ids:', ids);
					return;
				}

				function carregarMunicipiosPorUf(uf, idMunicipioSelecionar) {
					if (!municipioSelect) return;

					municipioSelect.innerHTML = '<option value="">Carregando municípios...</option>';

					if (!uf) {
						municipioSelect.innerHTML = '<option value="">Selecione o Estado primeiro</option>';
						return;
					}

					fetch('/api/municipios/' + uf)
							.then(response => {
								if (!response.ok) throw new Error('Erro HTTP ' + response.status);
								return response.json();
							})
							.then(municipios => {
								console.log('[municípios] UF:', uf, '| retornou:', municipios.length, 'itens');
								municipioSelect.innerHTML = '<option value="">Selecione o município</option>';
								municipios.forEach(mun => {
									const option = document.createElement('option');
									option.value = mun.id;
									option.text  = mun.nome;
									if (idMunicipioSelecionar && String(mun.id) === String(idMunicipioSelecionar)) {
										option.selected = true;
									}
									municipioSelect.appendChild(option);
								});
							})
							.catch(error => {
								console.error('[municípios] erro:', error);
								municipioSelect.innerHTML = '<option value="">Erro ao carregar municípios</option>';
							});
				}

				if (estadoSelect) {
					estadoSelect.addEventListener('change', function () {
						carregarMunicipiosPorUf(this.value, null);
					});

					if (estadoSelect.value) {
						// Pega o valor atual do select de município (que o Spring preencheu no retorno de erro)
						// Se ele estiver vazio, manda null.
						const municipioAtual = municipioSelect && municipioSelect.value ? municipioSelect.value : null;

						carregarMunicipiosPorUf(estadoSelect.value, municipioAtual);
					}
				}

				cepInput.addEventListener('blur', function () {
					const cepLimpo = this.value.replace(/\D/g, '');
					if (cepLimpo.length !== 8) return;

					if (typeof mostrarLoading === 'function') mostrarLoading();

					fetch('https://viacep.com.br/ws/' + cepLimpo + '/json/')
							.then(response => response.json())
							.then(data => {
								if (data.erro) { alert('CEP não encontrado!'); return; }

								if (logradouroInput) logradouroInput.value = data.logradouro;
								if (bairroInput)     bairroInput.value     = data.bairro;

								const paisInput = document.getElementById(ids.pais);
								if (paisInput) paisInput.value = "Brasil";

								if (estadoSelect) {
									estadoSelect.value = data.uf;

									fetch('/api/municipios/ibge/' + data.ibge)
											.then(res => {
												if (!res.ok) throw new Error('Município não encontrado');
												return res.json();
											})
											.then(munDto => carregarMunicipiosPorUf(data.uf, munDto.id))
											.catch(err => {
												console.warn('[cep] município não localizado:', err);
												carregarMunicipiosPorUf(data.uf, null);
											});
								}
							})
							.catch(error => {
								console.error('[cep] erro ViaCEP:', error);
								alert('Não foi possível consultar o CEP no momento.');
							})
							.finally(() => {
								if (typeof esconderLoading === 'function') esconderLoading();
							});
				});
			}

			initEndereco({
				cep: 'cep', logradouro: 'logradouro', bairro: 'bairro',
				uf: 'uf', municipio: 'idMunicipio'
			});

			initEndereco({
				cep: 'cepPj', logradouro: 'logradouroPj', bairro: 'bairroPj',
				uf: 'ufPj', municipio: 'idMunicipioPj'
			});

			/* ============================================================
             * 2. Alternância PF / PJ
             * ============================================================ */
			const selectTipoPessoa = document.getElementById('tipoPessoa');
			const blocoFisica      = document.getElementById('blocoPessoaFisica');
			const blocoJuridica    = document.getElementById('blocoPessoaJuridica');

			console.log('[form] tipoPessoa:', selectTipoPessoa,
					'| blocoFisica:', blocoFisica,
					'| blocoJuridica:', blocoJuridica);

			function alternarTipoPessoa() {
				if (!selectTipoPessoa || !blocoFisica || !blocoJuridica) return;

				const valor = selectTipoPessoa.value;
				console.log('[form] alternando para:', valor);

				if (valor === 'FISICA') {
					blocoFisica.classList.remove('d-none');
					blocoJuridica.classList.add('d-none');

					// 🔥 Desabilita campos do PJ e Habilita do PF
					blocoJuridica.querySelectorAll('input, select, textarea').forEach(el => el.disabled = true);
					blocoFisica.querySelectorAll('input, select, textarea').forEach(el => el.disabled = false);

				} else if (valor === 'JURIDICA') {
					blocoJuridica.classList.remove('d-none');
					blocoFisica.classList.add('d-none');

					// 🔥 Desabilita campos do PF e Habilita do PJ
					blocoFisica.querySelectorAll('input, select, textarea').forEach(el => el.disabled = true);
					blocoJuridica.querySelectorAll('input, select, textarea').forEach(el => el.disabled = false);

				} else {
					blocoFisica.classList.add('d-none');
					blocoJuridica.classList.add('d-none');

					// 🔥 Desabilita ambos
					blocoFisica.querySelectorAll('input, select, textarea').forEach(el => el.disabled = true);
					blocoJuridica.querySelectorAll('input, select, textarea').forEach(el => el.disabled = true);
				}
			}

			if (selectTipoPessoa) {
				selectTipoPessoa.addEventListener('change', alternarTipoPessoa);
				alternarTipoPessoa(); // estado inicial (edição / erros de validação)
			}

			/* ============================================================
             * 3. Switch moderno — feedback visual
             * ============================================================ */
			document.querySelectorAll('.switch-modern input[type="checkbox"]').forEach(cb => {
				const label = cb.closest('.switch-modern');
				function atualizar() { label.classList.toggle('ativo', cb.checked); }
				cb.addEventListener('change', atualizar);
				atualizar();
			});
		});
	</script>

	<script>
		document.addEventListener("DOMContentLoaded", function () {
			const cnaeInput = document.getElementById('cnaeInput');
			const cnaeList = document.getElementById('listaCnaes');
			const cnaeDesc = document.getElementById('cnaeDescricao');
			const cnaeLoader = document.getElementById('cnaeLoader');

			if (!cnaeInput) return;

			let cnaesData = [];

			// A URL correta para arquivos na pasta static
			const urlCnaes = '/json/cnaes.json';

			if (cnaeLoader) cnaeLoader.style.display = 'inline-block';
			cnaeDesc.innerHTML = '<i class="fa-duotone fa-solid fa-spinner fa-spin"></i> Carregando CNAEs...';

			fetch(urlCnaes)
					.then(res => {
						if (!res.ok) {
							throw new Error(`Erro HTTP: ${res.status}`);
						}
						return res.json();
					})
					.then(data => {
						// 🔥 AQUI ESTÁ A CORREÇÃO: Acessa a lista dentro da chave "ListaCnae"
						let listaCnaes = data.ListaCnae;

						// Validação de segurança
						if (!Array.isArray(listaCnaes)) {
							throw new Error("O JSON não contém a lista 'ListaCnae'.");
						}

						cnaesData = listaCnaes;
						console.log("CNAEs carregados com sucesso:", cnaesData.length, "itens.");

						// Popula o datalist
						cnaeList.innerHTML = '';
						cnaesData.forEach(item => {
							const option = document.createElement('option');
							option.value = item.codigo;
							option.text = `${item.codigo} - ${item.descricao}`;
							cnaeList.appendChild(option);
						});

						// Se for edição e já tiver CNAE, atualiza a descrição
						if (cnaeInput.value) {
							atualizarDescricaoCnae(cnaeInput.value);
						} else if (cnaeDesc) {
							cnaeDesc.textContent = "Nenhum CNAE selecionado";
						}
					})
					.catch(err => {
						console.error("Erro ao carregar CNAEs:", err);
						cnaeDesc.innerHTML = `<span class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> Erro: ${err.message}</span>`;
					})
					.finally(() => {
						if (cnaeLoader) cnaeLoader.style.display = 'none';
					});

			// Função que atualiza a descrição abaixo do input
			function atualizarDescricaoCnae(codigo) {
				const codigoLimpo = codigo.replace(/\D/g, '');

				if (codigoLimpo.length === 7) {
					const cnaeEncontrado = cnaesData.find(c => c.codigo === codigoLimpo);
					if (cnaeEncontrado) {
						cnaeDesc.innerHTML = `<i class="fa-duotone fa-solid fa-circle-check text-success me-1"></i> <span class="text-success fw-semibold">${cnaeEncontrado.descricao}</span>`;
						return;
					}
				}

				if (codigoLimpo.length === 0) {
					cnaeDesc.textContent = "Nenhum CNAE selecionado";
				} else {
					cnaeDesc.innerHTML = '<span class="text-warning">Código incompleto ou inválido</span>';
				}
			}

			// Ouve a digitação/seleção do usuário
			cnaeInput.addEventListener('input', function () {
				atualizarDescricaoCnae(this.value);
			});
		});
	</script>

		// O Thymeleaf lê o arquivo e joga o JSON direto na variável JS.
		// O "/*[[...]]*/" garante que isso funcione.
		const cnaesDataJson = /*[[@{/json/cnaes.json}]]*/ [];
