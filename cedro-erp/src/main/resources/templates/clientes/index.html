<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Clientes</title>

</head>

<body>
<div layout:fragment="content">

	<div class="container-fluid p-2">
		<div class="row">
			<div class="col-12">
				<nav aria-label="breadcrumb card"
				     style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a th:href="@{/home}">
								<i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a>
						</li>
						<li class="breadcrumb-item">
							  <span class="text-muted">
								 <i class="fa-duotone fa-solid fa-rectangle-history-circle-user"></i> Clientes - Lista
							  </span>
						</li>

					</ol>
				</nav>


			</div>
			<div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>

			<div class="col-12">
				<div class="card">
					<div th:replace="~{fragments/componentes :: cardHeader(
						'Clientes',
						'Gerencie os registros de Clientes',
						'user-tie-hair',
						'/clientes/novo',
						'Cliente',
						${queryParams}
					)}">

					</div>
					<div class="card-body">
						<div class="row">
							<div class="col-12">
								<form th:action="@{/clientes}" method="get" class="filter-box mb-2">
									<input type="hidden" name="idEmpresa" th:value="${idEmpresa}">
									<div class="row g-3">
										<div class="col-md-4">
											<label class="form-label small fw-semibold text-secondary">Nome</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-user"></i></span>
												<input type="text" name="filtroNome" th:value="${filtro.filtroNome}"
												       class="form-control" placeholder="Digite para buscar">
											</div>
										</div>
										<div class="col-md-4">
											<label class="form-label small fw-semibold text-secondary">Razão Social</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-user"></i></span>
												<input type="text" name="filtroRazaoSocial" th:value="${filtro.filtroRazaoSocial}"
												       class="form-control" placeholder="Digite para buscar">
											</div>
										</div>
										<div class="col-md-2">
											<label class="form-label small fw-semibold text-secondary">CPF</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-id-card"></i></span>
												<input type="text" name="filtroCpf" id="filtroCpf" oninput="mascaraCPF(this)" th:value="${filtro.filtroCpf}"
												       class="form-control" placeholder="000.000.000-00">
												<div class="invalid-feedback">CPF inválido</div>
											</div>
										</div>
										<div class="col-md-2">
											<label class="form-label small fw-semibold text-secondary">CNPJ</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-id-card"></i></span>
												<input type="text" name="filtroCnpj" id="filtroCnpj" oninput="mascaraCNPJ(this)" th:value="${filtro.filtroCnpj}"
												       class="form-control" placeholder="00.000.000/0000-00" maxlength="18">
												<div class="invalid-feedback">Cnpj inválido</div>
											</div>
										</div>





									</div>
									<div class="row g-3">
										<div class="col-md-4">
											<label class="form-label small fw-semibold text-secondary">Cidade</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-location-dot"></i></span>
												<input type="text" name="filtroCidade" th:value="${filtro.filtroCidade}"
												       class="form-control" placeholder="Digite para buscar">
											</div>
										</div>
										<div th:replace="~{fragments/componentes :: filtroStatus(${filtro}, 'col-md-2')}"></div>
										<div th:replace="~{fragments/componentes :: filtroLinhas(${filtro}, 'col-md-2')}"></div>

										<div th:replace="~{fragments/componentes :: botoesFiltro('/clientes', 'col-md-4')}"></div>

									</div>

								</form>

							</div>
							<div class="col-12">
								<div class="d-none d-md-block">
									<table class="table table-modern align-middle mb-0">
										<thead>
										<tr>
											<th class="text-center" style="width: 22%;">Nome</th>
											<th>Cidade</th>
											<th>Bairro </th>
											<th>UF</th>
											<th>Telefone</th>
											<th>Celular</th>
											<th class="text-center" style="width: 120px;">Status</th>
											<th class="text-center" style="width: 140px;">Ações</th>
										</tr>
										</thead>
										<tbody>
										<tr th:if="${clientes.empty}">
											<td colspan="8">
												<div th:replace="~{fragments/componentes :: emptyState('Nenhum cliente encontrado com os filtros atuais.')}"></div>
											</td>
										</tr>

										<tr th:each="cliente : ${clientes}">
											<td>
												<div class="fw-semibold text-dark" th:text="${cliente.nome}"></div>

												<small class="text-muted d-block">
													<i class="fa-duotone fa-solid fa-building-user me-1"></i>
													<span th:text="${cliente.razaoSocial}"></span> &bull;

												</small>

												<small class="text-muted d-block">
													<i class="fa-duotone fa-solid fa-envelope me-1"></i>
													<span th:text="${cliente.emailPrincipal}"></span> &bull;
												</small>


											</td>

											<td th:text="${cliente.cidade}"></td>
											<td th:text="${cliente.bairro}"></td>
											<td th:text="${cliente.uf}"></td>
											<td th:text="${cliente.telefone}"></td>
											<td>
												<div class="fw-semibold text-dark d-flex align-items-center gap-1">
													<span th:text="${cliente.celular}"></span>
													<!-- O ícone só aparece se o flag for verdadeiro -->
													<i th:if="${cliente.whatsapp == true}"
													   class="fa-brands fa-whatsapp text-success ms-1"
													   title="WhatsApp"></i>
												</div>
											</td>




											<td class="text-center">
												<th:block th:replace="~{fragments/componentes :: badgeStatus(${cliente.status})}"></th:block>
											</td>

											<td class="text-center text-nowrap">
												<div th:replace="~{fragments/componentes :: acoes(
													${cliente.id},
													'/clientes',
													${queryParams},
													'cliente'
												     )}">

												</div>
											</td>
										</tr>
										</tbody>
									</table>
								</div>
								<!-- MOBILE -->
								<div class="d-md-none">
									<!-- Empty state -->
									<div th:if="${clientes.empty}">
										<div th:replace="~{fragments/componentes :: emptyState('Nenhum cliente encontrado com os filtros atuais.')}"></div>
									</div>

									<!-- Cards -->
									<div class="d-flex flex-column gap-2">
										<div th:each="cliente : ${clientes}" class="card card-mobile-modern">
											<div class="card-body p-3">

												<!-- Cabeçalho: nome + status -->
												<div class="d-flex justify-content-between align-items-start gap-2 mb-2">
													<div class="min-w-0">
														<div class="fw-semibold text-dark text-truncate"
														     th:text="${cliente.nome}"></div>
														<small class="text-muted d-block text-truncate">
															<i class="fa-duotone fa-solid fa-building-user me-1"></i>
															<span th:text="${cliente.razaoSocial}"></span>
														</small>
													</div>
													<div class="flex-shrink-0">
														<th:block th:replace="~{fragments/componentes :: badgeStatus(${cliente.status})}"></th:block>
													</div>
												</div>

												<!-- Email -->
												<small class="text-muted d-block text-truncate mb-2">
													<i class="fa-duotone fa-solid fa-envelope me-1"></i>
													<span th:text="${cliente.emailPrincipal}"></span>
												</small>

												<hr class="pr-hr my-2"/>

												<!-- Endereço -->
												<div class="d-flex align-items-center small text-muted mb-1">
													<i class="fa-duotone fa-solid fa-location-dot me-2"></i>
													<span>
                        <span th:text="${cliente.cidade}"></span> /
                        <span th:text="${cliente.uf}"></span>
                    </span>
												</div>
												<div class="small text-muted mb-2" th:if="${cliente.bairro != null and !cliente.bairro.isEmpty()}">
													<i class="fa-duotone fa-solid fa-map me-2"></i>
													<span th:text="${cliente.bairro}"></span>
												</div>

												<!-- Telefones -->
												<div class="d-flex flex-wrap gap-3 small mb-2">
													<div class="text-muted" th:if="${cliente.telefone != null and !cliente.telefone.isEmpty()}">
														<i class="fa-duotone fa-solid fa-phone me-1"></i>
														<span th:text="${cliente.telefone}"></span>
													</div>
													<div class="text-muted" th:if="${cliente.celular != null and !cliente.celular.isEmpty()}">
														<i class="fa-duotone fa-solid fa-mobile-screen me-1"></i>
														<span th:text="${cliente.celular}"></span>
													</div>
												</div>

												<!-- Ações -->
												<div class="d-flex justify-content-end pt-2 border-top">
													<div th:replace="~{fragments/componentes :: acoes(
                        ${cliente.id},
                        '/clientes',
                        ${queryParams},
                        'cliente'
                         )}">
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

					</div>
					<div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

						<!-- Info à esquerda -->
						<small class="text-muted">
							Página <strong th:text="${clientes.number + 1}"></strong>
							de <strong th:text="${clientes.totalPages}"></strong>
							&bull;
							<span th:text="${clientes.totalElements}"></span> registro(s)
						</small>



						<!-- Paginação à direita -->
						<nav aria-label="Paginação">
							<ul class="pagination pagination-modern mb-0">

								<!-- Primeira -->
								<li class="page-item" th:classappend="${clientes.first} ? 'disabled'">
									<a class="page-link"
									   th:href="@{/clientes(
                        page=0,
                        filtroNome=${filtro.filtroNome},
                        filtroCpf=${filtro.filtroCpf},
                        filtroCnpj=${filtro.filtroCnpj},
                        filtroRazaoSocial=${filtro.filtroRazaoSocial},
                        filtroCidade=${filtro.filtroCidade},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Primeira página">
										<i class="fa-duotone fa-solid fa-angles-left"></i>
									</a>
								</li>

								<!-- Anterior -->
								<li class="page-item" th:classappend="${clientes.first} ? 'disabled'">
									<a class="page-link"
									   th:href="@{/clientes(
                        page=${clientes.number - 1},
                        filtroNome=${filtro.filtroNome},
                        filtroCpf=${filtro.filtroCpf},
                        filtroCnpj=${filtro.filtroCnpj},
                        filtroRazaoSocial=${filtro.filtroRazaoSocial},
                        filtroCidade=${filtro.filtroCidade},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Anterior">
										<i class="fa-duotone fa-solid fa-chevron-left"></i>
									</a>
								</li>
								<th:block th:if="${clientes.totalPages > 0}">
									<!-- Números -->
									<li th:each="i : ${#numbers.sequence(0, clientes.totalPages - 1)}"
									    class="page-item"
									    th:classappend="${i == clientes.number} ? 'active'">
										<a class="page-link"
										   th:href="@{/clientes(
                        page=${i},
                         filtroNome=${filtro.filtroNome},
                        filtroCpf=${filtro.filtroCpf},
                        filtroCnpj=${filtro.filtroCnpj},
                        filtroRazaoSocial=${filtro.filtroRazaoSocial},
                        filtroCidade=${filtro.filtroCidade},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
										   th:text="${i + 1}"></a>
									</li>
								</th:block>
								<!-- Próxima -->
								<li class="page-item" th:classappend="${clientes.last} ? 'disabled'">
									<a class="page-link"
									   th:href="@{/clientes(
                        page=${clientes.number + 1},
                       filtroNome=${filtro.filtroNome},
                        filtroCpf=${filtro.filtroCpf},
                        filtroCnpj=${filtro.filtroCnpj},
                        filtroRazaoSocial=${filtro.filtroRazaoSocial},
                        filtroCidade=${filtro.filtroCidade},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Próxima">
										<i class="fa-duotone fa-solid fa-chevron-right"></i>
									</a>
								</li>

								<!-- Última -->
								<li class="page-item" th:classappend="${clientes.last} ? 'disabled'">
									<a class="page-link"
									   th:href="@{/clientes(
                        page=${clientes.totalPages - 1},
                        filtroNome=${filtro.filtroNome},
                        filtroCpf=${filtro.filtroCpf},
                        filtroCnpj=${filtro.filtroCnpj},
                        filtroRazaoSocial=${filtro.filtroRazaoSocial},
                        filtroCidade=${filtro.filtroCidade},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Última página">
										<i class="fa-duotone fa-solid fa-angles-right"></i>
									</a>
								</li>

							</ul>
						</nav>

					</div>

				</div>
			</div>

		</div>

	</div>

</div>


</body>
</html>
