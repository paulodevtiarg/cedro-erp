<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Clientes</title>
</head>

<body>
<div layout:fragment="content">
	<div class="container-fluid p-2">
		<div class="row">
			<div class="col-12">
				<nav aria-label="breadcrumb card"
				     style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item"><a th:href="@{/home}"> <i
								class="fa-duotone fa-solid fa-house fs-7"></i> Home
						</a></li>
						<li class="breadcrumb-item"><span class="text-muted">
									<i class="fa-duotone fa-solid fa-rectangle-history-circle-user"></i> Clientes - Lista
							</span></li>
					</ol>
				</nav>
			</div>
			<!--Chmando botoes de msg -->
			<div th:replace="~{fragments/botoesBusca :: msgs}"></div>


			<div class="col-12" style="margin-top: -15px;">
				<div class="card">
					<div class="card-header d-flex justify-content-between align-items-center fs-6 fw-semibold text-uppercase">

						<h6 class="mb-0 text-secondary">Clientes</h6>

						<a	th:if="${podeGerenciarCadastros and queryParams != null and queryParams != ''}"
						      th:href="@{'/clientes/novo?' + ${queryParams}}"
						      class="btn btn-outline-sistema btn-sm"
						      th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
						      data-bs-toggle="tooltip"
						      th:title="${podeGerenciarCadastros} ? 'Novo Registro' : 'Sem Permissão para incluir novo Registro'">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
						<a
								th:if="${podeGerenciarCadastros and (queryParams == null or queryParams == '')}"
								th:href="@{/clientes/novo}" class="btn btn-outline-sistema btn-sm"
								th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
								data-bs-toggle="tooltip" th:title="${podeGerenciarCadastros} ? 'Novo
								Registro' : 'Sem Permissão para incluir novo Registro'"> <i
								class="fa-duotone fa-plus"></i> Novo
						</a> <a th:if="${!podeGerenciarCadastros}" href="#"
						        class="btn btn-outline-sistema disabled"> <i
							class="fa-duotone fa-plus"></i> Novo
					</a>

					</div>
					<div class="card-body">
						<div class="row">
							<div class="col-12">
								<form th:action="@{/clientes}" method="get" class="mb-1">
									<input type="hidden" name="idEmpresa" th:value="${idEmpresa}">
									<div class="row g-1">
										<div class="col-md-4 input-group-sm">
											<label for="filtroNome" class="form-label text-secondary fw-semibold">Nome</label>
											<input type="text" name="filtroNome" id="filtroNome" th:value="${filtro.filtroNome}"
											       class="form-control" placeholder="Digite para buscar">
										</div>
										<div class="col-md-4 input-group-sm">
											<label for="filtroNome" class="form-label text-secondary fw-semibold">Razão Social</label>
											<input type="text" name="filtroRazaoSocial" id="filtroRazaoSocial" th:value="${filtro.filtroRazaoSocial}"
											       class="form-control" placeholder="Digite para buscar">
										</div>
										<div class="col-md-2 input-group-sm">
											<label for="filtroCpf" class="form-label text-secondary fw-semibold">CPF</label>
											<input type="text" name="filtroCpf" id="filtroCpf" oninput="mascaraCPF(this)" th:value="${filtro.filtroCpf}"
											       class="form-control" placeholder="000.000.000-00"><div class="invalid-feedback">CPF inválido</div>
										</div>
										<div class="col-md-2 input-group-sm">
											<label for="filtroCpf" class="form-label text-secondary fw-semibold">CNPJ</label>
											<input type="text" name="filtroCnpj" id="filtroCnpj" oninput="mascaraCNPJ(this)" th:value="${filtro.filtroCnpj}"
											       class="form-control"   placeholder="00.000.000/0000-00"
											       maxlength="18"><div class="invalid-feedback">Cnpj inválido</div>
										</div>



									</div>
									<div class="row g-1 mt-1 mb-1">
											<div class="col-md-3 input-group-sm">
												<label for="filtroNome" class="form-label text-secondary fw-semibold">Cidade</label>
												<input type="text" name="filtroCidade" id="filtroCidade" th:value="${filtro.filtroCidade}"
												       class="form-control" placeholder="Digite para buscar">
											</div>
										<div th:replace="~{fragments/botoesBusca :: filtroStatus(${filtro})}"></div>
										<div th:replace="~{fragments/botoesBusca :: filtroLinhas(${filtro})}"></div>
											<div class="col-md-7 d-flex justify-content-end align-items-end  gap-1 input-group-sm">
												<div th:replace="fragments/botoesBusca :: btnLimpar(@{/clientes}, 'Limpar Filtros')"></div>
												<div th:replace="fragments/botoesBusca :: btnBuscar('Aplicar Filtros')"></div>
											</div>
									</div>

								</form>
							</div>
							<div class="col-12 mt-2">
								<div class="table-responsive d-none d-md-block">
									<table class="table table-striped table-bordered align-middle table-hover table-sm">
										<thead class="table-dark"	style="--bs-table-bg: #0c4a31; --bs-table-border-color: #4e9f73;">
										<tr>
											<th style="width: 20%;" >Nome</th>
											<th>Razão Social</th>
											<th>Cidade</th>
											<th>Telefone</th>
											<th>Celular</th>
											<th class="text-center" style="width: 120px;">Status</th>
											<th class="text-center" style="width: 140px;">Ações</th>
										</tr>
										</thead>
										<tbody>
										<tr th:each="cliente : ${clientes}">
											<td class="align-middle" th:text="${cliente.nome}">	</td>
											<td class="align-middle"
											    th:text="${cliente.razaoSocial != null and !#strings.isEmpty(cliente.razaoSocial)
												? cliente.razaoSocial
												: 'NÃO INFORMADO'}">
											</td>
											<td class="align-middle" th:text="${cliente.cidade}">	</td>
											<td class="align-middle" th:text="${cliente.telefone}">	</td>
											<td class="align-middle" th:text="${cliente.celular}">	</td>
											<td  class="text-center align-middle">
												<form   th:if="${podeGerenciarCadastros}"
												        th:action="@{'/clientes/alterar-status/'+ ${cliente.id}+ '?'+ ${queryParams}}"
												        method="post"
												        class="d-inline">

													<button type="submit"
													        class="btn btn-link p-0 border-0 text-decoration-none"
													        data-bs-toggle="tooltip"
													        th:title="${cliente.status ? 'Inativar' : 'Ativar'}">

														<i th:if="${cliente.status}"
														   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
														</i>

														<i th:unless="${cliente.status}"
														   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
														</i>

													</button>

												</form>

												<!-- Se não tiver permissão, mostra apenas o status -->
												<span th:unless="${podeGerenciarCadastros}"
												      th:classappend="${cliente.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
															<i th:class="${cliente.status}
																	? 'fa-duotone fa-solid fa-circle-check'
																	: 'fa-duotone fa-solid fa-circle-xmark'">
															</i>

   													</span>

											</td>
											<td  class="text-center text-nowrap align-middle">
												<a	th:href="@{'/clientes/detalhes/' + ${cliente.id} + '?'+ ${queryParams}}"
												      class="btn btn-outline-sistema btn-sm px-2"
												      data-bs-toggle="tooltip" title="Detalhes"> <i
														class="fa-duotone fa-eye"></i>
												</a>

												<a th:href="${podeGerenciarCadastros}? @{'/clientes/editar/' + ${cliente.id} + '?' + ${queryParams}} : '#'"
												   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
												   class="btn btn-outline-sistema btn-sm px-2"
												   data-bs-toggle="tooltip"
												   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
													<i class="fa-duotone fa-pen-to-square"></i>
												</a>
												<a th:href="${podeGerenciarCadastros}? @{'/clientes/detalhes/'+ ${cliente.id}+ '?acao=excluir&'
                                                       + ${queryParams}}: '#'" th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
												   class="btn btn-outline-sistema btn-sm px-2"
												   data-bs-toggle="tooltip"
												   title="Excluir">
													<i class="fa-duotone fa-trash"></i>
												</a>


											</td>

										</tr>
										</tbody>
									</table>
								</div>
								<!--reponsividade -->
								<div class="d-block d-md-none">
									<div th:each="cliente : ${clientes}" class="card mb-3 shadow-sm">
										<div class="card-body">
											<!--TOPO -->
											<div class="d-flex align-items-center mb-2">
												<div class="ms-3 flex-grow-1">
													<div class="fw-bold" th:text="${cliente.nome}"></div>
													<small class="text-muted" th:text="${cliente.cidade}"></small>
												</div>
												<div>
													<form  th:if="${podeGerenciarCadastros}"
													       th:action="@{'/clientes/alterar-status/'+ ${cliente.id}+ '?'+ ${queryParams}}"
													       method="post"
													       class="d-inline">

														<button type="submit"
														        class="btn btn-link p-0 border-0 text-decoration-none"
														        data-bs-toggle="tooltip"
														        th:title="${cliente.status ? 'Inativar' : 'Ativar'}">

															<i th:if="${cliente.status}"
															   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
															</i>

															<i th:unless="${cliente.status}"
															   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
															</i>

														</button>

													</form>


													<!-- Se não tiver permissão, mostra apenas o status -->
													<span th:unless="${podeGerenciarCadastros}"
													      th:classappend="${cliente.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">

															<i th:class="${cliente.status}
																	? 'fa-duotone fa-solid fa-circle-check'
																	: 'fa-duotone fa-solid fa-circle-xmark'">
															</i>

   															 </span>
												</div>

											</div>
											<div class="small text-muted mb-2">
												<div>
													<i class="fa-duotone fa-solid fa-address-card me-1"></i>
													<span th:text="${cliente.tipoPessoa}"></span>
												</div>
												<div>
													<i class="fa-duotone fa-solid fa-envelope me-1"></i>
													<span th:text="${cliente.telefone}"></span>

												</div>
												<div>
													<i class="fa-duotone fa-solid fa-circle-phone me-1"></i>
													<span th:text="${cliente.celular}"></span>

												</div>
											</div>
											<div class="d-flex justify-content-end gap-2">
												<a	th:href="@{'/clientes/detalhes/' + ${cliente.id} + '?'+ ${queryParams}}"
												      class="btn btn-outline-sistema btn-sm px-2"
												      data-bs-toggle="tooltip" title="Detalhes"> <i
														class="fa-duotone fa-eye"></i>
												</a>
												<a th:href="${podeGerenciarCadastros}? @{'/clientes/editar/' + ${cliente.id} + '?' + ${queryParams}} : '#'"
												   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
												   class="btn btn-outline-sistema btn-sm px-2"
												   data-bs-toggle="tooltip"
												   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
													<i class="fa-duotone fa-pen-to-square"></i>
												</a>

												<a th:href="${podeGerenciarCadastros}? @{'/clientes/detalhes/'+ ${cliente.id}+ '?acao=excluir&'
                                                       + ${queryParams}}: '#'" th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
												   class="btn btn-outline-sistema btn-sm px-2"
												   data-bs-toggle="tooltip"
												   title="Excluir">
													<i class="fa-duotone fa-trash"></i>
												</a>

											</div>
										</div>

									</div>

								</div><!-- fim do bloco que so aparece quando em telas pequenas -->

							</div>
						</div>

					</div>
					<div class="card-footer d-flex justify-content-end">

						<nav aria-label="Paginação">
							<ul class="pagination mb-0">

								<!-- Anterior -->
								<li class="page-item" th:classappend="${clientes.first} ? 'disabled'">
									<a	class="page-link fs-7" th:href="@{/clientes(page=${clientes.number - 1},
										filtroNome=${filtro.filtroNome},
										filtroCpf=${filtro.filtroCpf},
										filtroCnpj=${filtro.filtroCnpj},
										filtroRazaoSocial=${filtro.filtroRazaoSocial},
										filtroCidade=${filtro.filtroCidade},
										filtroStatus=${filtro.filtroStatus},
										size=${filtro.size})}">
										Anterior </a></li>

								<!-- Números -->
								<li
										th:each="i : ${#numbers.sequence(0, clientes.totalPages-1)}"
										class="page-item"
										th:classappend="${i == clientes.number} ? 'active'"><a
										class="page-link fs-7"
										th:href="@{/clientes(page=${i},
										filtroNome=${filtro.filtroNome},
										filtroCpf=${filtro.filtroCpf},
										filtroCnpj=${filtro.filtroCnpj},
										filtroRazaoSocial=${filtro.filtroRazaoSocial},
										filtroCidade=${filtro.filtroCidade},
										filtroStatus=${filtro.filtroStatus},
										size=${filtro.size})}"
										th:text="${i + 1}"> </a></li>

								<!-- Próxima -->
								<li class="page-item"
								    th:classappend="${clientes.last} ? 'disabled'"><a
										class="page-link fs-7"
										th:href="@{/clientes(page=${clientes.number + 1},
										filtroNome=${filtro.filtroNome},
										filtroCpf=${filtro.filtroCpf},
										filtroCnpj=${filtro.filtroCnpj},
										filtroRazaoSocial=${filtro.filtroRazaoSocial},
										filtroCidade=${filtro.filtroCidade},
										filtroStatus=${filtro.filtroStatus},
										size=${filtro.size})}">
									Próxima </a></li>

							</ul>
						</nav>

					</div>

				</div>
			</div>

		</div>

	</div>

</div>


</body>
</html>
