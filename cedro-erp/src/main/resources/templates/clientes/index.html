<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Clientes</title>
</head>

<body>
<div layout:fragment="content">
	<div class="container-fluid p-2">
		<div class="row">

			<!-- BREADCRUMB -->
			<div class="col-12">
				<nav aria-label="breadcrumb card" style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a th:href="@{/home}">
								<i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a>
						</li>
						<li class="breadcrumb-item">
                      <span class="text-muted">
                         <i class="fa-duotone fa-solid fa-rectangle-history-circle-user"></i> Clientes - Lista
                      </span>
						</li>
					</ol>
				</nav>
			</div>

			<!-- MENSAGENS DE ALERTA -->
			<div th:replace="~{fragments/botoesBusca :: msgs}"></div>

			<!-- CARD PRINCIPAL DE CONTEÚDO -->
			<div class="col-12" style="margin-top: -15px;">
				<div class="card border-0 shadow-sm rounded-3">

					<!-- CABEÇALHO DO CARD (Cores originais mantidas) -->
					<div class="card-header d-flex justify-content-between align-items-center fs-6 fw-semibold text-uppercase">
						<h6 class="mb-0 text-secondary">Clientes</h6>

						<a th:if="${podeGerenciarCadastros and queryParams != null and queryParams != ''}"
						   th:href="@{'/clientes/novo?' + ${queryParams}}"
						   class="btn btn-outline-sistema btn-sm"
						   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
						   data-bs-toggle="tooltip"
						   th:title="${podeGerenciarCadastros} ? 'Novo Registro' : 'Sem Permissão para incluir novo Registro'">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
						<a th:if="${podeGerenciarCadastros and (queryParams == null or queryParams == '')}"
						   th:href="@{/clientes/novo}" class="btn btn-outline-sistema btn-sm"
						   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
						   data-bs-toggle="tooltip"
						   th:title="${podeGerenciarCadastros} ? 'Novo Registro' : 'Sem Permissão para incluir novo Registro'">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
						<a th:if="${!podeGerenciarCadastros}" href="#" class="btn btn-outline-sistema disabled">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
					</div>

					<!-- CORPO DO CARD (FILTROS + TABELA) -->
					<div class="card-body p-0">

						<!-- ÁREA DOS FILTROS -->
						<div class="p-3 border-bottom">
							<form th:action="@{/clientes}" method="get" class="mb-0">
								<input type="hidden" name="idEmpresa" th:value="${idEmpresa}">
								<div class="row g-2">
									<div class="col-md-4 input-group-sm">
										<label for="filtroNome" class="form-label text-secondary fw-semibold mb-1">Nome</label>
										<input type="text" name="filtroNome" id="filtroNome" th:value="${filtro.filtroNome}"
										       class="form-control" placeholder="Digite para buscar">
									</div>
									<div class="col-md-4 input-group-sm">
										<label for="filtroRazaoSocial" class="form-label text-secondary fw-semibold mb-1">Razão Social</label>
										<input type="text" name="filtroRazaoSocial" id="filtroRazaoSocial" th:value="${filtro.filtroRazaoSocial}"
										       class="form-control" placeholder="Digite para buscar">
									</div>
									<div class="col-md-2 input-group-sm">
										<label for="filtroCpf" class="form-label text-secondary fw-semibold mb-1">CPF</label>
										<input type="text" name="filtroCpf" id="filtroCpf" oninput="mascaraCPF(this)" th:value="${filtro.filtroCpf}"
										       class="form-control" placeholder="000.000.000-00">
										<div class="invalid-feedback">CPF inválido</div>
									</div>
									<div class="col-md-2 input-group-sm">
										<label for="filtroCnpj" class="form-label text-secondary fw-semibold mb-1">CNPJ</label>
										<input type="text" name="filtroCnpj" id="filtroCnpj" oninput="mascaraCNPJ(this)" th:value="${filtro.filtroCnpj}"
										       class="form-control" placeholder="00.000.000/0000-00" maxlength="18">
										<div class="invalid-feedback">Cnpj inválido</div>
									</div>
								</div>

								<div class="row g-2 mt-1">
									<div class="col-md-3 input-group-sm">
										<label for="filtroCidade" class="form-label text-secondary fw-semibold mb-1">Cidade</label>
										<input type="text" name="filtroCidade" id="filtroCidade" th:value="${filtro.filtroCidade}"
										       class="form-control" placeholder="Digite para buscar">
									</div>

									<div th:replace="~{fragments/botoesBusca :: filtroStatus(${filtro})}"></div>
									<div th:replace="~{fragments/botoesBusca :: filtroLinhas(${filtro})}"></div>

									<div class="col-md-7 d-flex justify-content-end align-items-end gap-1 input-group-sm">
										<div th:replace="fragments/botoesBusca :: btnLimpar(@{/clientes}, 'Limpar Filtros')"></div>
										<div th:replace="fragments/botoesBusca :: btnBuscar('Aplicar Filtros')"></div>
									</div>
								</div>
							</form>
						</div>

						<!-- TABELA DESKTOP (d-none d-md-block) -->
						<div class="table-responsive d-none d-md-block" style="overflow: hidden;">
							<table class="table table-hover align-middle m-0" style="table-layout: fixed;">
								<thead class="bg-light border-bottom">
								<tr class="text-secondary small text-uppercase" style="height: 42px; letter-spacing: 0.5px;">
									<th scope="col" class="ps-3 fw-semibold" style="width: 22%;">Nome</th>
									<th scope="col" class="fw-semibold" style="width: 22%;">Razão Social</th>
									<th scope="col" class="fw-semibold" style="width: 16%;">Cidade</th>
									<th scope="col" class="fw-semibold" style="width: 14%;">Telefone</th>
									<th scope="col" class="fw-semibold" style="width: 14%;">Celular</th>
									<th scope="col" class="text-center fw-semibold" style="width: 100px;">Status</th>
									<th scope="col" class="text-end pe-4 fw-semibold" style="width: 140px;">Ações</th>
								</tr>
								</thead>
								<tbody class="border-top-0">
								<tr th:each="cliente : ${clientes}">
									<td class="ps-3 fw-semibold text-dark" th:text="${cliente.nome}"></td>
									<td class="text-secondary small"
									    th:text="${cliente.razaoSocial != null and !#strings.isEmpty(cliente.razaoSocial)
                                  ? cliente.razaoSocial
                                  : 'NÃO INFORMADO'}">
									</td>
									<td class="text-secondary small" th:text="${cliente.cidade}"></td>
									<td class="text-secondary small" th:text="${cliente.telefone}"></td>
									<td class="text-secondary small" th:text="${cliente.celular}"></td>

									<!-- Status -->
									<td class="text-center align-middle">
										<form th:if="${podeGerenciarCadastros}"
										      th:action="@{'/clientes/alterar-status/'+ ${cliente.id}+ '?'+ ${queryParams}}"
										      method="post"
										      class="d-inline">

											<button type="submit"
											        class="btn btn-link p-0 border-0 text-decoration-none"
											        data-bs-toggle="tooltip"
											        th:title="${cliente.status ? 'Inativar' : 'Ativar'}">

												<i th:if="${cliente.status}"
												   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
												</i>

												<i th:unless="${cliente.status}"
												   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
												</i>
											</button>
										</form>

										<!-- Status sem permissão -->
										<span th:unless="${podeGerenciarCadastros}"
										      th:classappend="${cliente.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
                                     <i th:class="${cliente.status}
                                           ? 'fa-duotone fa-solid fa-circle-check'
                                           : 'fa-duotone fa-solid fa-circle-xmark'">
                                     </i>
                                  </span>
									</td>

									<!-- Ações (Desacopladas por gap-1) -->
									<td class="text-end pe-4">
										<div class="d-inline-flex gap-1 align-items-center">
											<a th:href="@{'/clientes/detalhes/' + ${cliente.id} + '?'+ ${queryParams}}"
											   class="btn btn-outline-sistema btn-sm px-2"
											   data-bs-toggle="tooltip" title="Detalhes">
												<i class="fa-duotone fa-eye"></i>
											</a>

											<a th:href="${podeGerenciarCadastros}? @{'/clientes/editar/' + ${cliente.id} + '?' + ${queryParams}} : '#'"
											   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
											   class="btn btn-outline-sistema btn-sm px-2"
											   data-bs-toggle="tooltip"
											   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
												<i class="fa-duotone fa-pen-to-square"></i>
											</a>

											<a th:href="${podeGerenciarCadastros}? @{'/clientes/detalhes/'+ ${cliente.id}+ '?acao=excluir&' + ${queryParams}}: '#'"
											   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
											   class="btn btn-outline-sistema btn-sm px-2"
											   data-bs-toggle="tooltip"
											   title="Excluir">
												<i class="fa-duotone fa-trash"></i>
											</a>
										</div>
									</td>
								</tr>
								</tbody>
							</table>
						</div>

						<!-- CARDS MOBILE (d-block d-md-none) -->
						<div class="d-block d-md-none p-3">
							<div th:each="cliente : ${clientes}" class="card border mb-3 rounded-3 shadow-sm">
								<div class="card-body">
									<!-- Topo Mobile -->
									<div class="d-flex align-items-center mb-3">
										<div class="flex-grow-1">
											<div class="fw-bold text-dark" th:text="${cliente.nome}"></div>
											<small class="text-muted" th:text="${cliente.cidade}"></small>
										</div>
										<div>
											<form th:if="${podeGerenciarCadastros}"
											      th:action="@{'/clientes/alterar-status/'+ ${cliente.id}+ '?'+ ${queryParams}}"
											      method="post"
											      class="d-inline">

												<button type="submit"
												        class="btn btn-link p-0 border-0 text-decoration-none"
												        data-bs-toggle="tooltip"
												        th:title="${cliente.status ? 'Inativar' : 'Ativar'}">

													<i th:if="${cliente.status}"
													   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
													</i>

													<i th:unless="${cliente.status}"
													   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
													</i>
												</button>
											</form>

											<span th:unless="${podeGerenciarCadastros}"
											      th:classappend="${cliente.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
                                     <i th:class="${cliente.status}
                                           ? 'fa-duotone fa-solid fa-circle-check'
                                           : 'fa-duotone fa-solid fa-circle-xmark'">
                                     </i>
                                  </span>
										</div>
									</div>

									<!-- Detalhes Mobile -->
									<div class="small text-muted mb-3 bg-light p-2 rounded-2">
										<div class="mb-1">
											<i class="fa-duotone fa-solid fa-address-card me-1"></i>
											<span th:text="${cliente.tipoPessoa}"></span>
										</div>
										<div class="mb-1">
											<i class="fa-duotone fa-solid fa-phone me-1"></i>
											<span th:text="${cliente.telefone}"></span>
										</div>
										<div>
											<i class="fa-duotone fa-solid fa-mobile me-1"></i>
											<span th:text="${cliente.celular}"></span>
										</div>
									</div>

									<!-- Ações Mobile -->
									<div class="d-flex justify-content-end gap-1">
										<a th:href="@{'/clientes/detalhes/' + ${cliente.id} + '?'+ ${queryParams}}"
										   class="btn btn-outline-sistema btn-sm px-2"
										   data-bs-toggle="tooltip" title="Detalhes">
											<i class="fa-duotone fa-eye"></i>
										</a>

										<a th:href="${podeGerenciarCadastros}? @{'/clientes/editar/' + ${cliente.id} + '?' + ${queryParams}} : '#'"
										   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
										   class="btn btn-outline-sistema btn-sm px-2"
										   data-bs-toggle="tooltip"
										   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
											<i class="fa-duotone fa-pen-to-square"></i>
										</a>

										<a th:href="${podeGerenciarCadastros}? @{'/clientes/detalhes/'+ ${cliente.id}+ '?acao=excluir&' + ${queryParams}}: '#'"
										   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
										   class="btn btn-outline-sistema btn-sm px-2"
										   data-bs-toggle="tooltip"
										   title="Excluir">
											<i class="fa-duotone fa-trash"></i>
										</a>
									</div>
								</div>
							</div>
						</div>

					</div>

					<!-- RODAPÉ DE PAGINAÇÃO (Cores originais mantidas) -->
					<div class="card-footer d-flex justify-content-between align-items-center py-3">
                   <span class="text-secondary small">
                      Mostrando página <strong th:text="${clientes.number + 1}">1</strong> de <strong th:text="${clientes.totalPages}">1</strong>
                   </span>

						<nav aria-label="Paginação">
							<ul class="pagination pagination-sm mb-0 gap-1">

								<!-- Anterior -->
								<li class="page-item" th:classappend="${clientes.first} ? 'disabled'">
									<a class="page-link border-0 rounded-2 text-dark fs-7" th:href="@{/clientes(page=${clientes.number - 1},
                               filtroNome=${filtro.filtroNome},
                               filtroCpf=${filtro.filtroCpf},
                               filtroCnpj=${filtro.filtroCnpj},
                               filtroRazaoSocial=${filtro.filtroRazaoSocial},
                               filtroCidade=${filtro.filtroCidade},
                               filtroStatus=${filtro.filtroStatus},
                               size=${filtro.size})}">
										Anterior
									</a>
								</li>

								<!-- Números -->
								<li th:each="i : ${#numbers.sequence(0, clientes.totalPages-1)}"
								    class="page-item"
								    th:classappend="${i == clientes.number} ? 'active'">
									<a class="page-link border-0 rounded-2 fs-7"
									   th:style="${i == clientes.number} ? 'background-color: #0c4a31; color: #fff; font-weight: bold;' : 'color: #212529;'"
									   th:href="@{/clientes(page=${i},
                               filtroNome=${filtro.filtroNome},
                               filtroCpf=${filtro.filtroCpf},
                               filtroCnpj=${filtro.filtroCnpj},
                               filtroRazaoSocial=${filtro.filtroRazaoSocial},
                               filtroCidade=${filtro.filtroCidade},
                               filtroStatus=${filtro.filtroStatus},
                               size=${filtro.size})}"
									   th:text="${i + 1}">
									</a>
								</li>

								<!-- Próxima -->
								<li class="page-item" th:classappend="${clientes.last} ? 'disabled'">
									<a class="page-link border-0 rounded-2 text-dark fs-7" th:href="@{/clientes(page=${clientes.number + 1},
                               filtroNome=${filtro.filtroNome},
                               filtroCpf=${filtro.filtroCpf},
                               filtroCnpj=${filtro.filtroCnpj},
                               filtroRazaoSocial=${filtro.filtroRazaoSocial},
                               filtroCidade=${filtro.filtroCidade},
                               filtroStatus=${filtro.filtroStatus},
                               size=${filtro.size})}">
										Próxima
									</a>
								</li>

							</ul>
						</nav>
					</div>

				</div>
			</div>

		</div>
	</div>
</div>
</body>
</html>
