<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Departamentos</title>
</head>

<body>
<div layout:fragment="content">

	<div class="container-fluid p-2">
		<div class="row">

			<!-- BREADCRUMB -->
			<div class="col-12">
				<nav aria-label="breadcrumb" style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a class="text-decoration-none" th:href="@{/home}">
								<i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a>
						</li>
						<li class="breadcrumb-item">
                            <span class="text-muted">
                                <i class="fa-duotone fa-solid fa-sitemap"></i> Departamentos - Lista
                            </span>
						</li>
					</ol>
				</nav>
			</div>

			<div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>

			<div class="col-12">
				<div class="card">

					<!-- HEADER (Fragmento padrão) -->
					<div th:replace="~{fragments/componentes :: cardHeader(
                        'Departamentos',
                        'Gerencie os registros de Departamentos',
                        'sitemap',
                        '/departamentos/novo',
                        'Departamento',
                        ${queryParams}
                    )}"></div>

					<div class="card-body">
						<div class="row">
							<div class="col-12">

								<!-- FILTROS -->
								<!-- FILTROS -->
								<form th:action="@{/departamentos}" method="get" class="filter-box mb-2">
									<input type="hidden" name="idEmpresa" th:value="${idEmpresa}">
									<div class="row g-3">

										<!-- Nome -->
										<div class="col-md-4">
											<label for="filtroNome" class="form-label small fw-semibold text-secondary">Nome do Departamento</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-sitemap"></i></span>
												<input type="text" name="filtroNome" id="filtroNome" th:value="${filtro.filtroNome}"
												       class="form-control" placeholder="Digite para buscar">
											</div>
										</div>

										<!-- Fragmentos corretos (apontando para 'componentes') -->
										<div th:replace="~{fragments/componentes :: filtroStatus(${filtro}, 'col-md-2')}"></div>
										<div th:replace="~{fragments/componentes :: filtroLinhas(${filtro}, 'col-md-2')}"></div>

										<div th:replace="~{fragments/componentes :: botoesFiltro('/departamentos', 'col-md-4')}"></div>

									</div>
								</form>

							</div>

							<div class="col-12">

								<!-- TABELA DESKTOP -->
								<div class="d-none d-md-block">
									<table class="table table-modern align-middle mb-0">
										<thead>
										<tr>
											<th class="text-center" style="width: 80px;">Cód.</th>
											<th style="width: 30%;">Nome Depto.</th>
											<th>Descrição</th>
											<th class="text-center" style="width: 100px;">Status</th>
											<th class="text-center" style="width: 140px;">Ações</th>
										</tr>
										</thead>
										<tbody>

										<tr th:if="${departamentos.empty}">
											<td colspan="5">
												<div th:replace="~{fragments/componentes :: emptyState('Nenhum departamento encontrado com os filtros atuais.')}"></div>
											</td>
										</tr>

										<tr th:each="departamento : ${departamentos}">
											<td class="text-center text-muted fw-semibold" th:text="${departamento.id}"></td>

											<td>
												<div class="fw-semibold text-dark" th:text="${departamento.nome}"></div>
											</td>

											<td class="text-muted small" th:text="${departamento.descricao}"></td>

											<!-- Status (Clicável) -->
											<td class="text-center align-middle">
												<form th:if="${podeGerenciarCadastros}"
												      th:action="@{'/departamentos/alterar-status/' + ${departamento.id} + '?' + ${queryParams}}"
												      method="post" class="d-inline">
													<button type="submit" class="btn btn-link p-0 border-0 text-decoration-none"
													        data-bs-toggle="tooltip" th:title="${departamento.status ? 'Inativar' : 'Ativar'}">
														<i th:if="${departamento.status}" class="fa-duotone fa-solid fa-circle-check text-success fs-5"></i>
														<i th:unless="${departamento.status}" class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5"></i>
													</button>
												</form>

												<span th:unless="${podeGerenciarCadastros}"
												      th:classappend="${departamento.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
                                                    <i th:class="${departamento.status} ? 'fa-duotone fa-solid fa-circle-check' : 'fa-duotone fa-solid fa-circle-xmark'"></i>
                                                </span>
											</td>

											<!-- Ações -->
											<td class="text-center text-nowrap">
												<div class="d-inline-flex gap-1 align-items-center">
													<a th:href="@{'/departamentos/detalhes/' + ${departamento.id} + '?' + ${queryParams}}"
													   class="btn-icon btn-icon-info" data-bs-toggle="tooltip" title="Detalhes">
														<i class="fa-duotone fa-solid fa-eye"></i>
													</a>

													<a th:href="${podeGerenciarCadastros}? @{'/departamentos/editar/' + ${departamento.id} + '?' + ${queryParams}} : '#'"
													   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
													   class="btn-icon btn-icon-warning" data-bs-toggle="tooltip"
													   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
														<i class="fa-duotone fa-solid fa-pen-to-square"></i>
													</a>

													<a th:href="${podeGerenciarCadastros}? @{'/departamentos/detalhes/'+ ${departamento.id}+ '?acao=excluir&' + ${queryParams}} : '#'"
													   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
													   class="btn-icon btn-icon-danger" data-bs-toggle="tooltip" title="Excluir">
														<i class="fa-duotone fa-solid fa-trash"></i>
													</a>
												</div>
											</td>
										</tr>
										</tbody>
									</table>
								</div>

								<!-- CARDS MOBILE -->
								<div class="d-md-none">

									<div th:if="${departamentos.empty}">
										<div th:replace="~{fragments/componentes :: emptyState('Nenhum departamento encontrado com os filtros atuais.')}"></div>
									</div>

									<div class="d-flex flex-column gap-2">
										<div th:each="departamento : ${departamentos}" class="card card-mobile-modern">
											<div class="card-body p-3">

												<!-- Cabeçalho: Nome + Status -->
												<div class="d-flex justify-content-between align-items-start gap-2 mb-2">
													<div class="min-w-0">
														<div class="fw-semibold text-dark text-truncate" th:text="${departamento.nome}"></div>
														<small class="text-muted d-block">ID: <span th:text="${departamento.id}"></span></small>
													</div>
													<div class="flex-shrink-0">
														<form th:if="${podeGerenciarCadastros}"
														      th:action="@{'/departamentos/alterar-status/' + ${departamento.id} + '?' + ${queryParams}}"
														      method="post" class="d-inline">
															<button type="submit" class="btn btn-link p-0 border-0 text-decoration-none"
															        data-bs-toggle="tooltip" th:title="${departamento.status ? 'Inativar' : 'Ativar'}">
																<i th:if="${departamento.status}" class="fa-duotone fa-solid fa-circle-check text-success fs-5"></i>
																<i th:unless="${departamento.status}" class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5"></i>
															</button>
														</form>
														<span th:unless="${podeGerenciarCadastros}"
														      th:classappend="${departamento.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
                                                            <i th:class="${departamento.status} ? 'fa-duotone fa-solid fa-circle-check' : 'fa-duotone fa-solid fa-circle-xmark'"></i>
                                                        </span>
													</div>
												</div>

												<!-- Descrição -->
												<div class="small text-muted mb-2 text-truncate" th:if="${departamento.descricao != null and !departamento.descricao.isEmpty()}">
													<i class="fa-duotone fa-solid fa-align-left me-1"></i>
													<span th:text="${departamento.descricao}"></span>
												</div>

												<hr class="pr-hr my-2"/>

												<!-- Ações Mobile -->
												<div class="d-flex justify-content-end gap-1">
													<a th:href="@{'/departamentos/detalhes/' + ${departamento.id} + '?' + ${queryParams}}"
													   class="btn-icon btn-icon-info" data-bs-toggle="tooltip" title="Detalhes">
														<i class="fa-duotone fa-solid fa-eye"></i>
													</a>

													<a th:href="${podeGerenciarCadastros}? @{'/departamentos/editar/' + ${departamento.id} + '?' + ${queryParams}} : '#'"
													   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
													   class="btn-icon btn-icon-warning" data-bs-toggle="tooltip"
													   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
														<i class="fa-duotone fa-solid fa-pen-to-square"></i>
													</a>

													<a th:href="${podeGerenciarCadastros}? @{'/departamentos/detalhes/'+ ${departamento.id}+ '?acao=excluir&' + ${queryParams}} : '#'"
													   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
													   class="btn-icon btn-icon-danger" data-bs-toggle="tooltip" title="Excluir">
														<i class="fa-duotone fa-solid fa-trash"></i>
													</a>
												</div>

											</div>
										</div>
									</div>
								</div>

							</div>
						</div>
					</div>

					<!-- FOOTER / PAGINAÇÃO -->
					<div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

						<small class="text-muted">
							Página <strong th:text="${departamentos.number + 1}"></strong>
							de <strong th:text="${departamentos.totalPages}"></strong>
							&bull;
							<span th:text="${departamentos.totalElements}"></span> registro(s)
						</small>

						<nav aria-label="Paginação">
							<ul class="pagination pagination-modern mb-0">

								<!-- Primeira -->
								<li class="page-item" th:classappend="${departamentos.first} ? 'disabled'">
									<a class="page-link" th:href="@{/departamentos(page=0, filtroNome=${filtro.filtroNome}, filtroStatus=${filtro.filtroStatus}, size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Primeira página">
										<i class="fa-duotone fa-solid fa-angles-left"></i>
									</a>
								</li>

								<!-- Anterior -->
								<li class="page-item" th:classappend="${departamentos.first} ? 'disabled'">
									<a class="page-link" th:href="@{/departamentos(page=${departamentos.number - 1}, filtroNome=${filtro.filtroNome}, filtroStatus=${filtro.filtroStatus}, size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Anterior">
										<i class="fa-duotone fa-solid fa-chevron-left"></i>
									</a>
								</li>

								<th:block th:if="${departamentos.totalPages > 0}">
									<!-- Números -->
									<li th:each="i : ${#numbers.sequence(0, departamentos.totalPages - 1)}"
									    class="page-item"
									    th:classappend="${i == departamentos.number} ? 'active'">
										<a class="page-link"
										   th:href="@{/departamentos(page=${i}, filtroNome=${filtro.filtroNome}, filtroStatus=${filtro.filtroStatus}, size=${filtro.size})}"
										   th:text="${i + 1}"></a>
									</li>
								</th:block>

								<!-- Próxima -->
								<li class="page-item" th:classappend="${departamentos.last} ? 'disabled'">
									<a class="page-link" th:href="@{/departamentos(page=${departamentos.number + 1}, filtroNome=${filtro.filtroNome}, filtroStatus=${filtro.filtroStatus}, size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Próxima">
										<i class="fa-duotone fa-solid fa-chevron-right"></i>
									</a>
								</li>

								<!-- Última -->
								<li class="page-item" th:classappend="${departamentos.last} ? 'disabled'">
									<a class="page-link" th:href="@{/departamentos(page=${departamentos.totalPages - 1}, filtroNome=${filtro.filtroNome}, filtroStatus=${filtro.filtroStatus}, size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Última página">
										<i class="fa-duotone fa-solid fa-angles-right"></i>
									</a>
								</li>

							</ul>
						</nav>
					</div>

				</div>
			</div>

		</div>
	</div>

</div>
</body>
</html>
