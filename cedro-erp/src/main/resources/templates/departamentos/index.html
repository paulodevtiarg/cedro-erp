<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Departamentos</title>
</head>

<body>
<div layout:fragment="content">

	<div class="container-fluid p-2">
		<div class="row">

			<!-- BREADCRUMB -->
			<div class="col-12">
				<nav aria-label="breadcrumb card" style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a th:href="@{/home}">
								<i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a>
						</li>
						<li class="breadcrumb-item">
                         <span class="text-muted">
                            <i class="fa-duotone fa-solid fa-sitemap"></i> Departamentos - Lista
                         </span>
						</li>
					</ol>
				</nav>
			</div>

			<!-- MENSAGENS DE ALERTA -->
			<div class="col-12">
				<!-- Sucesso -->
				<div th:if="${msgOk}"
				     class="alert alert-success alert-dismissible fade show auto-close mb-4"
				     role="alert" id="successAlert">
					<i class="fa-duotone fa-solid fa-thumbs-up me-2"></i>
					<span th:text="${msgOk}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>

				<!-- Erro -->
				<div th:if="${msgErro}"
				     class="alert alert-danger alert-dismissible fade show auto-close mb-4"
				     role="alert" id="errorAlert">
					<i class="fa-duotone fa-solid fa-triangle-exclamation me-2"></i>
					<span th:text="${msgErro}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>
			</div>

			<!-- CARD PRINCIPAL DE CONTEÚDO -->
			<div class="col-12" style="margin-top: -15px;">
				<div class="card border-0 shadow-sm rounded-3">

					<!-- CABEÇALHO DO CARD (Cores originais mantidas) -->
					<div class="card-header d-flex justify-content-between align-items-center fs-6 fw-semibold text-uppercase">
						<h6 class="mb-0 text-secondary">Departamentos</h6>

						<a th:if="${podeGerenciarCadastros and queryParams != null and queryParams != ''}"
						   th:href="@{'/departamentos/novo?' + ${queryParams}}"
						   class="btn btn-outline-sistema btn-sm"
						   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
						   data-bs-toggle="tooltip"
						   th:title="${podeGerenciarCadastros} ? 'Novo Registro' : 'Sem Permissão para incluir novo Registro'">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
						<a th:if="${podeGerenciarCadastros and (queryParams == null or queryParams == '')}"
						   th:href="@{/departamentos/novo}" class="btn btn-outline-sistema btn-sm"
						   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
						   data-bs-toggle="tooltip"
						   th:title="${podeGerenciarCadastros} ? 'Novo Registro' : 'Sem Permissão para incluir novo Registro'">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
						<a th:if="${!podeGerenciarCadastros}" href="#" class="btn btn-outline-sistema disabled">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
					</div>

					<!-- CORPO DO CARD (FILTROS + TABELA) -->
					<div class="card-body p-0">

						<!-- ÁREA DOS FILTROS -->
						<div class="p-3 border-bottom">
							<form th:action="@{/departamentos}" method="get" class="mb-0">
								<input type="hidden" name="idEmpresa" th:value="${idEmpresa}">
								<div class="row g-2">
									<div class="col-md-8 input-group-sm">
										<label for="filtroNome" class="form-label text-secondary fw-semibold mb-1">Nome do Departamento</label>
										<input type="text" name="filtroNome" id="filtroNome" th:value="${filtro.filtroNome}"
										       class="form-control" placeholder="Digite para buscar">
									</div>

									<div th:replace="~{fragments/botoesBusca :: filtroStatus(${filtro})}"></div>
									<div th:replace="~{fragments/botoesBusca :: filtroLinhas(${filtro})}"></div>

									<div class="col-md-2 d-flex justify-content-end align-items-end gap-1 input-group-sm">
										<div th:replace="fragments/botoesBusca :: btnLimpar(@{/departamentos}, 'Limpar Filtros')"></div>
										<div th:replace="fragments/botoesBusca :: btnBuscar('Aplicar Filtros')"></div>
									</div>
								</div>
							</form>
						</div>

						<!-- TABELA DESKTOP (d-none d-md-block) -->
						<div class="table-responsive d-none d-md-block" style="overflow: hidden;">
							<table class="table table-hover align-middle m-0" style="table-layout: fixed;">
								<thead class="bg-light border-bottom">
								<tr class="text-secondary small text-uppercase" style="height: 42px; letter-spacing: 0.5px;">
									<th scope="col" class="text-center ps-3 fw-semibold" style="width: 80px;">Cód.</th>
									<th scope="col" class="fw-semibold" style="width: 30%;">Nome Depto.</th>
									<th scope="col" class="fw-semibold">Descrição</th>
									<th scope="col" class="text-center fw-semibold" style="width: 100px;">Status</th>
									<th scope="col" class="text-end pe-4 fw-semibold" style="width: 140px;">Ações</th>
								</tr>
								</thead>
								<tbody class="border-top-0">
								<tr th:each="departamento : ${departamentos}">
									<td class="text-center ps-3 text-secondary small fw-semibold" th:text="${departamento.id}"></td>
									<td class="fw-semibold text-dark" th:text="${departamento.nome}"></td>
									<td class="text-secondary small" th:text="${departamento.descricao}"></td>

									<!-- Status -->
									<td class="text-center align-middle">
										<form th:if="${podeGerenciarCadastros}"
										      th:action="@{'/departamentos/alterar-status/'+ ${departamento.id}+ '?'+ ${queryParams}}"
										      method="post"
										      class="d-inline">

											<button type="submit"
											        class="btn btn-link p-0 border-0 text-decoration-none"
											        data-bs-toggle="tooltip"
											        th:title="${departamento.status ? 'Inativar' : 'Ativar'}">

												<i th:if="${departamento.status}"
												   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
												</i>

												<i th:unless="${departamento.status}"
												   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
												</i>
											</button>
										</form>

										<!-- Status sem permissão -->
										<span th:unless="${podeGerenciarCadastros}"
										      th:classappend="${departamento.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
                                        <i th:class="${departamento.status}
                                              ? 'fa-duotone fa-solid fa-circle-check'
                                              : 'fa-duotone fa-solid fa-circle-xmark'">
                                        </i>
                                     </span>
									</td>

									<!-- Ações (Desacopladas por gap-1) -->
									<td class="text-end pe-4">
										<div class="d-inline-flex gap-1 align-items-center">
											<a th:href="@{'/departamentos/detalhes/' + ${departamento.id} + '?'+ ${queryParams}}"
											   class="btn btn-outline-sistema btn-sm px-2"
											   data-bs-toggle="tooltip" title="Detalhes">
												<i class="fa-duotone fa-eye"></i>
											</a>

											<a th:href="${podeGerenciarCadastros}? @{'/departamentos/editar/' + ${departamento.id} + '?' + ${queryParams}} : '#'"
											   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
											   class="btn btn-outline-sistema btn-sm px-2"
											   data-bs-toggle="tooltip"
											   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
												<i class="fa-duotone fa-pen-to-square"></i>
											</a>

											<a th:href="${podeGerenciarCadastros}? @{'/departamentos/detalhes/'+ ${departamento.id}+ '?acao=excluir&' + ${queryParams}}: '#'"
											   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
											   class="btn btn-outline-sistema btn-sm px-2"
											   data-bs-toggle="tooltip"
											   title="Excluir">
												<i class="fa-duotone fa-trash"></i>
											</a>
										</div>
									</td>
								</tr>
								</tbody>
							</table>
						</div>

						<!-- CARDS MOBILE (d-block d-md-none) -->
						<div class="d-block d-md-none p-3">
							<div th:each="departamento : ${departamentos}" class="card border mb-3 rounded-3 shadow-sm">
								<div class="card-body">
									<!-- Topo Mobile -->
									<div class="d-flex align-items-center mb-3">
										<div class="flex-grow-1">
											<h5 class="mb-0 text-secondary fs-6">
												Detalhes: ID#: <span class="fw-bolder fs-6" th:text="'[ '+${departamento.id}+' ]'"></span>
											</h5>
											<span class="text-dark fw-bold fs-6" th:text="${departamento.nome}"></span><br/>
											<small class="text-muted" th:text="${departamento.descricao}"></small>
										</div>
										<div>
											<form th:if="${podeGerenciarCadastros}"
											      th:action="@{'/departamentos/alterar-status/'+ ${departamento.id}+ '?'+ ${queryParams}}"
											      method="post"
											      class="d-inline">

												<button type="submit"
												        class="btn btn-link p-0 border-0 text-decoration-none"
												        data-bs-toggle="tooltip"
												        th:title="${departamento.status ? 'Inativar' : 'Ativar'}">

													<i th:if="${departamento.status}"
													   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
													</i>

													<i th:unless="${departamento.status}"
													   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
													</i>
												</button>
											</form>

											<span th:unless="${podeGerenciarCadastros}"
											      th:classappend="${departamento.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
                                        <i th:class="${departamento.status}
                                              ? 'fa-duotone fa-solid fa-circle-check'
                                              : 'fa-duotone fa-solid fa-circle-xmark'">
                                        </i>
                                     </span>
										</div>
									</div>

									<!-- Ações Mobile -->
									<div class="d-flex justify-content-end gap-1">
										<a th:href="@{'/departamentos/detalhes/' + ${departamento.id} + '?'+ ${queryParams}}"
										   class="btn btn-outline-sistema btn-sm px-2"
										   data-bs-toggle="tooltip" title="Detalhes">
											<i class="fa-duotone fa-eye"></i>
										</a>

										<a th:href="${podeGerenciarCadastros}? @{'/departamentos/editar/' + ${departamento.id} + '?' + ${queryParams}} : '#'"
										   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
										   class="btn btn-outline-sistema btn-sm px-2"
										   data-bs-toggle="tooltip"
										   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
											<i class="fa-duotone fa-pen-to-square"></i>
										</a>

										<a th:href="${podeGerenciarCadastros}? @{'/departamentos/detalhes/'+ ${departamento.id}+ '?acao=excluir&' + ${queryParams}}: '#'"
										   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
										   class="btn btn-outline-sistema btn-sm px-2"
										   data-bs-toggle="tooltip"
										   title="Excluir">
											<i class="fa-duotone fa-trash"></i>
										</a>
									</div>
								</div>
							</div>
						</div>

					</div>

					<!-- RODAPÉ DE PAGINAÇÃO (Cores originais mantidas) -->
					<div class="card-footer d-flex justify-content-between align-items-center py-3">
                      <span class="text-secondary small">
                         Mostrando página <strong th:text="${departamentos.number + 1}">1</strong> de <strong th:text="${departamentos.totalPages}">1</strong>
                      </span>

						<nav aria-label="Paginação">
							<ul class="pagination pagination-sm mb-0 gap-1">

								<!-- Anterior -->
								<li class="page-item" th:classappend="${departamentos.first} ? 'disabled'">
									<a class="page-link border-0 rounded-2 text-dark fs-7" th:href="@{/departamentos(page=${departamentos.number - 1},
                                  filtroNome=${filtro.filtroNome},
                                  size=${filtro.size})}">
										Anterior
									</a>
								</li>

								<!-- Números -->
								<li th:each="i : ${#numbers.sequence(0, departamentos.totalPages-1)}"
								    class="page-item"
								    th:classappend="${i == departamentos.number} ? 'active'">
									<a class="page-link border-0 rounded-2 fs-7"
									   th:style="${i == departamentos.number} ? 'background-color: #0c4a31; color: #fff; font-weight: bold;' : 'color: #212529;'"
									   th:href="@{/departamentos(page=${i},
                                  filtroNome=${filtro.filtroNome},
                                  filtroStatus=${filtro.filtroStatus},
                                  size=${filtro.size})}"
									   th:text="${i + 1}">
									</a>
								</li>

								<!-- Próxima -->
								<li class="page-item" th:classappend="${departamentos.last} ? 'disabled'">
									<a class="page-link border-0 rounded-2 text-dark fs-7" th:href="@{/departamentos(page=${departamentos.number + 1},
                                  filtroNome=${filtro.filtroNome},
                                  filtroStatus=${filtro.filtroStatus},
                                  size=${filtro.size})}">
										Próxima
									</a>
								</li>

							</ul>
						</nav>
					</div>

				</div>
			</div>

		</div>
	</div>
</div>
</body>
</html>
