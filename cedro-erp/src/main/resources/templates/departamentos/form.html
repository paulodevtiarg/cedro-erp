<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Departamentos</title>
</head>

<body>
<div layout:fragment="content">

	<div class="container-fluid p-2">
		<div class="row">

			<!-- BREADCRUMB -->
			<div class="col-12">
				<nav aria-label="breadcrumb" style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a class="text-decoration-none" th:href="@{/home}">
								<i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a>
						</li>
						<li class="breadcrumb-item">
							<a class="text-decoration-none"
							   th:href="@{${queryParams != null and queryParams != ''} ? '/departamentos?' + queryParams : '/departamentos'}">
								<i class="fa-duotone fa-solid fa-sitemap"></i> Departamentos - Lista
							</a>
						</li>
						<li class="breadcrumb-item">
                            <span class="text-muted">
                                <i class="fa-duotone fa-solid fa-circle-plus"></i>
                                <span th:text="${departamento.id == null} ? 'Novo Registro' : 'Editar Registro'"></span>
                            </span>
						</li>
					</ol>
				</nav>
			</div>

			<!-- CARD DO FORMULÁRIO -->
			<div class="col-12">
				<form th:object="${departamento}"
				      th:action="${departamento.id == null} ? @{/departamentos/salvar} : @{'/departamentos/editar/' + ${departamento.id} + '?' + ${queryParams}}"
				      method="post">
					<input type="hidden" th:field="*{id}">

					<div class="card">

						<!-- HEADER MODERNO -->
						<div class="card-header card-header-modern d-flex justify-content-between align-items-center">

							<div class="d-flex align-items-center gap-2">
								<div class="header-icon">
									<i class="fa-duotone fa-solid fa-sitemap"></i>
								</div>
								<div>
									<h5 class="mb-0 fw-semibold">
										<span th:text="${departamento.id == null} ? 'Novo Departamento' : 'Editar Departamento'"></span>
										<span class="badge badge-soft-secondary ms-1"
										      th:if="${departamento.id != null}"
										      th:text="'#' + ${departamento.id}">#0</span>
									</h5>
									<small class="text-muted"
									       th:text="${departamento.id == null} ? 'Preencha os dados do novo departamento' : ${departamento.nome}"></small>
								</div>
							</div>

							<div class="d-flex gap-2">
								<a data-bs-toggle="tooltip" title="Cancelar Ação"
								   th:href="@{${queryParams != null and queryParams != ''} ? '/departamentos?' + queryParams : '/departamentos'}"
								   class="btn btn-light btn-modern btn-sm d-flex align-items-center gap-2">
									<i class="fa-duotone fa-solid fa-ban"></i> Cancelar
								</a>
								<button data-bs-toggle="tooltip" title="Salvar o Registro" type="submit"
								        class="btn btn-primary btn-modern btn-sm d-flex align-items-center gap-2">
									<i class="fa-duotone fa-solid fa-floppy-disk"></i> Salvar
								</button>
							</div>
						</div>

						<!-- BODY -->
						<div class="card-body">

							<!-- Seção -->
							<div class="detalhe-secao">
								<i class="fa-duotone fa-solid fa-circle-info me-1"></i> Informações do Departamento
							</div>

							<div class="row g-3 mt-1">

								<!-- Nome -->
								<div class="col-md-6">
									<label class="form-label fw-semibold text-secondary mb-0">Nome do Departamento *</label>
									<input type="text" th:field="*{nome}" id="nome"
									       placeholder="Ex: Recursos Humanos, Financeiro..." class="form-control"
									       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''">
									<div class="invalid-feedback d-block" style="min-height: 20px;"
									     th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
								</div>

								<!-- Descrição -->
								<div class="col-md-6">
									<label class="form-label fw-semibold text-secondary mb-0">Descrição</label>
									<input type="text" th:field="*{descricao}" id="descricao"
									       placeholder="Uma breve descrição sobre as funções deste setor" class="form-control">
								</div>

								<!-- Status (Switch Moderno) -->
								<div class="col-md-12 mt-4">
									<label class="form-label fw-semibold text-secondary mb-0 d-block">Status do Departamento</label>

									<div class="switches-row">
										<label class="switch-modern" for="statusAtivo">
											<input type="checkbox" role="switch" id="statusAtivo" th:field="*{status}">
											<i class="fa-duotone fa-solid fa-circle-check"></i> Departamento Ativo
										</label>
									</div>
									<small class="text-muted d-block mt-2">
										<i class="fa-duotone fa-solid fa-circle-info"></i>
										Departamentos inativos não aparecem nas listas de seleção de usuários.
									</small>
								</div>

							</div>
						</div>

						<!-- FOOTER -->
						<div class="card-footer card-footer-modern">
							<small class="text-muted d-flex align-items-center gap-1">
								<i class="fa-duotone fa-solid fa-circle-info"></i>
								Campos com <span class="text-danger fw-semibold">*</span> são obrigatórios.
							</small>
						</div>

					</div>
				</form>
			</div>

		</div>
	</div>

</div>
</body>
</html>
