<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/base}">

<head>
<title>Usuaários</title>
</head>

<body>
	<div layout:fragment="content">

		<div class="container-fluid p-2">
			<div class="row">
				<div class="col-12">
					<nav aria-label="breadcrumb card"
						style="margin-top: -25px; font-size: 0.8rem;">
						<ol class="breadcrumb">
							<li class="breadcrumb-item"><a th:href="@{/home}"> <i
									class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a></li>
							<li class="breadcrumb-item"><span class="text-muted">
									<i class="fa-duotone fa-solid fa-users"></i> Usuários - Lista
							</span></li>

						</ol>
					</nav>
				</div>
				<div class="col-12">
					<!-- Mensagens de erro e de ok -->
					<div th:if="${msgOk}"
						class="alert alert-success alert-dismissible fade show auto-close mb-4"
						role="alert" id="successAlert">
						<i class="fa-duotone fa-solid fa-thumbs-up me-2"></i> <span
							th:text="${msgOk}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>

					<!-- Mensagem de Erro -->
					<div th:if="${msgErro}"
						class="alert alert-danger alert-dismissible fade show auto-close mb-4"
						role="alert" id="errorAlert">
						<i class="fa-duotone fa-solid fa-triangle-exclamation me-2"></i> <span
							th:text="${msgErro}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>
				</div>
				<div class="col-12" style="margin-top: -15px;">
					<div class="card">
						<div class="card-header d-flex justify-content-between align-items-center fs-6 fw-semibold text-uppercase">

							<h6 class="mb-0 text-secondary">Usuários</h6>

							<a	th:if="${podeGerenciarCadastros and queryParams != null and queryParams != ''}"
								th:href="@{'/usuarios/novo?' + ${queryParams}}"
								class="btn btn-outline-sistema btn-sm"
								th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
								data-bs-toggle="tooltip"
								th:title="${podeGerenciarCadastros} ? 'Novo Registro' : 'Sem Permissão para incluir novo Registro'">
								<i class="fa-duotone fa-plus"></i> Novo
							</a>
							<a
								th:if="${podeGerenciarCadastros and (queryParams == null or queryParams == '')}"
								th:href="@{/usuarios/novo}" class="btn btn-outline-sistema btn-sm"
								th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
								data-bs-toggle="tooltip" th:title="${podeGerenciarCadastros} ? 'Novo
								Registro' : 'Sem Permissão para incluir novo Registro'"> <i
								class="fa-duotone fa-plus"></i> Novo
							</a> <a th:if="${!podeGerenciarCadastros}" href="#"
								class="btn btn-outline-sistema disabled"> <i
								class="fa-duotone fa-plus"></i> Novo
							</a>

						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-12">
									<form th:action="@{/usuarios}" method="get" class="mb-3">
										<input type="hidden" name="idEmpresa" th:value="${idEmpresa}">
										<div class="row g-1">
											<div class="col-md-6 input-group-sm">
												<label for="filtroNome" class="form-label text-secondary fw-semibold">Nome do Usuário</label>
												<input type="text" name="filtroNome" id="filtroNome" th:value="${filtro.filtroNome}"
													   class="form-control" placeholder="Digite para buscar">
											</div>
											<div class="col-md-2 input-group-sm">
												<label for="filtroCpf" class="form-label text-secondary fw-semibold">CPF do Usuário</label>
												<input type="text" name="filtroCpf" id="filtroCpf" oninput="mascaraCPF(this)" th:value="${filtro.filtroCpf}"
												       class="form-control" placeholder="000.000.000-00"><div class="invalid-feedback">CPF inválido</div>
											</div>

											<div th:replace="~{fragments/botoesBusca :: filtroStatus(${filtro})}"></div>
											<div th:replace="~{fragments/botoesBusca :: filtroLinhas(${filtro})}"></div>

											<div class="col-md-2 d-flex justify-content-end align-items-end  gap-1 input-group-sm">
												<div th:replace="fragments/botoesBusca :: btnLimpar(@{/usuarios}, 'Limpar Filtros')"></div>
												<div th:replace="fragments/botoesBusca :: btnBuscar('Aplicar Filtros')"></div>
											</div>

										</div>

									</form>
								</div>
								<div class="col-12">
									<div class="table-responsive d-none d-md-block">
										<table class="table table-striped table-bordered align-middle table-hover table-sm">
											<thead class="table-dark"	style="--bs-table-bg: #0c4a31; --bs-table-border-color: #4e9f73;">
											<tr>
												<th style="width: 5%;" class="text-center">Foto</th>
												<th>Nome</th>
												<th>CPF</th>
												<th>Login</th>
												<th>Telefone</th>
												<th class="text-center" style="width: 120px;">Status</th>
												<th class="text-center" style="width: 140px;">Ações</th>
											</tr>
											</thead>
											<tbody>
											<tr th:each="usuario : ${usuarios}">
												<td style="width: 5%;" class="text-center">
													<img th:if="${usuario.foto != null and !#strings.isEmpty(#strings.trim(usuario.foto))}"
													     th:src="${usuario.foto}"
													     class="foto-tabela"
													     alt="Foto Usuário">

													<img th:unless="${usuario.foto != null and !#strings.isEmpty(#strings.trim(usuario.foto))}"
													     th:src="@{/img/user.png}"
													     class="foto-tabela"
													     alt="Foto Usuário">
												</td>
												<td class="align-middle" th:text="${usuario.nome}">	</td>
												<td class="align-middle" th:text="${usuario.getCpfFormatado}"></td>
												<td class="align-middle" th:text="${usuario.login}"></td>
												<td class="align-middle" th:text="${usuario.telefone}"></td>
												<td  class="text-center align-middle">
													<form   th:if="${podeGerenciarCadastros}"
															th:action="@{'/usuarios/alterar-status/'+ ${usuario.id}+ '?'+ ${queryParams}}"
													      method="post"
													      class="d-inline">

														<button type="submit"
														        class="btn btn-link p-0 border-0 text-decoration-none"
														        data-bs-toggle="tooltip"
														        th:title="${usuario.status ? 'Inativar' : 'Ativar'}">

															<i th:if="${usuario.status}"
															   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
															</i>

															<i th:unless="${usuario.status}"
															   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
															</i>

														</button>

													</form>

													<!-- Se não tiver permissão, mostra apenas o status -->
													<span th:unless="${podeGerenciarCadastros}"
													      th:classappend="${usuario.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
															<i th:class="${usuario.status}
																	? 'fa-duotone fa-solid fa-circle-check'
																	: 'fa-duotone fa-solid fa-circle-xmark'">
															</i>

   													</span>

												</td>

												<td  class="text-center text-nowrap align-middle">
													<a	th:href="@{'/usuarios/detalhes/' + ${usuario.id} + '?'+ ${queryParams}}"
															class="btn btn-outline-sistema btn-sm px-2"
															data-bs-toggle="tooltip" title="Detalhes"> <i
															class="fa-duotone fa-eye"></i>
													</a>



													<a th:href="${podeGerenciarCadastros}? @{'/usuarios/editar/' + ${usuario.id} + '?' + ${queryParams}} : '#'"
													   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
													   class="btn btn-outline-sistema btn-sm px-2"
													   data-bs-toggle="tooltip"
													   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
														<i class="fa-duotone fa-pen-to-square"></i>
													</a>

													<a th:href="${podeGerenciarCadastros}? @{'/usuarios/detalhes/'+ ${usuario.id}+ '?acao=excluir&'
                                                       + ${queryParams}}: '#'" th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
													   class="btn btn-outline-sistema btn-sm px-2"
													   data-bs-toggle="tooltip"
													   title="Excluir">
														<i class="fa-duotone fa-trash"></i>
													</a>


												</td>

											</tr>
											</tbody>
										</table>
									</div>
									<!--reponsividade -->
									<div class="d-block d-md-none">
											<div th:each="usuario : ${usuarios}" class="card mb-3 shadow-sm">
												<div class="card-body">
													<!--TOPO -->
													<div class="d-flex align-items-center mb-2">
														<img th:src="${usuario.foto != null ? usuario.foto : '/img/user.png'}" alt="Usuário"
														style="width: 60px; height: 60px; object-fit: cover; border-radius: 10px;">
														<div class="ms-3 flex-grow-1">
															<div class="fw-bold" th:text="${usuario.nome}"></div>
															<small class="text-muted" th:text="${usuario.login}"></small>
														</div>
														<div>
															<form  th:if="${podeGerenciarCadastros}"
																   th:action="@{'/usuarios/alterar-status/'+ ${usuario.id}+ '?'+ ${queryParams}}"
															      method="post"
															      class="d-inline">

																<button type="submit"
																        class="btn btn-link p-0 border-0 text-decoration-none"
																        data-bs-toggle="tooltip"
																        th:title="${usuario.status ? 'Inativar' : 'Ativar'}">

																	<i th:if="${usuario.status}"
																	   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
																	</i>

																	<i th:unless="${usuario.status}"
																	   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
																	</i>

																</button>

															</form>


															<!-- Se não tiver permissão, mostra apenas o status -->
															<span th:unless="${podeGerenciarCadastros}"
															      th:classappend="${usuario.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">

															<i th:class="${usuario.status}
																	? 'fa-duotone fa-solid fa-circle-check'
																	: 'fa-duotone fa-solid fa-circle-xmark'">
															</i>

   															 </span>
														</div>

													</div>
													<div class="small text-muted mb-2">
														<div>
															<i class="fa-duotone fa-solid fa-address-card me-1"></i>
															<span th:text="${usuario.perfil}"></span>
														</div>
														<div>
															<i class="fa-duotone fa-solid fa-envelope me-1"></i>
															<span th:text="${usuario.email}"></span>

														</div>
														<div>
															<i class="fa-duotone fa-solid fa-circle-phone me-1"></i>
															<span th:text="${usuario.telefone}"></span>

														</div>
													</div>
													<div class="d-flex justify-content-end gap-2">
														<a	th:href="@{'/usuarios/detalhes/' + ${usuario.id} + '?'+ ${queryParams}}"
														      class="btn btn-outline-sistema btn-sm px-2"
														      data-bs-toggle="tooltip" title="Detalhes"> <i
																class="fa-duotone fa-eye"></i>
														</a>
														<a th:href="${podeGerenciarCadastros}? @{'/usuarios/editar/' + ${usuario.id} + '?' + ${queryParams}} : '#'"
														   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
														   class="btn btn-outline-sistema btn-sm px-2"
														   data-bs-toggle="tooltip"
														   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
															<i class="fa-duotone fa-pen-to-square"></i>
														</a>

														<a th:href="${podeGerenciarCadastros}? @{'/usuarios/detalhes/'+ ${usuario.id}+ '?acao=excluir&'
                                                       + ${queryParams}}: '#'" th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
														   class="btn btn-outline-sistema btn-sm px-2"
														   data-bs-toggle="tooltip"
														   title="Excluir">
															<i class="fa-duotone fa-trash"></i>
														</a>



													</div>
												</div>

											</div>

									</div><!-- fim do bloco que so aparece quando em telas pequenas -->
								</div>
							</div>

						</div>
						<div class="card-footer d-flex justify-content-end">

							<nav aria-label="Paginação">
								<ul class="pagination mb-0">

									<!-- Anterior -->
									<li class="page-item" th:classappend="${usuarios.first} ? 'disabled'">
										<a	class="page-link fs-7" th:href="@{/usuarios(page=${usuarios.number - 1},
										filtroNome=${filtro.filtroNome},
										filtroCpf=${filtro.filtroCpf},
										filtroStatus=${filtro.filtroStatus},
										size=${filtro.size})}">
										Anterior </a></li>

									<!-- Números -->
									<li
											th:each="i : ${#numbers.sequence(0, usuarios.totalPages-1)}"
											class="page-item"
											th:classappend="${i == usuarios.number} ? 'active'"><a
											class="page-link fs-7"
											th:href="@{/usuarios(page=${i},
										filtroNome=${filtro.filtroNome},
										filtroCpf=${filtro.filtroCpf},
										filtroStatus=${filtro.filtroStatus},
										size=${filtro.size})}"
											th:text="${i + 1}"> </a></li>

									<!-- Próxima -->
									<li class="page-item"
									    th:classappend="${usuarios.last} ? 'disabled'"><a
											class="page-link fs-7"
											th:href="@{/usuarios(page=${usuarios.number + 1},
										filtroNome=${filtro.filtroNome},
										filtroCpf=${filtro.filtroCpf},
										filtroStatus=${filtro.filtroStatus},
										size=${filtro.size})}">
										Próxima </a></li>

								</ul>
							</nav>

						</div>

					</div>
				</div>

			</div>

		</div>

	</div>


</body>
</html>
