<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Usuários</title>
</head>

<body>
<div layout:fragment="content">

	<div class="container-fluid p-2">
		<div class="row">

			<!-- BREADCRUMB -->
			<div class="col-12">
				<nav aria-label="breadcrumb card" style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a th:href="@{/home}">
								<i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a>
						</li>
						<li class="breadcrumb-item">
                            <span class="text-muted">
                                <i class="fa-duotone fa-solid fa-users"></i> Usuários - Lista
                            </span>
						</li>
					</ol>
				</nav>
			</div>

			<div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>

			<div class="col-12">
				<div class="card">

					<!-- HEADER (fragmento padrão) -->
					<div th:replace="~{fragments/componentes :: cardHeader(
                        'Usuários',
                        'Gerencie os registros de Usuários',
                        'user-gear',
                        '/usuarios/novo',
                        'Usuário',
                        ${queryParams}
                    )}"></div>

					<div class="card-body">
						<div class="row">
							<div class="col-12">

								<!-- FILTROS -->
								<form th:action="@{/usuarios}" method="get" class="filter-box mb-2">
									<input type="hidden" name="idEmpresa" th:value="${idEmpresa}">
									<div class="row g-3">
										<div class="col-md-5">
											<label class="form-label small fw-semibold text-secondary">Nome</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-user"></i></span>
												<input type="text" name="filtroNome" th:value="${filtro.filtroNome}"
												       class="form-control" placeholder="Digite para buscar">
											</div>
										</div>
										<div class="col-md-3">
											<label class="form-label small fw-semibold text-secondary">CPF</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-id-card"></i></span>
												<input type="text" name="filtroCpf" id="filtroCpf"
												       oninput="mascaraCPF(this)"
												       th:value="${filtro.filtroCpf}"
												       class="form-control" placeholder="000.000.000-00">
												<div class="invalid-feedback">CPF inválido</div>
											</div>
										</div>

										<div th:replace="~{fragments/componentes :: filtroStatus(${filtro}, 'col-md-2')}"></div>
										<div th:replace="~{fragments/componentes :: filtroLinhas(${filtro}, 'col-md-2')}"></div>
									</div>

									<div class="row g-3 mt-2">
										<div th:replace="~{fragments/componentes :: botoesFiltro('/usuarios', 'col-md-12')}"></div>
									</div>
								</form>

							</div>

							<div class="col-12">

								<!-- ===================================================== -->
								<!-- TABELA DESKTOP                                        -->
								<!-- ===================================================== -->
								<div class="d-none d-md-block">
									<table class="table table-modern align-middle mb-0">
										<thead>
										<tr>
											<th class="text-center" style="width: 70px;">Foto</th>
											<th style="width: 22%;">Nome</th>
											<th>CPF</th>
											<th>Login</th>
											<th>Telefone</th>
											<th class="text-center" style="width: 120px;">Status</th>
											<th class="text-center" style="width: 140px;">Ações</th>
										</tr>
										</thead>
										<tbody>

										<tr th:if="${usuarios.empty}">
											<td colspan="7">
												<div th:replace="~{fragments/componentes :: emptyState('Nenhum usuário encontrado com os filtros atuais.')}"></div>
											</td>
										</tr>

										<tr th:each="usuario : ${usuarios}">

											<!-- FOTO -->
											<td class="text-center">
												<img th:if="${usuario.foto != null and !#strings.isEmpty(#strings.trim(usuario.foto))}"
												     th:src="${usuario.foto}"
												     class="foto-tabela rounded-circle"
												     style="width: 42px; height: 42px; object-fit: cover; padding: 0;"
												     alt="Foto Usuário">

												<img th:unless="${usuario.foto != null and !#strings.isEmpty(#strings.trim(usuario.foto))}"
												     th:src="@{/img/user.png}"
												     class="foto-tabela rounded-circle"
												     style="width: 42px; height: 42px; object-fit: cover; padding: 0;"
												     alt="Foto Usuário">
											</td>

											<!-- NOME -->
											<td>
												<div class="fw-semibold text-dark" th:text="${usuario.nome}"></div>
												<small class="text-muted d-block">
													<i class="fa-duotone fa-solid fa-user-tag me-1"></i>
													<span th:text="${usuario.perfil}"></span>
												</small>
												<small class="text-muted d-block">
													<i class="fa-duotone fa-solid fa-envelope me-1"></i>
													<span th:text="${usuario.email}"></span>
												</small>
											</td>

											<td th:text="${usuario.getCpfFormatado}"></td>
											<td th:text="${usuario.login}"></td>
											<td>
												<div class="d-flex align-items-center gap-1">
													<span th:text="${usuario.telefone}"></span>
												</div>
											</td>

											<!-- STATUS (clicável) -->
											<td class="text-center align-middle">
												<form th:if="${podeGerenciarCadastros}"
												      th:action="@{'/usuarios/alterar-status/' + ${usuario.id} + '?' + ${queryParams}}"
												      method="post" class="d-inline">
													<button type="submit"
													        class="btn btn-link p-0 border-0 text-decoration-none"
													        data-bs-toggle="tooltip"
													        th:title="${usuario.status ? 'Inativar' : 'Ativar'}">
														<i th:if="${usuario.status}"
														   class="fa-duotone fa-solid fa-circle-check text-success fs-5"></i>
														<i th:unless="${usuario.status}"
														   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5"></i>
													</button>
												</form>

												<span th:unless="${podeGerenciarCadastros}"
												      th:classappend="${usuario.status} ? 'text-success' : 'text-danger'"
												      class="fw-semibold fs-5">
                                                    <i th:class="${usuario.status}
                                                          ? 'fa-duotone fa-solid fa-circle-check'
                                                          : 'fa-duotone fa-solid fa-circle-xmark'"></i>
                                                </span>
											</td>

											<!-- AÇÕES (fragmento padrão) -->
											<td class="text-center text-nowrap">
												<div th:replace="~{fragments/componentes :: acoes(
                                                    ${usuario.id},
                                                    '/usuarios',
                                                    ${queryParams},
                                                    'usuario'
                                                )}"></div>
											</td>
										</tr>
										</tbody>
									</table>
								</div>

								<!-- ===================================================== -->
								<!-- CARDS MOBILE                                          -->
								<!-- ===================================================== -->
								<div class="d-md-none">

									<div th:if="${usuarios.empty}">
										<div th:replace="~{fragments/componentes :: emptyState('Nenhum usuário encontrado com os filtros atuais.')}"></div>
									</div>

									<div class="d-flex flex-column gap-2">

										<div th:each="usuario : ${usuarios}" class="card card-mobile-modern">
											<div class="card-body p-3">

												<!-- Cabeçalho: foto + nome + status -->
												<div class="d-flex align-items-center gap-2 mb-2">

													<img th:if="${usuario.foto != null and !#strings.isEmpty(#strings.trim(usuario.foto))}"
													     th:src="${usuario.foto}"
													     class="rounded-circle border shadow-sm flex-shrink-0"
													     style="width: 46px; height: 46px; object-fit: cover;"
													     alt="Foto Usuário">

													<img th:unless="${usuario.foto != null and !#strings.isEmpty(#strings.trim(usuario.foto))}"
													     th:src="@{/img/user.png}"
													     class="rounded-circle border shadow-sm flex-shrink-0"
													     style="width: 46px; height: 46px; object-fit: cover;"
													     alt="Foto Usuário">

													<div class="min-w-0 flex-grow-1">
														<div class="fw-semibold text-dark text-truncate"
														     th:text="${usuario.nome}"></div>
														<small class="text-muted d-block text-truncate">
															<i class="fa-duotone fa-solid fa-user-tag me-1"></i>
															<span th:text="${usuario.login}"></span>
														</small>
													</div>

													<div class="flex-shrink-0">
														<form th:if="${podeGerenciarCadastros}"
														      th:action="@{'/usuarios/alterar-status/' + ${usuario.id} + '?' + ${queryParams}}"
														      method="post" class="d-inline">
															<button type="submit"
															        class="btn btn-link p-0 border-0 text-decoration-none"
															        data-bs-toggle="tooltip"
															        th:title="${usuario.status ? 'Inativar' : 'Ativar'}">
																<i th:if="${usuario.status}"
																   class="fa-duotone fa-solid fa-circle-check text-success fs-5"></i>
																<i th:unless="${usuario.status}"
																   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5"></i>
															</button>
														</form>

														<span th:unless="${podeGerenciarCadastros}"
														      th:classappend="${usuario.status} ? 'text-success' : 'text-danger'"
														      class="fw-semibold fs-5">
                                                            <i th:class="${usuario.status}
                                                                  ? 'fa-duotone fa-solid fa-circle-check'
                                                                  : 'fa-duotone fa-solid fa-circle-xmark'"></i>
                                                        </span>
													</div>
												</div>

												<!-- Perfil -->
												<small class="text-muted d-block text-truncate mb-1">
													<i class="fa-duotone fa-solid fa-address-card me-1"></i>
													<span th:text="${usuario.perfil}"></span>
												</small>

												<!-- Email -->
												<small class="text-muted d-block text-truncate mb-1">
													<i class="fa-duotone fa-solid fa-envelope me-1"></i>
													<span th:text="${usuario.email}"></span>
												</small>

												<!-- Telefone -->
												<small class="text-muted d-block mb-2"
												       th:if="${usuario.telefone != null and !usuario.telefone.isEmpty()}">
													<i class="fa-duotone fa-solid fa-phone me-1"></i>
													<span th:text="${usuario.telefone}"></span>
												</small>

												<hr class="pr-hr my-2"/>

												<!-- Ações -->
												<div class="d-flex justify-content-end">
													<div th:replace="~{fragments/componentes :: acoes(
                                                        ${usuario.id},
                                                        '/usuarios',
                                                        ${queryParams},
                                                        'usuario'
                                                    )}"></div>
												</div>

											</div>
										</div>

									</div>
								</div>

							</div>
						</div>
					</div>

					<!-- ===================================================== -->
					<!-- FOOTER / PAGINAÇÃO                                    -->
					<!-- ===================================================== -->
					<div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

						<small class="text-muted">
							Página <strong th:text="${usuarios.number + 1}"></strong>
							de <strong th:text="${usuarios.totalPages}"></strong>
							&bull;
							<span th:text="${usuarios.totalElements}"></span> registro(s)
						</small>

						<nav aria-label="Paginação">
							<ul class="pagination pagination-modern mb-0">

								<!-- Primeira -->
								<li class="page-item" th:classappend="${usuarios.first} ? 'disabled'">
									<a class="page-link"
									   th:href="@{/usuarios(
                                            page=0,
                                            filtroNome=${filtro.filtroNome},
                                            filtroCpf=${filtro.filtroCpf},
                                            filtroStatus=${filtro.filtroStatus},
                                            size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Primeira página">
										<i class="fa-duotone fa-solid fa-angles-left"></i>
									</a>
								</li>

								<!-- Anterior -->
								<li class="page-item" th:classappend="${usuarios.first} ? 'disabled'">
									<a class="page-link"
									   th:href="@{/usuarios(
                                            page=${usuarios.number - 1},
                                            filtroNome=${filtro.filtroNome},
                                            filtroCpf=${filtro.filtroCpf},
                                            filtroStatus=${filtro.filtroStatus},
                                            size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Anterior">
										<i class="fa-duotone fa-solid fa-chevron-left"></i>
									</a>
								</li>

								<th:block th:if="${usuarios.totalPages > 0}">
									<li th:each="i : ${#numbers.sequence(0, usuarios.totalPages - 1)}"
									    class="page-item"
									    th:classappend="${i == usuarios.number} ? 'active'">
										<a class="page-link"
										   th:href="@{/usuarios(
                                                page=${i},
                                                filtroNome=${filtro.filtroNome},
                                                filtroCpf=${filtro.filtroCpf},
                                                filtroStatus=${filtro.filtroStatus},
                                                size=${filtro.size})}"
										   th:text="${i + 1}"></a>
									</li>
								</th:block>

								<!-- Próxima -->
								<li class="page-item" th:classappend="${usuarios.last} ? 'disabled'">
									<a class="page-link"
									   th:href="@{/usuarios(
                                            page=${usuarios.number + 1},
                                            filtroNome=${filtro.filtroNome},
                                            filtroCpf=${filtro.filtroCpf},
                                            filtroStatus=${filtro.filtroStatus},
                                            size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Próxima">
										<i class="fa-duotone fa-solid fa-chevron-right"></i>
									</a>
								</li>

								<!-- Última -->
								<li class="page-item" th:classappend="${usuarios.last} ? 'disabled'">
									<a class="page-link"
									   th:href="@{/usuarios(
                                            page=${usuarios.totalPages - 1},
                                            filtroNome=${filtro.filtroNome},
                                            filtroCpf=${filtro.filtroCpf},
                                            filtroStatus=${filtro.filtroStatus},
                                            size=${filtro.size})}"
									   data-bs-toggle="tooltip" title="Última página">
										<i class="fa-duotone fa-solid fa-angles-right"></i>
									</a>
								</li>

							</ul>
						</nav>
					</div>

				</div>
			</div>

		</div>
	</div>

</div>
</body>
</html>
