<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Usuários</title>
</head>

<body>
<div layout:fragment="content">

	<div class="container-fluid p-2">
		<div class="row">

			<!-- BREADCRUMB -->
			<div class="col-12">
				<nav aria-label="breadcrumb card" style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a th:href="@{/home}">
								<i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a>
						</li>
						<li class="breadcrumb-item">
                         <span class="text-muted">
                            <i class="fa-duotone fa-solid fa-users"></i> Usuários - Lista
                         </span>
						</li>
					</ol>
				</nav>
			</div>

			<!-- MENSAGENS DE ALERTA -->
			<div class="col-12">
				<!-- Sucesso -->
				<div th:if="${msgOk}"
				     class="alert alert-success alert-dismissible fade show auto-close mb-4"
				     role="alert" id="successAlert">
					<i class="fa-duotone fa-solid fa-thumbs-up me-2"></i>
					<span th:text="${msgOk}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>

				<!-- Erro -->
				<div th:if="${msgErro}"
				     class="alert alert-danger alert-dismissible fade show auto-close mb-4"
				     role="alert" id="errorAlert">
					<i class="fa-duotone fa-solid fa-triangle-exclamation me-2"></i>
					<span th:text="${msgErro}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>
			</div>

			<!-- CARD PRINCIPAL DE CONTEÚDO -->
			<div class="col-12" style="margin-top: -15px;">
				<div class="card border-0 shadow-sm rounded-3">

					<!-- CABEÇALHO DO CARD -->
					<div class="card-header border-bottom py-3 d-flex justify-content-between align-items-center">
						<h6 class="mb-0 text-secondary fw-bold text-uppercase" style="letter-spacing: 0.5px;">Usuários</h6>

						<a th:if="${podeGerenciarCadastros and queryParams != null and queryParams != ''}"
						   th:href="@{'/usuarios/novo?' + ${queryParams}}"
						   class="btn btn-outline-sistema btn-sm"
						   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
						   data-bs-toggle="tooltip"
						   th:title="${podeGerenciarCadastros} ? 'Novo Registro' : 'Sem Permissão para incluir novo Registro'">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
						<a th:if="${podeGerenciarCadastros and (queryParams == null or queryParams == '')}"
						   th:href="@{/usuarios/novo}" class="btn btn-outline-sistema btn-sm"
						   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
						   data-bs-toggle="tooltip"
						   th:title="${podeGerenciarCadastros} ? 'Novo Registro' : 'Sem Permissão para incluir novo Registro'">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
						<a th:if="${!podeGerenciarCadastros}" href="#" class="btn btn-outline-sistema disabled">
							<i class="fa-duotone fa-plus"></i> Novo
						</a>
					</div>

					<!-- CORPO DO CARD (FILTROS + TABELA) -->
					<div class="card-body p-0">

						<!-- ÁREA DOS FILTROS -->
						<div class="p-3 border-bottom bg-light-subtle">
							<form th:action="@{/usuarios}" method="get">
								<input type="hidden" name="idEmpresa" th:value="${idEmpresa}">
								<div class="row g-2">
									<div class="col-md-6 input-group-sm">
										<label for="filtroNome" class="form-label text-secondary fw-semibold mb-1">Nome do Usuário</label>
										<input type="text" name="filtroNome" id="filtroNome" th:value="${filtro.filtroNome}"
										       class="form-control" placeholder="Digite para buscar">
									</div>
									<div class="col-md-2 input-group-sm">
										<label for="filtroCpf" class="form-label text-secondary fw-semibold mb-1">CPF do Usuário</label>
										<input type="text" name="filtroCpf" id="filtroCpf" oninput="mascaraCPF(this)" th:value="${filtro.filtroCpf}"
										       class="form-control" placeholder="000.000.000-00">
										<div class="invalid-feedback">CPF inválido</div>
									</div>

									<div th:replace="~{fragments/botoesBusca :: filtroStatus(${filtro})}"></div>
									<div th:replace="~{fragments/botoesBusca :: filtroLinhas(${filtro})}"></div>

									<div class="col-md-2 d-flex justify-content-end align-items-end gap-1 input-group-sm">
										<div th:replace="fragments/botoesBusca :: btnLimpar(@{/usuarios}, 'Limpar Filtros')"></div>
										<div th:replace="fragments/botoesBusca :: btnBuscar('Aplicar Filtros')"></div>
									</div>
								</div>
							</form>
						</div>

						<!-- TABELA DESKTOP (d-none d-md-block) -->
						<div class="table-responsive d-none d-md-block" style="overflow: hidden;">
							<table class="table table-hover align-middle m-0" style="table-layout: fixed;">
								<thead class="bg-light border-bottom">
								<tr class="text-secondary small text-uppercase" style="height: 42px; letter-spacing: 0.5px;">
									<th scope="col" class="text-center ps-3 fw-semibold" style="width: 70px;">Foto</th>
									<th scope="col" class="fw-semibold">Nome</th>
									<th scope="col" class="fw-semibold">CPF</th>
									<th scope="col" class="fw-semibold">Login</th>
									<th scope="col" class="fw-semibold">Telefone</th>
									<th scope="col" class="text-center fw-semibold" style="width: 100px;">Status</th>
									<th scope="col" class="text-center pe-4 fw-semibold" style="width: 150px;">Ações</th>
								</tr>
								</thead>
								<tbody class="border-top-0">
								<tr th:each="usuario : ${usuarios}">
									<!-- Foto -->
									<td class="text-center ps-3">
										<img th:if="${usuario.foto != null and !#strings.isEmpty(#strings.trim(usuario.foto))}"
										     th:src="${usuario.foto}"
										     class="foto-tabela rounded-circle border shadow-sm"
										     style="width: 36px; height: 36px; object-fit: cover;"
										     alt="Foto Usuário">

										<img th:unless="${usuario.foto != null and !#strings.isEmpty(#strings.trim(usuario.foto))}"
										     th:src="@{/img/user.png}"
										     class="foto-tabela rounded-circle border shadow-sm"
										     style="width: 36px; height: 36px; object-fit: cover;"
										     alt="Foto Usuário">
									</td>

									<!-- Dados -->
									<td class="fw-semibold text-dark" th:text="${usuario.nome}"></td>
									<td class="text-secondary small" th:text="${usuario.getCpfFormatado}"></td>
									<td class="text-secondary small" th:text="${usuario.login}"></td>
									<td class="text-secondary small" th:text="${usuario.telefone}"></td>

									<!-- Status -->
									<td class="text-center align-middle">
										<form th:if="${podeGerenciarCadastros}"
										      th:action="@{'/usuarios/alterar-status/'+ ${usuario.id}+ '?'+ ${queryParams}}"
										      method="post"
										      class="d-inline">

											<button type="submit"
											        class="btn btn-link p-0 border-0 text-decoration-none"
											        data-bs-toggle="tooltip"
											        th:title="${usuario.status ? 'Inativar' : 'Ativar'}">

												<i th:if="${usuario.status}"
												   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
												</i>

												<i th:unless="${usuario.status}"
												   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
												</i>
											</button>
										</form>

										<!-- Status sem permissão -->
										<span th:unless="${podeGerenciarCadastros}"
										      th:classappend="${usuario.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
                                        <i th:class="${usuario.status}
                                              ? 'fa-duotone fa-solid fa-circle-check'
                                              : 'fa-duotone fa-solid fa-circle-xmark'">
                                        </i>
                                     </span>
									</td>

									<!-- Ações (Separadas por gap-1) -->
									<td class="text-end pe-4">
										<div class="d-inline-flex gap-1 align-items-center">
											<a th:href="@{'/usuarios/detalhes/' + ${usuario.id} + '?'+ ${queryParams}}"
											   class="btn btn-outline-sistema btn-sm px-2"
											   data-bs-toggle="tooltip" title="Detalhes">
												<i class="fa-duotone fa-eye"></i>
											</a>

											<a th:href="${podeGerenciarCadastros}? @{'/usuarios/editar/' + ${usuario.id} + '?' + ${queryParams}} : '#'"
											   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
											   class="btn btn-outline-sistema btn-sm px-2"
											   data-bs-toggle="tooltip"
											   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
												<i class="fa-duotone fa-pen-to-square"></i>
											</a>

											<a th:href="${podeGerenciarCadastros}? @{'/usuarios/detalhes/'+ ${usuario.id}+ '?acao=excluir&' + ${queryParams}}: '#'"
											   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
											   class="btn btn-outline-sistema btn-sm px-2"
											   data-bs-toggle="tooltip"
											   title="Excluir">
												<i class="fa-duotone fa-trash"></i>
											</a>
										</div>
									</td>
								</tr>
								</tbody>
							</table>
						</div>

						<!-- CARDS MOBILE (d-block d-md-none) -->
						<div class="d-block d-md-none p-3 bg-light-subtle">
							<div th:each="usuario : ${usuarios}" class="card border mb-3 rounded-3 shadow-sm">
								<div class="card-body">
									<!-- Topo Mobile -->
									<div class="d-flex align-items-center mb-3">
										<img th:src="${usuario.foto != null ? usuario.foto : '/img/user.png'}" alt="Usuário"
										     class="rounded-circle border shadow-sm"
										     style="width: 50px; height: 50px; object-fit: cover;">
										<div class="ms-3 flex-grow-1">
											<div class="fw-bold text-dark" th:text="${usuario.nome}"></div>
											<small class="text-muted" th:text="${usuario.login}"></small>
										</div>
										<div>
											<form th:if="${podeGerenciarCadastros}"
											      th:action="@{'/usuarios/alterar-status/'+ ${usuario.id}+ '?'+ ${queryParams}}"
											      method="post"
											      class="d-inline">

												<button type="submit"
												        class="btn btn-link p-0 border-0 text-decoration-none"
												        data-bs-toggle="tooltip"
												        th:title="${usuario.status ? 'Inativar' : 'Ativar'}">

													<i th:if="${usuario.status}"
													   class="fa-duotone fa-solid fa-circle-check text-success fs-5">
													</i>

													<i th:unless="${usuario.status}"
													   class="fa-duotone fa-solid fa-circle-xmark text-danger fs-5">
													</i>
												</button>
											</form>

											<span th:unless="${podeGerenciarCadastros}"
											      th:classappend="${usuario.status} ? 'text-success' : 'text-danger'" class="fw-semibold fs-5">
                                        <i th:class="${usuario.status}
                                              ? 'fa-duotone fa-solid fa-circle-check'
                                              : 'fa-duotone fa-solid fa-circle-xmark'">
                                        </i>
                                     </span>
										</div>
									</div>

									<!-- Detalhes Mobile -->
									<div class="small text-muted mb-3 bg-light p-2 rounded-2">
										<div class="mb-1">
											<i class="fa-duotone fa-solid fa-address-card me-1"></i>
											<span th:text="${usuario.perfil}"></span>
										</div>
										<div class="mb-1">
											<i class="fa-duotone fa-solid fa-envelope me-1"></i>
											<span th:text="${usuario.email}"></span>
										</div>
										<div>
											<i class="fa-duotone fa-solid fa-circle-phone me-1"></i>
											<span th:text="${usuario.telefone}"></span>
										</div>
									</div>

									<!-- Ações Mobile -->
									<div class="d-flex justify-content-end gap-1">
										<a th:href="@{'/usuarios/detalhes/' + ${usuario.id} + '?'+ ${queryParams}}"
										   class="btn btn-outline-sistema btn-sm px-2"
										   data-bs-toggle="tooltip" title="Detalhes">
											<i class="fa-duotone fa-eye"></i>
										</a>

										<a th:href="${podeGerenciarCadastros}? @{'/usuarios/editar/' + ${usuario.id} + '?' + ${queryParams}} : '#'"
										   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
										   class="btn btn-outline-sistema btn-sm px-2"
										   data-bs-toggle="tooltip"
										   th:title="${podeGerenciarCadastros} ? 'Editar' : 'Sem permissão para editar'">
											<i class="fa-duotone fa-pen-to-square"></i>
										</a>

										<a th:href="${podeGerenciarCadastros}? @{'/usuarios/detalhes/'+ ${usuario.id}+ '?acao=excluir&' + ${queryParams}}: '#'"
										   th:classappend="${!podeGerenciarCadastros} ? ' disabled opacity-50'"
										   class="btn btn-outline-sistema btn-sm px-2"
										   data-bs-toggle="tooltip"
										   title="Excluir">
											<i class="fa-duotone fa-trash"></i>
										</a>
									</div>
								</div>
							</div>
						</div>

					</div>

					<!-- RODAPÉ DE PAGINAÇÃO INTEGRADO AO CARD -->
					<div class="card-footer  border-top-0 px-4 py-3 d-flex justify-content-between align-items-center">
                      <span class="text-secondary small">
                         Mostrando página <strong th:text="${usuarios.number + 1}">1</strong> de <strong th:text="${usuarios.totalPages}">1</strong>
                      </span>

						<nav aria-label="Paginação">
							<ul class="pagination pagination-sm mb-0 gap-1">

								<!-- Anterior -->
								<li class="page-item" th:classappend="${usuarios.first} ? 'disabled'">
									<a class="page-link border-0 rounded-2 text-dark fs-7" th:href="@{/usuarios(page=${usuarios.number - 1},
                                  filtroNome=${filtro.filtroNome},
                                  filtroCpf=${filtro.filtroCpf},
                                  filtroStatus=${filtro.filtroStatus},
                                  size=${filtro.size})}">
										Anterior
									</a>
								</li>

								<!-- Números -->
								<li th:each="i : ${#numbers.sequence(0, usuarios.totalPages-1)}"
								    class="page-item"
								    th:classappend="${i == usuarios.number} ? 'active'">
									<a class="page-link border-0 rounded-2 fs-7"
									   th:style="${i == usuarios.number} ? 'background-color: #0c4a31; color: #fff; font-weight: bold;' : 'color: #212529;'"
									   th:href="@{/usuarios(page=${i},
                                  filtroNome=${filtro.filtroNome},
                                  filtroCpf=${filtro.filtroCpf},
                                  filtroStatus=${filtro.filtroStatus},
                                  size=${filtro.size})}"
									   th:text="${i + 1}">
									</a>
								</li>

								<!-- Próxima -->
								<li class="page-item" th:classappend="${usuarios.last} ? 'disabled'">
									<a class="page-link border-0 rounded-2 text-dark fs-7" th:href="@{/usuarios(page=${usuarios.number + 1},
                                  filtroNome=${filtro.filtroNome},
                                  filtroCpf=${filtro.filtroCpf},
                                  filtroStatus=${filtro.filtroStatus},
                                  size=${filtro.size})}">
										Próxima
									</a>
								</li>

							</ul>
						</nav>
					</div>

				</div>
			</div>

		</div>
	</div>

</div>
</body>
</html>
