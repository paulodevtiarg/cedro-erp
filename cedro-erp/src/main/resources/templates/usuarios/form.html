<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/base}">

<head>
<title>Usuários</title>

</head>

<body>
	<div layout:fragment="content">
		<div class="container-fluid p-2">
			<div class="row">
				<div class="col-12">
					<nav aria-label="breadcrumb card"
						style="margin-top: -25px; font-size: 0.8rem;">
						<ol class="breadcrumb">
							<li class="breadcrumb-item">
								<a  class="text-decoration-none" th:href="@{/home}">
								     <i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							    </a>
							</li>
							<li class="breadcrumb-item">
								<a  class="text-decoration-none"	th:href="@{${queryParams != null and queryParams != ''} ? '/usuarios?' + queryParams : '/usuarios'}">
									<i class="fa-duotone fa-solid fa-users"></i> Usuários - Lista </a>
							</li>
							<li class="breadcrumb-item"><span class="text-muted"><i class="fa-duotone fa-solid fa-user-plus"></i> Novo Registro </span></li>


						</ol>
					</nav>
				</div>
				<div class="col-12">
					<!-- Mensagens de erro e de ok -->
					<div th:if="${msgOk}"
						class="alert alert-success alert-dismissible fade show mb-4"
						role="alert" id="successAlert">
						<i class="fa-duotone fa-solid fa-thumbs-up me-2"></i> <span
							th:text="${msgOk}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>

					<!-- Mensagem de Erro -->
					<div th:if="${msgErro}"
						class="alert alert-danger alert-dismissible fade show mb-4"
						role="alert" id="errorAlert">
						<i class="fa-duotone fa-solid fa-triangle-exclamation me-2"></i> <span
							th:text="${msgErro}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>
				</div>
				<div class="col-12">

					<form th:object="${usuario}"
						  th:action="${usuario.id == null} ? @{/usuarios/salvar} : @{'/usuarios/editar/' + ${usuario.id} + '?' + ${queryParams}}"
					      method="post" enctype="multipart/form-data">
						<input type="hidden" th:field="*{id}">
						<div class="card">
							<div class="card-header d-flex justify-content-between align-items-center fs-6 pr-custom-text fw-semibold text-uppercase">

								<h5 class="mb-0 text-secondary fs-6">Novo Registro</h5>
								<div class="d-flex gap-2">
									<a data-bs-toggle="tooltip" title="Cancelar Ação"	th:href="@{${queryParams != null and queryParams != ''} ? '/usuarios?' + queryParams :'/usuarios'}"
										class="btn btn-outline-danger btn-sm btn-formulario"> <i class="fa-duotone fa-solid fa-ban"></i> Cancelar
									</a>

									<button data-bs-toggle="tooltip" title="Salvar o Registro" type="submit" class="btn btn-outline-sistema btn-sm btn-formulario">
										<i class="fa-duotone fa-solid fa-floppy-disk"></i> SALVAR
									</button>
								</div>
							</div>
							<div class="card-body">
								<div class="row">
									<div class="col-md-1">
										<!-- foto -->
										<div class="foto-3x4-container-2"  th:classappend="${#fields.hasErrors('foto')} ? 'border border-danger' : ''">
											<label class="form-label fw-bold text-center fs-7 d-block">Foto 3x4</label>
											<!-- Preview da foto ou placeholder -->
											<div id="fotoPreviewArea">
												<div th:if="${!#strings.isEmpty(usuario.foto)}"	id="fotoExistente">
													<img th:src="${usuario.foto}" class="foto-3x4" alt="Foto do Usuário">
													<div class="nome-foto" th:text="${usuario.foto}"></div>
												</div>

												<div th:if="${#strings.isEmpty(usuario.foto)}" id="fotoPlaceholder" class="foto-placeholder  small-pr">
													<i class="fa-duotone fa-solid fa-user"></i><span>Sem foto</span>
												</div>

												<div id="fotoPreview" style="display: none;">
													<img id="fotoPreviewImg" class="foto-3x4" alt="Preview">

												</div>
											</div>

											<!-- Botão para upload -->
											<label for="arquivoFoto" class="btn btn-outline-sistema btn-sm btn-foto">
												<i	class="fa-duotone fa-solid fa-camera"></i>
											</label>
											<input type="file" class="d-none" name="arquivoFoto" id="arquivoFoto" accept="image/jpeg,image/png,image/gif"
											       onchange="previewFoto3x4(this)">
											<small	class="text-muted d-block text-center small-pr">JPG, PNG até 5MB </small>
											<div class="text-center mt-2 pr-textdanger"  th:if="${#fields.hasErrors('foto')}"
											     th:errors="*{foto}"></div>
										</div>
									</div>
									<div class="col-md-11">
										<div class="row">
											<div class="col-md-6">
												<label class="form-label fw-semibold text-secondary">
													Nome Usuário * </label>
												<input type="text" th:field="*{nome}" id="nome" placeholder="Digite o Nome do novo Usuário"  class="form-control"
												       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''">
												<div class="invalid-feedback d-block"
												     style="min-height: 20px;"
												     th:if="${#fields.hasErrors('nome')}"
												     th:errors="*{nome}">
												</div>
											</div>
											<div class="col-md-3">
												<label class="form-label fw-semibold text-secondary">Login * </label>
												<input data-no-uppercase type="text" th:field="*{login}" id="login" placeholder="Digite um Login para o novo Usuário"  class="form-control"
												       th:classappend="${#fields.hasErrors('login')} ? 'is-invalid' : ''">
												<div class="invalid-feedback d-block"
												     style="min-height: 20px;"
												     th:if="${#fields.hasErrors('login')}"
												     th:errors="*{login}">
												</div>

											</div>
											<div class="col-md-3">
												<label class="form-label fw-semibold text-secondary">CPF * </label>
												<input type="text" th:field="*{cpf}" id="cpf" placeholder="000.000.000-00"  oninput="mascaraCPF(this)" class="form-control"
												       th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid' : ''">
												<div class="invalid-feedback d-block"
												     style="min-height: 20px;"
												     th:if="${#fields.hasErrors('cpf')}"
												     th:errors="*{cpf}">
												</div>

											</div>

										</div>
										<div class="row mt-2">
											<div class="col-md-3">
												<label class="form-label fw-semibold text-secondary">E-mail * </label>
												<input data-no-uppercase type="text" th:field="*{email}" id="email" placeholder="Digite um E-mail Válido"  class="form-control"
												       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''">
												<div class="invalid-feedback d-block"
												     style="min-height: 20px;"
												     th:if="${#fields.hasErrors('email')}"
												     th:errors="*{email}">
												</div>
											</div>
											<div class="col-md-3">
												<label class="form-label fw-semibold text-secondary">Telefone </label>
												<input type="text" th:field="*{telefone}" id="telefone" placeholder="(00)00000-0000" oninput="mascaraTelefone(this)" class="form-control"
												       >

											</div>
											<div class="col-md-3">

												<label for="idDepartamento"
												       class="form-label fw-semibold text-secondary">
													Departamento *
												</label>

												<select class="form-select"
												        th:field="*{idDepartamento}"
												        id="idDepartamento"
												        th:classappend="${#fields.hasErrors('idDepartamento')} ? 'is-invalid' : ''">

													<option value="">Selecione</option>

													<option th:each="d : ${departamentos}"
													        th:value="${d.id}"
													        th:text="${d.nome}">
													</option>

												</select>

												<div class="invalid-feedback"
												     th:if="${#fields.hasErrors('idDepartamento')}"
												     th:errors="*{idDepartamento}">
												</div>

											</div>
											<div class="col-md-3">
												<label for="perfil" class="form-label fw-semibold text-secondary">Perfil * </label>
												<select class="form-select" th:field="*{perfil}" id="perfil"
														th:classappend="${#fields.hasErrors('perfil')} ? 'is-invalid' : ''">

												<option value="">Selecione</option>

												<option th:each="g : ${perfis}" th:value="${g}"
												        th:text="${g.descricao}"></option>

											</select>

												<div class="invalid-feedback d-block"
												     style="min-height: 20px;"
												     th:if="${#fields.hasErrors('perfil')}"
												     th:errors="*{perfil}"></div>
											</div>
										</div>
										<div class="row mt-2">
											<div class="col-md-3">
												<label for="senha" class="form-label">
													<span th:text="${usuario.id == null} ? 'Senha *' : 'Nova Senha'"></span>
												</label>
												<input type="password" class="form-control" th:field="*{senha}" id="senha" minlength="6" placeholder="Digite a senha"
												                th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid' : ''">
												<div class="invalid-feedback d-block" style="min-height: 20px;" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
												<small class="text-muted" th:if="${usuario.id != null}"> Deixe em branco para manter a senha atual </small>
											</div>
											<div class="col-md-3">
												<label for="confirmarSenha" class="form-label">
													<span th:text="${usuario.id == null} ? 'Confirmar Senha *' : 'Confirmar Nova Senha'"></span>
												</label>

												<input type="password"
												       class="form-control"
												       th:field="*{confirmarSenha}"
												       id="confirmarSenha"
												       minlength="6"
												       placeholder="Confirme a senha">

												<div id="erroConfirmarSenha"
												     class="invalid-feedback">
													As senhas não conferem.
												</div>
											</div>
											<div class="col-md-6">
												<label class="form-label fw-semibold text-secondary"> Empresa </label>
												<input type="text" th:value="${usuarioLogado.nomeEmpresa}"  class="form-control" disabled>

											</div>


										</div>

									</div>

								</div>
								<div class="row mt-2">
									<div class="col-md-2">
										<label class="form-label fw-semibold text-secondary"> Data Cadastro </label>
										<input type="text"
										       th:value="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}"
										       class="form-control"
										       disabled>

									</div>
									<div class="col-md-3">
										<label class="form-label fw-semibold text-secondary">
											Primeiro acesso
										</label>
										<div class="mt-1">
											<div class="d-flex gap-2 align-items-center">
												<div class="form-check">
													<input class="form-check-input"
													       type="checkbox"
													       th:field="*{primeiroAcesso}"
													       id="primeiroAcesso">

													<label class="form-check-label"
													       for="primeiroAcesso">
														Solicitar alteração da senha no primeiro acesso
													</label>
												</div>
											</div>
										</div>

									</div>
									<div class="col-md-3">
										<label class="form-label fw-semibold text-secondary">Ativo?</label>
										<div class="mt-1">
											<div class="d-flex gap-3 align-items-start">
												<div class="form-check">
													<input class="form-check-input"
													       type="radio"
													       th:field="*{status}"
													       value="true"
													       id="statusSim">
													<label class="form-check-label"  for="statusSim">SIM</label>
												</div>

												<div class="form-check">
													<input class="form-check-input"
													       type="radio"
													       th:field="*{status}"
													       value="false"
													       id="statusNao">
													<label class="form-check-label" for="statusNao">NÃO</label>
												</div>

											</div>
										</div>


									</div>

								</div>

								<!-- fim da col dentro do bdy -->
							</div>

						</div>
                        <div th:replace="~{fragments/footerForm :: footerForm}"></div>
					</form>
				</div>
				<!-- fim do card -->

			</div>

		</div>
		<!-- FIM DO CARD -->



		<div id="modalImagem" class="modal-img">
			<span class="fechar" onclick="fecharModal()">&times;</span> <img
				id="imgModalConteudo">
		</div>
	</div>
</body>
</html>
